  /customers/bulk-import-sumsub-tokens:
    post:
      tags:
        - Onboarding
      summary: Bulk import customers from Sumsub share tokens
      description: |
        Processes multiple Sumsub share tokens in a single request. For each token, the
        system redeems it with Sumsub, extracts the applicant's name and identity data,
        creates a customer and individual application, and imports documents.
        Customer names are derived automatically from Sumsub data.
      operationId: bulkImportFromSumsubTokens
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokens
              properties:
                tokens:
                  type: array
                  description: List of Sumsub share tokens to import
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
            example:
              tokens:
                - _act-sbx-jwt-eyJhbGciOiJub25lIn0...
                - _act-sbx-jwt-eyKhbGciOiJub25lIn0...
      responses:
        '200':
          description: Bulk import completed (individual results may include errors)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  succeeded:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        success:
                          type: boolean
                        customer_id:
                          type: string
                        application_id:
                          type: string
                        error:
                          type: string
              example:
                total: 2
                succeeded: 1
                failed: 1
                results:
                  - name: Sarah Williams (from Sumsub)
                    success: true
                    customer_id: abc123
                    application_id: def456
                  - name: Unknown
                    success: false
                    error: Share token expired
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.platform.dakota.xyz/problems/invalid-request
                title: Invalid Request
                status: 400
                detail: Request body must contain at least one item
                instance: https://api.platform.dakota.xyz/customers/bulk-import-sumsub-tokens
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.platform.dakota.xyz/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Unauthorized
                instance: https://api.platform.dakota.xyz/customers/bulk-import-sumsub-tokens
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
  /customers/import-persona-tokens:
    post:
      tags:
        - Onboarding
      summary: Import customers from Persona Connect share tokens
      description: |
        Starts an asynchronous import job for Persona Connect share tokens (`cnst_...`).
        For each token, Dakota redeems it with Persona, maps the verified identity data
        into a new customer and individual application, and imports documents.

        Unlike the Sumsub import, Persona redemption is asynchronous on Persona's side,
        so this endpoint returns immediately with a job. Poll
        `GET /customers/persona-import-jobs/{job_id}` for per-token results. Tokens are
        validated and de-duplicated up front; skipped tokens never block accepted ones.
        A skipped token is a token string that could not be queued (malformed, a
        duplicate in the batch, or already imported) — it is NOT a compliance decision
        about a person or application.
      operationId: importPersonaTokens
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokens
              properties:
                tokens:
                  type: array
                  description: Persona Connect share tokens (cnst_...) to import. Up to 5,000 per request — split larger migrations into multiple batches (each returns its own job).
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: string
            example:
              tokens:
                - cnst_ABC123def456
                - cnst_GHI789jkl012
      responses:
        '202':
          description: Import job accepted and queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  total:
                    type: integer
