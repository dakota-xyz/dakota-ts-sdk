              example: DEUTDEFFXXX
            account_holder_name:
              type: string
              example: John Doe
              minLength: 3
              maxLength: 140
            account_holder_address:
              $ref: '#/components/schemas/Address'
            account_holder_phone:
              type: string
              example: '1234567890'
            bank_name:
              type: string
              example: Deutsche Bank
            bank_address:
              description: Address of the bank. Required if BIC is provided (for SWIFT transfers).
