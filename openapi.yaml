    get:
      tags:
        - Transactions
      summary: List transactions
      description: |-
        List transactions across the supported transaction resource families: `one_off`, `auto_account`, and `wallet`. Each returned row carries a `resource_type` discriminator, and a single response contains rows from exactly one family.

        **The response family is selected as follows.** Set `transaction_type` to choose the family explicitly. The `wallet` family is only reachable this way: `transaction_type=wallet`. The `wallet_id` and `direction` filters require `transaction_type=wallet`, and supplying either without it is rejected with `400`, not routed to the wallet family. The `auto_account` family requires `customer_id`: `transaction_type=auto_account` without a `customer_id` is rejected with `400`.

        If you omit `transaction_type`, the family is inferred from the other query parameters, between `one_off` and `auto_account` only:

        - `destination_id`, `status`, `source_network_id`, `source_asset`, or `destination_asset` present → `one_off`.
        - `customer_id` present (and none of the above) → `auto_account`.
        - none of the above (no filters) → `one_off`.

        **Because `customer_id` on its own selects the `auto_account` family,** `GET /transactions?customer_id=X` returns that customer's auto-account transactions, not their one-off transactions, even though an unfiltered `GET /transactions` returns one-off transactions. `meta.total_count` reflects only the selected family, so it is not a count across all of a customer's transactions. To list a customer's one-off transactions, send `transaction_type=one_off&customer_id=X`; to list their auto-account transactions explicitly, send `transaction_type=auto_account&customer_id=X`.

        The selected family is reported back on the response as `meta.transaction_type`, so an empty page still tells you which family was listed.

        Filters documented below as applying to "one-off transactions" only take effect within the `one_off` family; combine them with `transaction_type=one_off` to be explicit.
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/StartingAfterParam'
        - $ref: '#/components/parameters/EndingBeforeParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: transaction_type
          in: query
          description: Select the transaction resource family (`one_off`, `auto_account`, or `wallet`) to return. When omitted, the family is inferred from the other parameters (see the endpoint description).
          required: false
          schema:
            $ref: '#/components/schemas/TransactionResourceType'
        - name: customer_id
          in: query
          description: 'Filter transactions by customer ID, within the selected resource family. Note: when `transaction_type` is omitted, supplying `customer_id` alone selects the `auto_account` family, so the result is that customer''s auto-account transactions. To filter one-off transactions by customer, also send `transaction_type=one_off`.'
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: wallet_id
          in: query
          description: Filter wallet transactions by wallet ID. Only valid with `transaction_type=wallet`.
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: direction
          in: query
          description: 'Filter wallet transactions by direction relative to the wallet: `out` matches transactions sent from the wallet; `in` matches transactions recorded with the wallet as the recipient. The platform records outbound wallet sends today, so `in` returns rows once inbound ingestion records deposits. Only valid with `transaction_type=wallet`.'
          required: false
          schema:
            type: string
            enum:
              - in
              - out
        - name: destination_id
          in: query
          description: Filter transactions by destination ID.
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: status
          in: query
          description: Filter one-off transactions by status.
          required: false
          schema:
            $ref: '#/components/schemas/OneOffTransactionStatus'
        - name: source_network_id
          in: query
          description: Filter one-off transactions by source network ID.
          required: false
          schema:
            $ref: '#/components/schemas/NetworkId'
        - name: source_asset
          in: query
          description: Filter one-off transactions by source asset.
          required: false
          schema:
            type: string
        - name: destination_asset
          in: query
          description: Filter one-off transactions by destination asset.
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: Field to sort one-off transactions by. Defaults to `created_at`.
          required: false
          schema:
            type: string
            enum:
              - amount
              - created_at
              - customer_name
              - status
        - name: sort_dir
          in: query
          description: Sort direction. Defaults to `desc`.
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: created_at_from
          in: query
          description: Filter one-off transactions created at or after this ISO 8601 datetime (e.g. 2024-01-01T00:00:00Z).
          required: false
          schema:
            type: string
            format: date-time
        - name: created_at_to
          in: query
          description: Filter one-off transactions created at or before this ISO 8601 datetime (e.g. 2024-12-31T23:59:59Z).
          required: false
          schema:
            type: string
            format: date-time
        - name: amount_min
          in: query
          description: Filter one-off transactions by minimum destination amount (inclusive).
          required: false
          schema:
            type: string
        - name: amount_max
          in: query
          description: Filter one-off transactions by maximum destination amount (inclusive).
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Free-text search across customer name, customer email, and transaction ID.
          required: false
          schema:
            type: string
        - name: statuses
          in: query
          description: Comma-separated list of statuses to filter by (e.g. `pending,completed,failed`). Takes precedence over `status` when both are provided.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionResourceResponse'
              example:
                data:
                  - id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                    resource_type: one_off
                    customer_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                    crypto_address: '0x1234567890abcdef1234567890abcdef12345678'
                    send_amount: '1.24'
                    status: pending
                    amount: '1.23'
                    source_network_id: ethereum-mainnet
                    source_asset: USDC
                    destination_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                    destination_asset: USD
                    receipt:
                      imad: string
                      omad: string
                      input:
                        amount: string
                        asset: string
                        network: string
                      subtotal:
                        amount: string
                        asset: string
                        network: string
                      converted:
                        amount: string
                        asset: string
                        network: string
                      output:
                        amount: string
                        asset: string
                        network: string
                      exchange_rate: string
                      external_fee:
                        amount: string
                        asset: string
                        network: string
                      dakota_fee:
                        amount: string
                        asset: string
                        network: string
                      client_fee:
                        amount: string
                        asset: string
                        network: string
                      gas_fee:
                        amount: string
                        asset: string
                        network: string
                      payment_reference: Invoice payment for services
                    crypto_details:
                      source_crypto_address: string
                      source_network_id: ethereum-mainnet
                      destination_crypto_address: string
                      destination_network_id: ethereum-mainnet
                      deposit_transaction_hash: string
                      transaction_hash: string
                    created_at: 1234567890
                    updated_at: 1234567890
                    completed_at: 1234567890
                    destination_payment_rail: ach
                    payment_reference: string
                    destination_bank_name: Chase Bank
                    destination_account_holder_name: Acme Corporation
                    destination_account_number_last_four: '6789'
                    destination_routing_number: '021000021'
                    destination_iban: GB82WEST12345698765432
                    destination_bic: BARCGB22XXX
                meta:
                  total_count: 100
                  has_more_after: true
                  has_more_before: false
                  transaction_type: one_off
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: Invalid request
                instance: https://api.platform.dakota.xyz/transactions
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#authentication-error
                title: Unauthorized
                status: 401
                detail: Unauthorized
                instance: https://api.platform.dakota.xyz/transactions
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
