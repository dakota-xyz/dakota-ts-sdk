  /accounts:
    post:
      tags:
        - Accounts
      summary: Create an account
      description: Create a new onramp, offramp, or swap account.
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SandboxScenarioHeader'
        - $ref: '#/components/parameters/SandboxErrorStepHeader'
        - $ref: '#/components/parameters/SandboxErrorStatusHeader'
        - $ref: '#/components/parameters/SandboxErrorMessageHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
            examples:
              onramp:
                summary: Onramp — receive fiat, deliver crypto
                description: |-
                  `capabilities` lists the inbound rails the deposit details
                  accept and is required here. `rail` is omitted, so the account
                  serves every rail those capabilities cover.
                value:
                  account_type: onramp
                  capabilities:
                    - us_bank_account
                  crypto_destination_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                  destination_network_id: ethereum-mainnet
                  source_asset: USD
                  destination_asset: USDC
                  developer_fee_bps: 50
              offramp:
                summary: Offramp — receive crypto, deliver fiat
                description: |-
                  `rail` is the outbound rail the payout leaves on and is
                  required here; `capabilities` has no effect. This is the only
                  account type that accepts `payment_reference`.
                value:
                  account_type: offramp
                  rail: ach
                  fiat_destination_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                  source_network_id: ethereum-mainnet
                  source_asset: USDC
                  destination_asset: USD
                  payment_reference: Invoice 12345
                  return_address:
                    network_id: ethereum-mainnet
                    crypto_address: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
                  developer_fee_bps: 50
              swap:
                summary: Swap — receive crypto, deliver crypto
                description: |-
                  Both legs are onchain, so neither `capabilities` nor `rail`
                  applies; the source and destination network IDs carry the
                  routing.
                value:
                  account_type: swap
                  crypto_destination_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                  destination_network_id: ethereum-mainnet
                  source_network_id: base-mainnet
                  source_asset: USDC
                  destination_asset: USDC
                  return_crypto_address:
                    network_id: base-mainnet
                    crypto_address: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
                  developer_fee_bps: 50
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
