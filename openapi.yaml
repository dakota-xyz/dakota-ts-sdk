openapi: 3.0.3
info:
  title: Dakota Platform API
  version: 1.0.0
  description: |-
    Combined API specification for Dakota Platform services:
    - Issuance API: Asset minting and burning operations
    - Onboarding API: Know Your Business/Customer verification
    - On/Off Ramp API: Managing on-ramp and off-ramp accounts
    - Recipients API: Managing destinations for KYB'd entities
    - Transactions API: Viewing transaction history across platform operations

    ## Authentication and API Headers

    All API endpoints require the following headers:

    - `x-idempotency-key`: Required for all POST endpoints to ensure request idempotency
    - `x-api-key`: Required for authentication across all endpoints

    Note: On /applications endpoints you need a token for authentication instead of a x-api-key
    - `x-application-token`: Required for authentication on public /applications endpoints (alternative to `x-api-key` where documented)


    ## Rate Limits

    Requests are rate limited per API key. Every response includes the following headers:

    | Header | Description |
    | --- | --- |
    | `X-RateLimit-Limit` | Maximum requests allowed in the current one-minute window. |
    | `X-RateLimit-Remaining` | Requests remaining in the current window. |
    | `X-RateLimit-Reset` | Absolute Unix timestamp (seconds since epoch) when the current rate-limit window resets. |

    When a request is throttled (`429`), responses also include `Retry-After` with seconds to wait before retrying.
servers:
  - url: https://api.platform.dakota.xyz
    description: Production environment
  - url: https://api.platform.sandbox.dakota.xyz
    description: Sandbox — safe for testing with simulated data
security:
  - ApiKeyAuth: []
tags:
  - name: Agentic Payments
    x-alpha: true
    description: |-
      Alpha — agent-driven payments: provision agents, draft and approve spending mandates, accept reviewed instructions, and manage scheduled payments.

      **Prerequisites:** Customer onboarded; signer groups attached for recognition.
      **Related:** Wallets, Signer Groups, Transactions
  - name: Mandates
    x-alpha: true
    description: |-
      Alpha — spending mandates: signed, signer-bound authorizations governing what may be spent, approved or cancelled by a second recognized signer (§8 — the dual-control rule that every mandate mutation must be signed by a recognized signer OTHER than the bound one). Independent of agents and scheduled payments.

      **Prerequisites:** Signer groups attached for recognition.
      **Related:** Signer Groups, Transactions
  - name: Insights
    x-alpha: true
    description: |-
      Alpha — read-only account insight: a deterministic report over a customer's agentic activity (funding balances, upcoming obligations, failures, mandate headroom and expiry) plus an advisory chat that narrates it. Never moves money, never creates or changes anything.

      **Prerequisites:** Customer onboarded; insight is computed from the customer's scheduled payments, mandates, and wallets.
      **Related:** Agentic Payments, Mandates
  - name: Customers
    description: |-
      Manage customer entities representing businesses and organizations onboarded to Dakota.

      **Prerequisites:** Complete KYB via Onboarding endpoints before initiating money movement.
      **Related:** Onboarding, Recipients, Transactions, Accounts, Wallets
  - name: Wallets
    description: |-
      Manage wallets, balances, and wallet-to-signer-group relationships for custody and movement controls.

      **Prerequisites:** Customer must exist. Configure signer groups before policy-enforced workflows.
      **Related:** Signer Groups, Policies, Transactions, Customers
  - name: Transactions
    description: |-
      Create, cancel, and retrieve transaction records across account and wallet flows.

      **Prerequisites:** Accounts or destinations must be configured based on flow type.
      **Related:** Accounts, Recipients, Policies, Events
  - name: Recipients
    description: |-
      Manage recipient entities and destination rails used by customers for payouts and transfers.

      **Prerequisites:** Customer must be onboarded and active.
      **Related:** Customers, Transactions, Accounts, Onboarding
  - name: Accounts
    description: |-
      Manage account resources used for onramp, offramp, and swap operations.

      **Prerequisites:** Customer must be created and network/asset constraints must be known.
      **Related:** Customers, Transactions, Auto Transactions, Info
  - name: Auto Transactions
    description: |-
      Manage automated transaction configurations and execution history for account automation workflows.

      **Prerequisites:** Source account must exist and be configured for automation.
      **Related:** Accounts, Transactions, Events
  - name: Onboarding
    description: |-
      Manage KYB/KYC onboarding lifecycle, application documents, attestations, and verification steps.

      **Prerequisites:** Customer context and required entity/application metadata.
      **Related:** Customers, Exceptions, Recipients, Transactions
  - name: Policies
    description: |-
      Define and manage policy objects and rules used for transaction governance and risk controls.

      **Prerequisites:** Wallet and signer group resources should be configured for enforcement scenarios.
      **Related:** Wallets, Signer Groups, Transactions
  - name: Signer Groups
    description: |-
      Manage signer groups and signer assignments for multi-party authorization models.

      **Prerequisites:** Wallets should exist before linking signer groups.
      **Related:** Wallets, Policies, Transactions
  - name: Authentication
    description: |-
      Manage API authentication credentials and key lifecycle for platform access.

      **Prerequisites:** Client organization must be provisioned.
      **Related:** Users, Info
  - name: Users
    description: |-
      Manage client users, roles, and identity metadata for platform access control.

      **Prerequisites:** Auth credentials and client context must be established.
      **Related:** Authentication
  - name: Webhooks
    description: |-
      Manage outbound webhook targets and delivery configuration for event notifications.

      **Prerequisites:** Subscriber endpoint must be reachable and secured.
      **Related:** Events, Authentication
  - name: Payouts
    description: |-
      Manage where Dakota sends your accrued developer-fee payouts.

      **Prerequisites:** Auth credentials and client context must be established.
      **Related:** Events
  - name: Events
    description: |-
      Retrieve event records emitted by platform operations for audit and troubleshooting.

      **Prerequisites:** Requesting client must have access to referenced resources.
      **Related:** Webhooks, Transactions, Onboarding
  - name: Info
    description: |-
      Read platform capability metadata, such as supported rails, networks, and assets.
      These operations are served under `/capabilities/*` - `GET /capabilities/countries`
      and `GET /capabilities/networks`. The tag name does not appear in the request paths.

      **Prerequisites:** Valid authentication headers.
      **Related:** Accounts, Transactions
  - name: Sandbox
    description: |-
      Trigger sandbox-only simulation endpoints for safe end-to-end integration testing with synthetic data. The sandbox host (`https://api.platform.sandbox.dakota.xyz`) also accepts a family of `X-Sandbox-*` request headers on most write endpoints (`Customers`, `Accounts`, `Transactions`, simulate endpoints) that let integrators drive deterministic failure modes — pick a preset via `X-Sandbox-Scenario`, or compose a custom one with `X-Sandbox-Error-Step`/`X-Sandbox-Error-Status`/`X-Sandbox-Error-Message`. `X-Sandbox-Instant-Completion` collapses async flows to a single synchronous step, and `X-Sandbox-Skip-Auto-Approval` keeps newly created KYB applications in `pending` for manual-review testing. All `X-Sandbox-*` headers are ignored in production.

      **Prerequisites:** Sandbox environment and test customer data.
      **Related:** Customers, Accounts, Transactions, Onboarding
  - name: Legal
    description: |-
      The legal documents customers accept — terms of service, privacy policy,
      e-sign notice, and partner agreements.

      Dakota publishes these here, and this is the authoritative source: the
      hosted onboarding flow, the dakota.xyz website, and your own integration
      all read the same revisions. Present the current revision to your customer
      before capturing their acceptance so the record reflects the text they
      actually saw.
paths:
  /customers:
    post:
      tags:
        - Customers
      summary: Create a customer record
      description: Creates a new customer for the authenticated client and returns the created customer record.
      operationId: createCustomer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SandboxScenarioHeader'
        - $ref: '#/components/parameters/SandboxErrorStepHeader'
        - $ref: '#/components/parameters/SandboxErrorStatusHeader'
        - $ref: '#/components/parameters/SandboxErrorMessageHeader'
        - $ref: '#/components/parameters/SandboxSkipAutoApprovalHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
            example:
              name: Acme Corporation
              customer_type: business
              external_id: external_customer_123
      responses:
        '201':
          description: Customer record successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreateResponse'
              example:
                id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                kyb_links:
                  - provider_id: trm_labs
                    link_type: persona
                    url: https://verify.provider.com/kyb/a1b2c3d4e5f6
                    status: pending
                    created_at: 1234567890
                    updated_at: 1234567890
                    expires_at: 1234567890
                    deleted_at: 1234567890
                application_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                application_url: https://apply.dakota.com/applications/2WGC9cKv9P4K8eGzqY6qJ3Xz7Qm?token=kJ8xN3zQ9mL2pR5vY7wC1aF4dG6hK0sT8uW3nB5eM9
                application_expires_at: 1734567890000000000
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: Invalid request
                instance: https://api.platform.dakota.xyz/customers
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#authentication-error
                title: Unauthorized
                status: 401
                detail: Unauthorized
                instance: https://api.platform.dakota.xyz/customers
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#forbidden
                title: Forbidden
                status: 403
                detail: Forbidden
                instance: https://api.platform.dakota.xyz/customers
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        default:
          description: Unexpected error
      externalDocs:
        description: Read full guide in docs
        url: https://docs.dakota.xyz/api-reference/customers/create-a-customer-record
    get:
      tags:
        - Customers
      summary: List all customer records
      description: Returns a paginated list of customers for the authenticated client. Supports cursor pagination and optional `external_id` or `search` filters.
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/StartingAfterParam'
        - $ref: '#/components/parameters/EndingBeforeParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: external_id
          in: query
          description: Filter customers by external ID
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Search customers by name, email, or customer ID (case-insensitive)
          required: false
          schema:
            type: string
        - name: kyb_status
          in: query
          description: Filter customers by KYB status (single value).
          required: false
          schema:
            $ref: '#/components/schemas/KybStatus'
        - name: kyb_statuses
          in: query
          description: Filter customers by one or more KYB statuses. Comma-separated list (e.g. `active,frozen`).
          required: false
          schema:
            type: string
        - name: kyc_statuses
          in: query
          description: |
            Filter customers by one or more effective KYC/B link statuses.
            Comma-separated list (e.g. `pending,in_review`). Values mirror
            the `KybLinkStatus` enum (`not_started`, `pending`, `in_review`,
            `approved`, `expired`, `rejected`).
          required: false
          schema:
            type: string
        - name: application_statuses
          in: query
          description: |
            Filter customers by one or more onboarding application statuses.
            Comma-separated list (e.g. `submitted,under_review`). Values
            mirror the `ApplicationStatus` enum. Customers without an
            application are excluded when this filter is set.
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: |
            Filter customers by one or more unified customer statuses.
            Comma-separated list (e.g. `frozen,info_requested`). Values mirror
            the `CustomerStatus` enum (`frozen`, `declined`, `withdrawn`,
            `approved`, `info_requested`, `submitted`, `pending`).

            This is the single client-facing status that the dashboard shows,
            filters, and counts by. It collapses the frozen state, the
            application decision, and the application lifecycle into one value
            (see the `status` field on `Customer` for the precedence).
          required: false
          schema:
            type: string
        - name: sub_client_id
          in: query
          description: Filter customers by sub-client association. Returns only customers associated with the specified sub-client.
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: is_sub_client
          in: query
          description: When true, returns only customers that are sub-clients (designated as such at creation). When false or omitted, returns all customers.
          required: false
          schema:
            type: boolean
        - name: sort_by
          in: query
          description: Field to sort customers by. Defaults to `name`.
          required: false
          schema:
            type: string
            enum:
              - application_status
              - created_at
              - customer_type
              - id
              - kyb_status
              - kyc_status
              - name
              - status
        - name: sort_dir
          in: query
          description: Sort direction. Defaults to `asc`.
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: created_at_from
          in: query
          description: Filter customers created at or after this ISO 8601 datetime (e.g. 2024-01-01T00:00:00Z).
          required: false
          schema:
            type: string
            format: date-time
        - name: created_at_to
          in: query
          description: Filter customers created at or before this ISO 8601 datetime (e.g. 2024-12-31T23:59:59Z).
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of all customer records
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  meta:
                    $ref: '#/components/schemas/Meta'
                  status_counts:
                    allOf:
                      - $ref: '#/components/schemas/CustomerStatusCounts'
                    description: |
                      How many customers hold each unified status, across the
                      same filters (search, date, sub-client) but ignoring the
                      `status` selection itself, so the dashboard can render a
                      count per status chip while a status filter is active.
              example:
                data:
                  - id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                    name: Acme Corp
                    email: contact@acmecorp.com
                    external_id: external_customer_123
                    customer_type: business
                    kyb_status: pending
                    kyc_status: pending
                    kyb_links:
                      - provider_id: trm_labs
                        link_type: persona
                        url: https://verify.provider.com/kyb/a1b2c3d4e5f6
                        status: pending
                        created_at: 1234567890
                        updated_at: 1234567890
                        expires_at: 1234567890
                        deleted_at: 1234567890
                    provider_statuses:
                      - provider_id: trm_labs
                        status: approved
                        endorsements:
                          - string
                    application_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                    decision: approved
                    application_url: https://onboarding.example.com/applications/abc123?token=xyz789
                    created_at: 1234567890
                    updated_at: 1234567890
                    deleted_at: 1234567890
                meta:
                  total_count: 100
                  has_more_after: true
                  has_more_before: false
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: Invalid request
                instance: https://api.platform.dakota.xyz/customers
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#authentication-error
                title: Unauthorized
                status: 401
                detail: Unauthorized
                instance: https://api.platform.dakota.xyz/customers
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#forbidden
                title: Forbidden
                status: 403
                detail: Forbidden
                instance: https://api.platform.dakota.xyz/customers
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        default:
          description: Unexpected error
      externalDocs:
        description: Read full guide in docs
        url: https://docs.dakota.xyz/api-reference/customers/list-all-customer-records
  /customers/{customer_id}/sub-client:
    patch:
      tags:
        - Customers
      summary: Update sub-client association for a customer
      deprecated: true
      description: Deprecated and non-functional. The sub-client association is set only at customer creation and is immutable afterwards; this endpoint now rejects all requests with 400. Set `sub_client_id` on `POST /customers` instead.
      operationId: updateCustomerSubClient
      parameters:
        - name: customer_id
          in: path
          required: true
          description: Unique identifier (ksuid) of the customer record
          schema:
            $ref: '#/components/schemas/KSUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerSubClientRequest'
            example:
              sub_client_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
      responses:
        '200':
          description: Sub-client association updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                name: John Doe
                customer_type: individual
                kyb_status: pending
                kyc_status: not_started
                is_sub_client: false
                sub_client_id: 2ABCrqBHb3cTfLVkFSGmHZqdXYZ
                sub_client_name: Partner Corp
                created_at: 1700000000
                updated_at: 1700000000
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: the sub-client association can only be set when a customer is created and cannot be changed afterwards
        '404':
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: 'Customer not found: 1NFHrqBHb3cTfLVkFSGmHZqdDPi'
  /customers/{customer_id}:
    parameters:
      - name: customer_id
        in: path
        required: true
        description: Unique identifier (ksuid) of the customer record
        schema:
          $ref: '#/components/schemas/KSUID'
    get:
      tags:
        - Customers
      summary: Retrieve a customer record by ID
      description: Retrieves a single customer by `customer_id` for the authenticated client.
      operationId: getCustomer
      responses:
        '200':
          description: Customer record retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                name: Acme Corp
                email: contact@acmecorp.com
                external_id: external_customer_123
                customer_type: business
                kyb_status: pending
                kyc_status: pending
                kyb_links:
                  - provider_id: trm_labs
                    link_type: persona
                    url: https://verify.provider.com/kyb/a1b2c3d4e5f6
                    status: pending
                    created_at: 1234567890
                    updated_at: 1234567890
                    expires_at: 1234567890
                    deleted_at: 1234567890
                provider_statuses:
                  - provider_id: trm_labs
                    status: approved
                    endorsements:
                      - string
                application_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
                decision: approved
                application_url: https://onboarding.example.com/applications/abc123?token=xyz789
                created_at: 1234567890
                updated_at: 1234567890
                deleted_at: 1234567890
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: Invalid request
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#authentication-error
                title: Unauthorized
                status: 401
                detail: Unauthorized
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#forbidden
                title: Forbidden
                status: 403
                detail: Forbidden
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '404':
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Customer not found
                status: 404
                detail: Customer not found
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        default:
          description: Unexpected error
      externalDocs:
        description: Read full guide in docs
        url: https://docs.dakota.xyz/api-reference/customers/retrieve-a-customer-record-by-id
    delete:
      tags:
        - Customers
      summary: Delete a customer record
      description: Soft-deletes a customer record. Blocked if the customer has any associated accounts or is referenced as a sub-client.
      operationId: deleteCustomer
      responses:
        '204':
          description: Customer deleted successfully.
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: Invalid request
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#authentication-error
                title: Unauthorized
                status: 401
                detail: Unauthorized
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#forbidden
                title: Forbidden
                status: 403
                detail: Forbidden
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '404':
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Customer not found
                status: 404
                detail: Customer not found
                instance: https://api.platform.dakota.xyz/customers/example-id
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '409':
          description: Conflict
          content:
