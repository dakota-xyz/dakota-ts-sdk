                  name: My Ethereum Wallet
                  crypto_address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
                  family: evm
                  network_id: ethereum-mainnet
                source_crypto_address: '0x1234'
                source_family: evm
                source_network_id: ethereum-mainnet
                source_asset: USDC
