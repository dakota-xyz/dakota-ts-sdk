          description: Unix timestamp when the transaction was created.
          example: 1234567890
        updatedAt:
          type: integer
          description: Unix timestamp when the transaction was last updated.
          example: 1234567890
        completedAt:
          type: integer
          description: Unix timestamp when the transaction was completed. Null if not completed.
          nullable: true
          example: 1234567890
    WebhookDelivery:
      type: object
      description: A single outbound webhook delivery record.
      required:
        - id
        - event_type
        - endpoint_url
        - status
        - attempts
        - created_at
        - is_replay
      properties:
        id:
          type: string
          description: The event ID for this delivery (KSUID).
        event_type:
          type: string
          description: The event type (e.g. `transaction.completed`).
        endpoint_url:
          type: string
          description: The target URL this webhook was sent to.
        status:
          type: string
          enum:
            - delivered
            - failed
            - pending
          description: Current delivery status.
        attempts:
          type: integer
          description: Number of delivery attempts made so far.
        created_at:
          type: string
          format: date-time
          description: When this delivery record was created.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: When the webhook was successfully delivered, if applicable.
        simulation_id:
          type: string
          nullable: true
          description: Present if this webhook originated from a sandbox simulation.
        is_replay:
          type: boolean
          description: True if this delivery was triggered by a manual replay.
        replay_count:
          type: integer
          description: Number of times this delivery has been replayed (max 10).
        payload:
          type: object
          additionalProperties: true
          nullable: true
          description: The full event payload sent in the webhook body.
    WebhookHistoryList:
      type: object
      description: A paginated list of webhook delivery records.
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        has_more:
          type: boolean
          description: True when additional results exist past this page.
        cursor:
          type: string
          nullable: true
          description: Pass as `cursor` query parameter to fetch the next page.
    WebhookReplayResponse:
      type: object
      description: Response returned after successfully queuing a webhook for replay.
      required:
        - webhook_id
        - status
        - replayed_to_count
      properties:
        webhook_id:
          type: string
          description: The event ID of the webhook that was replayed.
        status:
          type: string
          enum:
            - queued
          description: Always `queued`; the delivery will be processed by the next cron tick.
        replayed_to_count:
          type: integer
          description: Number of webhook targets this replay was queued for.
    WebhookTarget:
      type: object
      description: A webhook target for receiving outbound webhook events
      required:
        - id
        - url
        - global
        - time_last_healthy
        - time_last_attempted
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        url:
          type: string
          format: uri
          description: The URL where webhook events will be sent
          example: https://example.com/webhooks/receive
        global:
          type: boolean
          description: If true, this target will receive all event types
          example: false
        event_types:
          type: array
          description: List of event types this target cares about (ignored if global is true)
          items:
            $ref: '#/components/schemas/EventType'
        time_last_healthy:
          type: integer
          description: Unix timestamp when this target last received a successful delivery (defaults to creation time if never healthy)
        time_last_attempted:
          type: integer
          description: Unix timestamp when a delivery to this target was last attempted (defaults to creation time if never attempted)
    WebhookTargetCreateRequest:
      type: object
      description: Request to create a new webhook target
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The URL where webhook events will be sent
          example: https://example.com/webhooks/receive
        global:
          type: boolean
          description: If true, this target will receive all event types
          example: false
          default: false
        event_types:
          type: array
          description: List of event types this target cares about (ignored if global is true)
          items:
            $ref: '#/components/schemas/EventType'
    WebhookTargetUpdateRequest:
      type: object
      description: Request to update an existing webhook target
      properties:
        global:
          type: boolean
          description: If true, this target will receive all event types
          example: false
        event_types:
          type: array
          description: List of event types this target cares about (ignored if global is true)
          items:
            $ref: '#/components/schemas/EventType'
    PutFeePayoutDestinationRequest:
      type: object
      description: A `usdc_wallet` destination (developer-fee payouts are crypto-only).
      oneOf:
        - required:
            - usdc_wallet
      properties:
        usdc_wallet:
          $ref: '#/components/schemas/UsdcWalletPayoutDestination'
    UsdcWalletPayoutDestination:
      type: object
      required:
        - chain
        - address
      properties:
        chain:
          type: string
          description: |
            CAIP-2 chain id from the supported-networks list (e.g. `eip155:8453`).
            See `getSupportedNetworks` (`GET /capabilities/networks`) for the supported list.
          example: eip155:8453
        address:
          type: string
          example: '0x1234567890123456789012345678901234567890'
    FeePayoutDestination:
      type: object
      description: A client's registered destination for developer-fee payouts.
      required:
        - type
        - updated_at
      properties:
        type:
          type: string
          enum:
            - usdc_wallet
        chain:
          type: string
          description: CAIP-2 chain id. Present when `type` is `usdc_wallet`.
          example: eip155:8453
        wallet_address:
          type: string
          description: Present when `type` is `usdc_wallet`.
        updated_at:
          type: string
          format: date-time
    SenderDetails:
      type: object
      description: Originating sender details for onramp/offramp/swap transactions. Populated when source-side metadata is available (e.g., from inbound wire/ACH source data).
      properties:
        sender_type:
          type: string
          description: Type of the originating sender (e.g., "fiat_account", "crypto_wallet").
          example: fiat_account
        sender_account_holder_name:
          type: string
          description: Name on the originating account.
          example: John Doe
        sender_bank_name:
          type: string
          description: Bank name of the originating account.
          example: Chase Bank
        sender_routing_number:
          type: string
          description: ACH routing number of the originating bank account.
          example: '021000021'
        sender_account_number:
          type: string
          description: Account number of the originating bank account.
          example: '1234567890'
        sender_wire_routing_number:
          type: string
          description: Wire routing number of the originating bank account.
          example: '021000021'
        sender_account_type:
          type: string
          description: Type of the originating bank account (e.g., "checking", "savings").
          example: checking
        sender_iban:
          type: string
          description: IBAN of the originating account.
          example: GB82WEST12345698765432
        sender_bic:
          type: string
          description: BIC/SWIFT code of the originating bank.
          example: BARCGB22XXX
        sender_wallet_address:
          type: string
          description: Blockchain wallet address of the originating sender (offramp/swap).
          example: '0x1234567890abcdef1234567890abcdef12345678'
        sender_network:
          type: string
          description: Network identifier of the originating wallet (e.g., "ethereum-mainnet").
          example: ethereum-mainnet
    AutoAccountTransaction:
      type: object
      description: A transaction relating to an auto account
      required:
        - id
        - client_id
        - auto_account_id
        - destination_id
        - type
        - provider_id
        - provider_external_id
        - provider_status
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        client_id:
          $ref: '#/components/schemas/KSUID'
        auto_account_id:
          $ref: '#/components/schemas/KSUID'
        destination_id:
          $ref: '#/components/schemas/KSUID'
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        failure_reason:
          type: string
          description: Reason for failure if status is 'failed'
        created_at:
          type: integer
          description: Unix timestamp when the transaction was created.
          example: 1234567890
        updated_at:
          type: integer
          description: Unix timestamp when the transaction was last updated.
          example: 1234567890
        completed_at:
          type: integer
          description: Unix timestamp when the transaction was completed.
          example: 1234567890
        receipt:
          $ref: '#/components/schemas/TransactionReceipt'
        crypto_details:
          $ref: '#/components/schemas/TransactionCryptoDetails'
        sender_details:
          $ref: '#/components/schemas/SenderDetails'
        provider_id:
          type: string
          description: Provider identifier
          example: dakota
        provider_external_id:
          type: string
          description: Provider external transaction identifier
          example: txn_123456789
        provider_status:
          type: string
          description: Status reported by provider
          example: processing
        return_code:
          type: string
          description: NACHA/Fedwire return code (e.g., R01) when the transaction was returned by the receiving bank.
          example: R01
        return_reason:
          type: string
          description: Human-readable return reason provided by the receiving bank.
          example: Insufficient Funds
        return_initiated_at:
          type: integer
          description: Unix timestamp when the return was initiated.
          example: 1234567890
        return_deadline:
          type: integer
          description: Unix timestamp deadline for return processing.
          example: 1234567890
        net_recovered_amount:
          type: string
          nullable: true
          description: Decimal amount actually recovered when a returned transaction settled short, denominated in the transaction's own currency (the same basis as its face amount), so face amount minus this value is exactly what the bank withheld. Present only when a return came back short — absent when the full amount was recovered, or when the rail reports no net figure at all (ACH never does). Absent means the face amount is authoritative; it never means zero.
          example: '24955'
        reversal_reason:
          type: string
          description: Lead Bank ACH reversal reason when the originator reverses the transaction (e.g., duplicate, receiver_incorrect).
          example: duplicate
        reversal_initiated_at:
          type: integer
          description: Unix timestamp when the reversal was initiated.
          example: 1234567890
    AmountDetails:
      type: object
      description: Detailed representation of an amount with its asset and optional metadata
      required:
        - amount
        - asset
      properties:
        amount:
          type: string
          description: Amount as a string representation of a decimal number
        asset:
          type: string
          description: Asset code
        network:
          type: string
          description: Network identifier for the token if it is a crypto asset
    TransactionReceipt:
      type: object
      description: Detailed receipt information for a transaction
      required:
        - input
        - output
        - exchange_rate
      properties:
        imad:
          type: string
          description: Input Message Accountability Data for certain US transactions.
        omad:
          type: string
          description: Input Message Accountability Data for certain US transactions.
        input:
          $ref: '#/components/schemas/AmountDetails'
          description: Input amount details
        subtotal:
          $ref: '#/components/schemas/AmountDetails'
          description: Subtotal amount after fees
        converted:
          $ref: '#/components/schemas/AmountDetails'
          description: Converted amount after applying the exchange rate
        output:
          $ref: '#/components/schemas/AmountDetails'
          description: Output amount details
        exchange_rate:
          type: string
          description: Exchange rate used for the transaction
        external_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: External fee amount details
        dakota_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: Dakota fee amount details
        client_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: Client fee amount details
        gas_fee:
          $ref: '#/components/schemas/AmountDetails'
          description: Gas fee amount details for blockchain transactions
        payment_reference:
          type: string
          description: Payment reference message for bank transfers
          nullable: true
          example: Invoice payment for services
    TransactionCryptoDetails:
      type: object
