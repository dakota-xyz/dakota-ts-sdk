                $ref: '#/components/schemas/PaymentAgentResponse'
              example:
                id: 2vWxAgent0000000000000000000
                name: My Bill Pay
                customer_id: 2vWxCustomer0000000000000000
                hosted: true
                signer_id: 2vWxSigner000000000000000000
                signer_public_key: BHkExampleKeyQm
                wallet_ids: []
                state: revoked
        '404':
          description: Agentic payments not enabled, or the agent was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
  /payment-agents/{payment_agent_id}/proposals:
    x-alpha: true
    post:
      tags:
        - Agentic Payments
      summary: Draft payment proposals from a conversation (ALPHA)
      description: |
        > **Alpha** — early access.

        Pure cognition, no side effects: turn a customer's natural-language request into reviewable PROPOSALS — the same action-series shape POST /instructions accepts. Stateless: send the conversation so far in `messages` (and/or a `prompt` appended as the latest user turn) on each call, and the response carries either a clarifying/confirming reply, or — only at high confidence — validated proposals (sometimes both). The agent may consult the customer's existing payees and this agent's payment history; it never guesses amounts, assets, networks, or addresses, and proposals still only take effect via the instructions + mandate-signature flow. Requires the freeform LLM layer to be configured server-side.
      operationId: createPaymentAgentProposals
      parameters:
        - name: payment_agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalsRequest'
            example:
              prompt: Pay Alice 10 USDC on base-sepolia 0xa11ce00000000000000000000000000000000001 every month on the 15th until Dec 26
      responses:
        '200':
          description: The agent's next step — a reply, proposals, or both
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenticProposalsResult'
              example:
                reply: Drafting a monthly payment to Alice — review and sign below.
                proposals:
                  - summary: Pay Alice 10 USDC on base-sepolia, on the 15th of every month until Dec 2026 (7 payments)
                    actions:
                      - type: create_recipient
                        create_recipient:
                          name: Alice
                      - type: create_crypto_destination
                        create_crypto_destination:
                          address: '0xa11ce00000000000000000000000000000000001'
                          network_id: base-sepolia
                      - type: create_mandate
                        create_mandate:
                          rule:
                            target_type: recipient
                            targets:
                              - Alice
                            network_id: base-sepolia
                            asset: USDC
                            max_per_tx: '10'
                            window: MONTHLY
                            max_count_per_target_in_window: 1
                          valid_until: 1798675200
                      - type: create_scheduled_payments
                        create_scheduled_payments:
                          destination_id: ''
                          amount: '10'
                          asset: USDC
                          dates:
                            - 1782864000
                            - 1785542400
        '400':
          description: Invalid request, or the freeform conversation layer is not configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: freeform proposals are not enabled (no LLM configured)
        '403':
          description: The customer is frozen and cannot move money
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#account-under-review
                title: Account Under Review
                status: 403
                detail: This account is under review and cannot move funds until the review is resolved.
        '404':
          description: Agentic payments not enabled, or the agent was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
        '429':
          description: |
            The per-customer proposal-drafting rate limit was exceeded (an hourly burst window and a daily window). Back off and retry later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#rate-limited
                title: Rate Limited
                status: 429
                detail: proposal rate limit reached for this customer (hour window) — retry later
  /scheduled-payments/{scheduled_payment_id}/cancel:
    x-alpha: true
    post:
      tags:
        - Agentic Payments
      summary: Cancel one scheduled payment (ALPHA)
      description: |
        > **Alpha** — early access.

        Finalizes a single still-scheduled payment as cancelled. No signature is required - schedule rows are bookkeeping, not authorization (they are created by a plain API-key call); the signed grant is the MANDATE, which this does not touch. New payments can be instructed under the same mandate at any time. Executed, failed, and already-cancelled rows are not cancellable; a cancel racing the cron at the exact fire moment loses cleanly (the status guard never overwrites an executed payment).
      operationId: cancelScheduledPayment
      parameters:
        - name: scheduled_payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The cancelled scheduled payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPaymentResponse'
              example:
                id: 2vWxScheduled000000000000000
                wallet_id: 2vWxWallet000000000000000000
                amount: '10000'
                asset: USDC
                address: '0xa11ce00000000000000000000000000000000001'
                network_id: base-sepolia
                status: cancelled
                scheduled_at: 1781481600
        '400':
          description: Unknown payment or not cancellable (executed, failed, or already cancelled).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: scheduled payment is executed, not cancellable
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
components:
  parameters:
    IdempotencyKeyHeader:
      name: x-idempotency-key
      in: header
      required: true
      description: Unique key to ensure request idempotency. If the same key is used within a certain time window, the original response will be returned instead of executing the request again.
      schema:
        type: string
        format: uuid
    StartingAfterParam:
      name: starting_after
      in: query
      required: false
      description: A cursor for use in pagination. `starting_after` is a KSUID for the object you are listing that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with ID `2B5J8KZ9N7M1K3P6Q8R4T7V9`, your subsequent call can include `starting_after=2B5J8KZ9N7M1K3P6Q8R4T7V9` in order to fetch the next page of the list.
      schema:
        $ref: '#/components/schemas/KSUID'
    EndingBeforeParam:
      name: ending_before
      in: query
      required: false
      description: A cursor for use in pagination. `ending_before` is a KSUID for the object you are listing that defines your place in the list. For instance, if you make a list request and receive 100 objects, starting with ID `2B5J8KZ9N7M1K3P6Q8R4T7V9`, your subsequent call can include `ending_before=2B5J8KZ9N7M1K3P6Q8R4T7V9` in order to fetch the previous page of the list.
      schema:
        $ref: '#/components/schemas/KSUID'
    LimitParam:
      name: limit
      in: query
      required: false
      description: A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SandboxErrorStatusHeader:
      name: X-Sandbox-Error-Status
      in: header
      required: false
      description: |-
        Sandbox-only. Sets the HTTP status code returned when the sandbox injects an error at the configured step (see `X-Sandbox-Error-Step`). Must be a valid HTTP status code in the range 100-599; values outside that range are ignored. Status codes >= 400 cause the request to short-circuit immediately with a structured error response.
        Effective only on `https://api.platform.sandbox.dakota.xyz`. Ignored in production.
      schema:
        type: integer
        minimum: 100
        maximum: 599
        example: 503
    SandboxErrorMessageHeader:
      name: X-Sandbox-Error-Message
      in: header
      required: false
      description: |-
        Sandbox-only. Sets the human-readable `message` field of the injected sandbox error response. Truncated values longer than 500 characters are ignored.
        Effective only on `https://api.platform.sandbox.dakota.xyz`. Ignored in production.
      schema:
        type: string
        maxLength: 500
        example: Provider temporarily unavailable for maintenance.
    SandboxErrorStepHeader:
      name: X-Sandbox-Error-Step
      in: header
      required: false
      description: |-
        Sandbox-only. Names the pipeline step at which the injected error fires. Pair with `X-Sandbox-Error-Status` and (optionally) `X-Sandbox-Error-Message` to drive a deterministic failure mode at a known point in the request lifecycle. Values longer than 100 characters are ignored.
        Effective only on `https://api.platform.sandbox.dakota.xyz`. Ignored in production.
      schema:
        type: string
        maxLength: 100
        enum:
          - transaction_processing
          - compliance_check
          - account_validation
          - provider_call
          - kyb_submission
          - kyb_approval
          - network_call
        example: provider_call
    SandboxScenarioHeader:
      name: X-Sandbox-Scenario
      in: header
      required: false
      description: |-
        Sandbox-only. Applies a preset failure or behavior mode for the request, selecting a coherent combination of error step, status, and message. The full set of scenarios is also exposed dynamically via `GET /sandbox/scenarios` along with descriptions and per-rail applicability.
        Effective only on `https://api.platform.sandbox.dakota.xyz`. Ignored in production.
      schema:
        type: string
        enum:
          - happy_path
          - delayed_settlement
          - insufficient_funds
          - compliance_block
          - invalid_account
          - provider_maintenance
          - network_congestion
          - kyb_manual_review
          - kyb_rejected
          - kyb_expired
          - network_timeout
          - intermittent_errors
          - account_frozen
          - document_expired
          - invalid_swift
        example: insufficient_funds
    SandboxInstantCompletionHeader:
      name: X-Sandbox-Instant-Completion
      in: header
      required: false
      description: |-
        Sandbox-only. When `true`, asynchronous simulation flows complete immediately rather than progressing through their normal timed states. Useful for fast end-to-end test runs that do not need to exercise intermediate webhook events. Accepts `true`/`false` (also `1`/`0`, `yes`/`no`); other values are treated as `false`.
        Effective only on `https://api.platform.sandbox.dakota.xyz`. Ignored in production.
      schema:
        type: boolean
        default: false
        example: true
    SandboxSkipAutoApprovalHeader:
      name: X-Sandbox-Skip-Auto-Approval
      in: header
      required: false
      description: |-
        Sandbox-only. When `true`, prevents the default 5-second KYB auto-approval that the sandbox applies to newly created customers. Use this header (typically with `X-Sandbox-Scenario: kyb_manual_review` or `kyb_rejected`) to keep an application in `pending` so integrators can exercise manual-review and rejection flows. Accepts `true`/`false` (also `1`/`0`, `yes`/`no`); other values are treated as `false`.
        Effective only on `https://api.platform.sandbox.dakota.xyz`. Ignored in production.
      schema:
        type: boolean
        default: false
        example: true
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    ApplicationTokenAuth:
      type: apiKey
      in: header
      name: X-Application-Token
      description: |
        Application-specific token for public URL access. Generated when a customer is created.
        Provides access to a single application without requiring an API key.
        Token is valid for 90 days and rate-limited to 250 requests per hour.
  schemas:
    RDMarketingFeeStatementList:
      type: object
      required:
        - months
      properties:
        months:
          type: array
          description: |-
            Newest first. EMPTY means the client's contract is real but no
            month has started yet (it starts next month or later) — the page
            says "starting soon" rather than denying the contract. A client
            who has never had a contract gets 404 instead, and the portal
            hides the section entirely. The two are different answers.
          items:
            type: string
            format: date
            description: First day of a month the client was entitled to.
    RDMarketingFeeStatement:
      type: object
      required:
        - month
        - y_bps_monthly
        - days_in_month
        - days_stamped
        - daily
      properties:
        month:
          type: string
          format: date
        y_bps_monthly:
          type: number
          format: double
          description: The rate in force for THIS month, in monthly basis points. A later rate change does not rewrite it.
        owed_minor:
          type: string
          description: |-
            What the month owes this client, RD minor units. ABSENT until the
            month is priced — never zero, which would state that nothing is
            owed.
        avg_daily_balance_minor:
          type: string
          description: The mean of the month's stored daily principals. Absent while the month is incomplete.
        days_in_month:
          type: integer
          description: Calendar days in the month — the divisor, never the number of rows stored.
        days_stamped:
          type: integer
          description: |-
            Days whose principal is stored. Lower than days_in_month while the
            month is still being derived or still running, which is how a
            partial month is shown as partial rather than as a complete small
            one.
        daily:
          type: array
          items:
            $ref: '#/components/schemas/RDMarketingFeeDailyRow'
    RDMarketingFeeDailyRow:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
        balance_minor:
          type: string
          description: |-
            The client's stored daily principal for that day, minor units, as a
            decimal string. This is read, never recomputed: it is the same
            figure the month was priced on, so what is shown and what was paid
            cannot drift.

            Every calendar day of the month gets a row. ABSENT means the day is
            not stamped yet — a repairable gap, resolved by the derivation on
            its own. A present "0" means the client genuinely held no RD that
            day. The two are different facts and must not render alike.
        fee_minor:
          type: string
          description: |-
            That day's share of the month's fee, minor units, as a decimal
            string. These decompose the snapshot's owed proportionally by
            balance and sum to exactly that total.

            ABSENT for every day of a month that has not been priced. The fee
            is a property of the month, not of the day, so it is unknown for
            all days at once until the month's Dakota rate is derived. A zero
            here would state that nothing is owed, which is a different claim
            from "not yet known".
    AgenticActionDownstream:
      type: object
      properties:
        recipient_id:
          type: string
        destination_id:
          type: string
        mandate_id:
          type: string
        scheduled_payment_ids:
          type: array
          items:
            type: string
        auto_account_id:
          type: string
          description: The provisioned auto-account (set for a create_auto_account action).
    AgenticInstruction:
      type: object
      properties:
        id:
          type: string
        payment_agent_id:
          type: string
        status:
          type: string
          enum:
            - proposed
            - executed
            - failed
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AgenticAction'
        downstream:
          type: array
          items:
            $ref: '#/components/schemas/AgenticActionDownstream'
    Mandate:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - expired
            - rejected
            - revoked
            - done
          description: |
            expired is DERIVED, never stored - a pending or active mandate whose valid_until has passed. It cannot authorize payments and cannot be approved; it can still be cancelled.
        bound_signer_id:
          type: string
        customer_id:
          type: string
          description: |
            The customer this mandate is anchored to - approval requires a recognized signer of this customer other than the bound one (§8), and recipient targets belong to it. Absent only on rows created before the anchor existed.
        target_names:
          type: array
          items:
            type: string
          description: |
            DERIVED, display-only - the rule's recipient targets resolved to names, parallel to rule.targets (raw id on a miss). Absent for address/any target kinds. The ids in the rule remain the grant.
        instruction_id:
          type: string
        version:
          type: integer
          description: |
            The CURRENT version number (1 for a mandate that has never been amended). `rule` below is this version's rule — the one the gate governs on. Each version is immutable and independently signed; the full history is at GET /mandates/{mandate_id}/versions.
        rule:
          $ref: '#/components/schemas/MandateRule'
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
        approved_by_signer_id:
          type: string
        approved_at:
          type: integer
          format: int64
          description: Unix time of the §8 approval; absent until approved.
        rejected_by_signer_id:
          type: string
          description: The signer that cancelled the mandate while it was still pending (§8); absent otherwise.
        revoked_by_signer_id:
          type: string
          description: The signer that cancelled the mandate after activation (§8); absent otherwise.
    CreatePaymentAgentRequest:
      type: object
      required:
        - customer_id
        - name
        - hosted
      properties:
        customer_id:
          type: string
        name:
          type: string
        hosted:
          type: boolean
          description: Must be true. Only hosted agents (signing keys custodied by the isolated agent-signer service) are supported today; bring-your-own-signer agents are not yet available, so the API rejects hosted=false.
    PaymentAgentResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        customer_id:
          type: string
        hosted:
          type: boolean
        signer_id:
          type: string
        signer_public_key:
          type: string
          description: base64 P-256 SPKI
        wallet_ids:
          type: array
          items:
            type: string
          description: DERIVED - wallets whose attached signer groups contain the agent's signer. Empty until the customer's endorsed attaches land.
        state:
          type: string
          enum:
            - pending
            - active
            - revoked
          description: pending is DERIVED - a non-revoked agent recognized on no wallet. It cannot accept instructions until a wallet attach is endorsed.
        signer_group_cleanup:
          type: array
          description: |
            Present on revoke: the signer groups the (now-revoked) agent's signer still belongs to. A revoked signer can't sign, but its group membership lingers — remove signer_id from each (DELETE /signer-groups/{signer_group_id}/signers/{signer_id}) to finish de-provisioning. Absent when there is nothing to clean up.
          items:
            $ref: '#/components/schemas/PaymentAgentSignerGroupRef'
    PaymentAgentSignerGroupRef:
      type: object
      description: A signer-group reference (id + display name).
      required:
        - signer_group_id
        - name
      properties:
        signer_group_id:
          type: string
        name:
          type: string
    AgenticProposal:
      type: object
      description: |
        A self-contained series of actions. Cross-action links are <entity>_id fields - empty binds to the artifact created in this proposal, a real id reuses an existing one. Every proposal must instruct a payment or draft a mandate - a mandate-only proposal is a standing authorization (sign now, schedule under it later by mandate_id with no new signature).
      required:
        - actions
      properties:
        summary:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AgenticAction'
    AgenticAction:
      type: object
      description: Tagged union - exactly one payload field matching `type` is set.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - create_recipient
            - create_crypto_destination
            - create_bank_destination
            - create_mandate
            - create_scheduled_payments
            - create_auto_account
        create_recipient:
          $ref: '#/components/schemas/RecipientRequest'
        create_crypto_destination:
          $ref: '#/components/schemas/CreateCryptoDestinationAction'
        create_bank_destination:
          $ref: '#/components/schemas/CreateBankDestinationAction'
        create_mandate:
          $ref: '#/components/schemas/CreateMandateAction'
        create_scheduled_payments:
          $ref: '#/components/schemas/CreateScheduledPaymentsAction'
        create_auto_account:
          $ref: '#/components/schemas/CreateAutoAccountAction'
    CreateCryptoDestinationAction:
      type: object
      required:
        - address
        - network_id
      properties:
        recipient_id:
          type: string
          description: 'recipient reference: empty = the recipient created in this proposal; a recipient id or name = an existing recipient'
        address:
          type: string
        network_id:
          $ref: '#/components/schemas/NetworkId'
    CreateBankDestinationAction:
      type: object
      properties:
        recipient_id:
          type: string
        account_holder_name:
          type: string
        account_number:
          type: string
        routing_number:
          type: string
        account_type:
          type: string
          enum:
            - checking
            - savings
        iban:
          type: string
        bic:
          type: string
        bank_name:
          type: string
    CreateMandateAction:
      type: object
      required:
        - rule
      properties:
        rule:
          $ref: '#/components/schemas/MandateRule'
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
    MandateRule:
      type: object
      required:
        - target_type
        - asset
      properties:
        target_type:
          type: string
          enum:
            - any
            - recipient
            - address
        targets:
          type: array
          items:
            type: string
          description: One or more targets of the declared kind (recipient ids or addresses; empty for any). Max 32.
        network_id:
          type: string
          description: The network the funding wallet pays on (e.g. base-sepolia). Empty authorizes any network — the other dimensions still apply.
        asset:
          type: string
          description: |
            The asset the funding wallet SENDS — deposit-denominated, e.g. USDC — compared case-insensitively against the firing payment. Write the crypto deposit asset even when the recipient ultimately receives fiat via a bank offramp (stablecoin conversion is 1:1): a fiat symbol such as USD can never match a send, so the mandate would deny every payment.
        max_per_tx:
          type: string
          description: Per-payment cap — a decimal string in the rule's (deposit) asset. Empty means no per-payment cap; the window caps may still bound total spend.
        window:
          type: string
          enum:
            - NONE
            - DAILY
            - WEEKLY
            - MONTHLY
          description: |
            Spend-cap window shared by every window limit below (calendar, not rolling; all boundaries in UTC). NONE = lifetime; DAILY = calendar day from 00:00 UTC; WEEKLY = calendar week from Monday 00:00 UTC; MONTHLY = calendar month from the 1st, 00:00 UTC.
        max_amount_per_target_in_window:
          type: string
          description: Cumulative cap over the window, PER TARGET (never shared across targets).
        max_count_per_target_in_window:
          type: integer
          description: Up to N times PER TARGET in the window (window NONE = lifetime).
        max_amount_in_window:
          type: string
          description: |
            Cumulative cap over the window ACROSS ALL TARGETS — the ceiling on total spend under this mandate, whoever it pays. Use this for "the agent may spend up to X per month": a per-target cap alone MULTIPLIES by the number of targets (a 3-payee allowlist capped at 10000 per target permits 30000). Set both and both are enforced — the tighter one binds. Empty means no aggregate amount ceiling.
        max_count_in_window:
          type: integer
          description: |
            Up to N payments in the window ACROSS ALL TARGETS, whoever they go to (window NONE = lifetime). The aggregate twin of max_count_per_target_in_window, which caps each target separately and so permits targets x N payments. Omit or 0 for no aggregate count ceiling.
    InsightEvidence:
      type: object
      required:
        - type
        - id
      description: One typed reference to the platform object an insight item was computed from.
      properties:
        type:
          type: string
          description: |
            Platform resource name — the kind of object `id` refers to. OPEN set (like `InsightItem.kind`): new resource types may be referenced without a breaking change, so a client MUST handle an unrecognized type gracefully (e.g. show the item without a deep-link), never error. `transaction` is reserved (advertised and client-handled, but not emitted today).
          x-extensible-enum:
            - wallet
            - scheduled_payment
            - mandate
            - recipient
            - transaction
        id:
          type: string
    InsightItem:
      type: object
      required:
        - kind
        - severity
        - message
        - evidence
      description: |
        One observation (in `insights`) or advisory recommendation (in `suggestions`) — the same schema in both arrays. `kind` is an OPEN set: new kinds appear without notice and clients must ignore kinds they do not recognize.
      properties:
        kind:
          type: string
          description: |
            Machine-readable item type. This is an OPEN set — the values below are the kinds emitted TODAY, but new kinds may be added at any time without a breaking change, so it is documented as an extensible enum rather than a closed one. A client MUST render an unrecognized kind generically from `message` + `severity` (and `evidence`), never drop it. Kinds emitted today, by array:
            Observations (`insights[]`):
              * `upcoming_payments` — open payments due within the horizon (count + per-asset totals).
              * `payment_failures_clustered` — ≥2 recent failures to the same payee sharing one reason (root cause).
              * `payments_failed` — remaining recent singleton failures, summarized.
              * `account_activity` — executed volume over the window + mandates awaiting signature.
              * `new_counterparty` — first open payments to a recently-added payee.
              * `counterparty_concentration` — one payee dominates recent executed outflow.

            Suggestions (`suggestions[]`, advisory — acting is a separate human-gated step):
              * `payment_at_risk` — an open payment is past its scheduled time.
              * `funding_shortfall` — a funding wallet's indexed balance is below its near-term payment needs.
              * `mandate_expiring` — an active mandate ends soon (warn when open payments depend on it).
              * `mandate_headroom` — a mandate's window budget is nearly or already over-consumed.
          x-extensible-enum:
            - upcoming_payments
            - payment_failures_clustered
            - payments_failed
            - account_activity
            - new_counterparty
            - counterparty_concentration
            - payment_at_risk
            - funding_shortfall
            - mandate_expiring
            - mandate_headroom
        severity:
          type: string
          enum:
            - info
            - warn
            - critical
        message:
          type: string
          description: Human-readable, self-contained statement of the finding, with exact amounts and dates.
        detail:
          type: object
          additionalProperties: true
          description: Machine-readable facts behind the message (decimal strings, counts, unix timestamps). Keys vary by kind.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/InsightEvidence'
          description: The platform objects this item is computed from (capped; may be empty when the claim is an aggregate).
    InsightSnapshotBalance:
      type: object
      required:
        - wallet_id
        - network_id
        - asset
        - amount_usd
      description: One funding wallet's indexed holding of one asset on one network. The balance index prices holdings in USD; values may lag the chain.
      properties:
        wallet_id:
          type: string
        name:
          type: string
        network_id:
          type: string
        asset:
          type: string
        amount_usd:
          type: string
    InsightSnapshotUpcoming:
      type: object
      required:
        - days
        - count
      description: Open scheduled payments due within the window.
      properties:
        days:
          type: integer
        count:
          type: integer
        totals:
          type: object
          additionalProperties:
            type: string
          description: Asset → total amount due in the window (decimal strings).
    InsightSnapshot:
      type: object
      required:
        - upcoming
        - open_scheduled_payments
        - active_mandates
      description: |
        Typed FACTS about the account — rendered directly by clients, not narrated. `balances`/`total_usd` cover the wallets the customer's open payments spend from and are present only when the balance index is configured; they degrade to absent, never to an error.
      properties:
        total_usd:
          type: string
        balances:
          type: array
          items:
            $ref: '#/components/schemas/InsightSnapshotBalance'
        upcoming:
          $ref: '#/components/schemas/InsightSnapshotUpcoming'
        open_scheduled_payments:
          type: integer
        active_mandates:
          type: integer
    InsightReport:
      type: object
      required:
        - customer_id
        - generated_at
        - snapshot
        - insights
        - suggestions
      description: The deterministic, read-only insight report for a customer. Computed on demand; nothing is stored.
      properties:
        customer_id:
          type: string
        generated_at:
          type: integer
          format: int64
        snapshot:
          $ref: '#/components/schemas/InsightSnapshot'
        insights:
          type: array
          items:
            $ref: '#/components/schemas/InsightItem'
          description: Observations about the account (always present, possibly empty).
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/InsightItem'
          description: Advisory recommendations (always present, possibly empty). Non-binding — acting on one is a separate, human-gated step.
    CreateScheduledPaymentsAction:
      type: object
      required:
        - amount
        - asset
      properties:
        destination_id:
          type: string
        wallet_id:
          type: string
          description: The funding wallet for these payments — one the agent recognizes. Optional only when the agent recognizes exactly one wallet (used by default); otherwise required, since a signer can recognize several and the choice cannot be deferred to fire time. Its chain family must match the payment network.
        amount:
          type: string
          description: |
            Decimal string. What this MEANS depends on `amount_includes_fee` below: by default it is what the PAYEE RECEIVES, and the server grosses it up so the fee comes out on top.
        amount_includes_fee:
          type: boolean
          description: |
            Whose side of the conversion fee `amount` is on.

            Absent or `false` (the DEFAULT): `amount` is what the payee RECEIVES. The server adds the fee on top, so slightly more leaves the funding wallet. This is what "pay Bruno 10 USDC" means to a person, and it matches the same payment made through a client's own form.

            `true`: `amount` is what LEAVES the wallet, and the payee receives less the fee. Use it only when the customer says so — "send 10 in total", "including the fee".

            The gross-up is done SERVER-SIDE from the fee on the request; the agent never computes it, so it can neither get the arithmetic wrong nor be talked out of the fee. With no fee configured the two are identical.
        asset:
          type: string
        network_id:
          type: string
          description: 'The chain THIS payment settles on. The network belongs to the payment, not to the payee: an address belongs to a whole family, so which chain a given payment uses is chosen when the payment is made. Optional — the destination''s own network is used when omitted. When the destination pins a DIFFERENT one in the same family, this payment''s network wins (the pin records what an earlier payment did, not a restriction on the address). Across chain FAMILIES the address does not carry at all, and that is refused.'
          example: base-sepolia
        dates:
          type: array
          maxItems: 366
          items:
            type: integer
            format: int64
        count:
          type: integer
          maximum: 366
        interval_seconds:
          type: integer
          format: int64
        start_at:
          type: integer
          format: int64
        local_time:
          type: string
          maxLength: 16
          description: |
            The FIRST entry of `dates` as the customer-local wall clock it is meant to fire at, "2006-01-02 15:04". When present together with `local_zone`, the server recomputes the epoch from the pair and rejects the action if it disagrees with `dates[0]` — a deterministic check under timezone arithmetic. Optional.
          example: 2026-07-24 10:00
        local_zone:
          type: string
          maxLength: 64
          description: The IANA timezone `local_time` is expressed in.
          example: America/Los_Angeles
    CreateScheduledPaymentRequest:
      type: object
      required:
        - signer_id
        - wallet_id
        - amount
        - asset
      description: |
        Direct (signer-first) schedule create. The signer + funding wallet are the caller's choice; the schedule is explicit `dates`, or `count` × `interval_seconds` from `start_at`. Name the payee EITHER with `destination_id` (an existing crypto destination of the wallet's customer) OR with a direct `address` + `network_id` (a raw crypto address, no recipient — matched on the address at fire time, like a mandate address target) — exactly one of the two.
      properties:
        signer_id:
          type: string
          description: The signer the payments bind to; its hosted agent signs at fire time.
        wallet_id:
          type: string
          description: |
            The funding wallet these payments spend from. Required — the signer must be permitted to spend on it, and its chain family must match the payment network.
        destination_id:
          type: string
          description: An existing crypto destination of the wallet's customer to pay. Omit to pay a direct address (address + network_id).
        address:
          type: string
          description: A direct crypto address to pay — an alternative to destination_id (no recipient). Requires network_id; the wallet's chain family must match.
        network_id:
          type: string
          description: The network for a direct-address payment (required together with address).
        amount:
          type: string
          description: Decimal string, at the destination asset.
        asset:
          type: string
        dates:
          type: array
          maxItems: 366
          items:
            type: integer
            format: int64
          description: Explicit per-payment unix times (one payment each). Win over count × interval_seconds.
        count:
          type: integer
          maximum: 366
          description: Number of payments when using count × interval_seconds (default 1).
        interval_seconds:
          type: integer
          format: int64
          description: Cadence in seconds between payments when using count.
        start_at:
          type: integer
          format: int64
          description: First due time (0 ⇒ now).
    CreateAutoAccountAction:
      type: object
      description: |
        Provision a provider-managed convert-and-forward "auto-account" so a payment can cross chain families (crypto→crypto swap) or exit to a bank (crypto→bank offramp). The agent pays the auto-account's crypto DEPOSIT on source_network_id (on the funding wallet's own family) and the provider converts source_asset→output_asset and forwards to destination_id. A scheduled payment then targets the deposit; the mandate still targets the real recipient.
      required:
        - source_asset
        - source_network_id
        - output_asset
      properties:
        destination_id:
          type: string
          description: 'The REAL destination the auto-account forwards to: a crypto destination (⇒ swap) or a bank destination (⇒ offramp). Empty = the destination created in this proposal.'
        source_asset:
          type: string
          description: The asset the agent deposits and the scheduled payment sends (may be the ANY wildcard).
        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        output_asset:
          type: string
          description: The asset the recipient receives (a currency such as USD for a bank offramp).
        output_network_id:
          type: string
          description: 'The chain the PAYEE is paid on — the payout leg, and a different chain from `source_network_id` (the deposit the funding wallet pays). Crypto payouts only; a bank offramp has no chain. Optional: the destination''s own network is used when omitted. When set it decides, because the network belongs to the payment and not to the payee — an address receives on every chain in its family, so a destination''s saved network records what a previous payment did rather than restricting this one. Across chain FAMILIES the address does not carry at all, and that is refused.'
          example: base-sepolia
        rail:
          type: string
          description: Outbound rail — REQUIRED for a bank offramp (e.g. ach, fedwire, swift); omit for a crypto swap.
        routing_preference:
          type: string
          enum:
            - fastest
            - cheapest
        fee_bps:
          type: integer
          format: int32
          description: Optional developer fee in basis points (0–10000).
    DeveloperFee:
      type: object
      description: |
        Your developer fee, declared per payout type. A conversion is charged the rate for the kind of payout it funds: `swap_bps` for a crypto payout, `offramp_bps` for a bank payout. Omit a rate, or send zero, and that payout type carries no fee at all — nothing is charged, nothing is added to the amount, and the agent is told nothing about a fee it could mention. The two are independent, so one conversation can charge a swap and stay silent about a bank payout in the same turn.

        Both rates are DEFAULTS for the auto-accounts a request creates. An action-level `fee_bps` is an explicit override and still wins outright, for either type.
      properties:
        swap_bps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: |
            Rate for a crypto payout — a `create_auto_account` naming no `rail`.
        offramp_bps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: |
            Rate for a bank payout — a `create_auto_account` naming a `rail`. An offramp converts too (it just settles on a rail instead of a chain), so charging it is a pricing decision that belongs to you. Zero or omitted means the payout is free of a conversion fee.
    CreateInstructionsRequest:
      type: object
      required:
        - payment_agent_id
        - proposals
      properties:
        payment_agent_id:
          type: string
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/AgenticProposal'
        developer_fee:
          $ref: '#/components/schemas/DeveloperFee'
    AgenticInstructionsResult:
      type: object
      properties:
        mandates:
          type: array
          description: Every mandate this batch DRAFTED, in full wire shape (identical to GET /mandates/{mandate_id}) — sign the §8 approval immediately, no follow-up fetch or polling. Pending until a signer other than the bound one approves.
          items:
            $ref: '#/components/schemas/Mandate'
        instruction_ids:
          type: array
          items:
            type: string
    CreateProposalsRequest:
      type: object
      description: |
        A freeform proposals conversation. The server is stateless — send the whole history in `messages` on each call. `prompt` is a convenience for a single-shot turn (or the latest user message); it is appended after `messages`. At least one of `prompt` or `messages` must be non-empty. Supplying both is valid only when `messages` does not already end with a user turn; otherwise the request is rejected with 400 (two consecutive user turns are not allowed).
      properties:
        prompt:
          type: string
          description: Single-shot input, appended as the latest user turn.
        messages:
          type: array
          description: The conversation so far, oldest first.
          items:
            $ref: '#/components/schemas/AgenticChatMessage'
        developer_fee:
          $ref: '#/components/schemas/DeveloperFee'
        timezone:
          type: string
          maxLength: 64
          description: |
            The customer's IANA timezone (e.g. "America/Los_Angeles"). When present, the agent resolves every relative date ("tomorrow", "Friday") and clock time ("10 am") in THIS timezone; a date without a time is drafted for the first working hours of the local day (10:00) and the draft summary states the resolved local time; a time without a date means its next local occurrence. Absent or unrecognized ⇒ times resolve as UTC and the agent says so when a specific clock time matters. Send it on EVERY turn — the server is stateless. Note: the zone's UTC offset is captured at drafting time, so a DST transition before a far-future fire date shifts the fire time by the DST delta.
          example: America/Los_Angeles
    AgenticClientPolicy:
      type: object
      description: |
        ALPHA — how THIS client's product speaks, and what the agent may propose for it. It reshapes what the drafting model SEES (tool results, tool descriptions, prompt sections) and constrains what it may PROPOSE, so the agent narrates in the client's own nouns instead of platform ones.

        SCOPE: this is a per-CLIENT policy — it belongs to the `client_id` behind the API key, never to a key (api keys are N:1 to clients, so a per-key policy would fragment for a client running one service key per deployment). REGISTER IT at `PUT /agentic-policy`, which resolves the client from the API key: there is no id to pass and no other client's policy to address.

        DELIVERY: registration only. A request body never carries this object — a conversation is two calls (draft, then accept) judged independently, and a per-request policy let them disagree, so a draft that was legal under one could be refused at the customer's approval click.

        STRICT: an unknown key, an unknown value, or a label for a concept the server does not implement is a 400 — "accepted" always means "enforced". Absent (or every field empty) ⇒ platform defaults, byte-for-byte the behaviour of a request that never mentioned it.
      additionalProperties: true
      properties:
        payee_model:
          type: string
          enum:
            - ''
            - nested
            - flat
          description: |
            How payees are shaped in tool results. `nested` (the default, and what an absent policy means) returns ONE payee carrying N payout methods. `flat` returns one entry PER payout method — a payee is a name plus one way of being paid — each with `payee_ref` (the id to pass straight through wherever a payout method is referenced), `entity_ref` (the person behind the entry; several entries can share one, and it is what binds a new payout method to an existing person instead of duplicating them), `name`, and `paid_by` (a rendered human phrase such as `bank account at Chase ****4321` or `base-sepolia 0x1234…cdef`). A payout method never pins an asset, so `paid_by` never names one.
          example: flat
        payout_assets:
          type: array
          items:
            type: string
          description: |
            The assets a PAYEE may receive — what a conversion may output, and what a direct payment may send. Absent or empty means unrestricted, which is the platform default.

            State it when your product's FUNDING asset is not something a payee is ever paid in. Platform's asset registry only knows which assets settle on which chain, so it cannot tell that your funding stablecoin is a category error as a payout — it will happily draft one if a customer names it, and because that route needs no conversion account it also creates a duplicate payee for someone already saved. Declaring the allowlist turns both into a refusal the model sees before the customer does.

            Case-insensitive and de-duplicated; the order you send is the order quoted back to the customer.
          example:
            - USDC
            - USDT
        labels:
          type: object
          additionalProperties:
            type: string
          description: |
            Platform concept → the noun THIS client's customers use for it. The noun replaces the platform word in the tool results the agent reads AND in what it writes to the customer. Implemented concepts: `limit` (the spending limit; platform calls it a mandate), `payee` (the person being paid), and `limit_unit` (the UNIT the limit's amounts are quoted in, e.g. `USD`). Any other key is a 400 — a label for a concept the server does not implement would be accepted and then ignored.

            `limit` and `payee` are nouns and must match `^[a-z][a-z0-9 _-]{0,30}$`. `limit_unit` is a unit code and must match `^[A-Za-z][A-Za-z0-9]{0,9}$`, so it may be uppercase. Never a phrase, never a sentence.

            `limit_unit` matters most under a `payout_route` that forces a conversion account: the limit governs the DEPOSIT leg, so its own asset is the funding asset the customer has never heard of. With the unit set the agent quotes the caps and remaining budget in it ("your spending limit is 10 USD per month, 0.98 left") instead of reaching for the funding asset.

            Labelling `payee` also renames the flat view's keys: the container becomes the label plus `s` and each entry's ref becomes the label plus `_ref` — so `{"payee": "recipient"}` yields `recipients[]` with `recipient_ref`. `entity_ref` is NOT renamed; it is an opaque handle to the person behind the entry, not the labelled concept. The plural is a literal `+s` (the charset restricts labels to simple lowercase nouns), so an irregular noun gets an odd but harmless plural.
          example:
            limit: spending limit
            limit_unit: USD
            payee: recipient
        mandate_strategy:
          type: string
          enum:
            - ''
            - external_only
          description: |
            `external_only`: spending limits live entirely OUTSIDE this conversation — the client creates and amends them in its own limit editor through the customer-signed amend API. The agent never drafts one; a drafted payment must fit an existing active limit's remaining budget, and when nothing covers it the agent says so and points the customer at the app instead of proposing a limit. Absent ⇒ the agent drafts limits as usual.
          example: external_only
        payout_route:
          type: string
          enum:
            - ''
            - conversion_account_only
            - bank_only
          description: |
            Restricts how the money may leave. `conversion_account_only`: every scheduled payment must fund a conversion account — no direct wallet-to-address send. `bank_only`: on top of that the payout must land in a bank account — an outbound bank rail is required and no crypto payout method may be created. Absent ⇒ any supported route.

            Either value also makes the FUNDING leg system-chosen, which changes two things. The payment has two legs and the customer only names one: what they ask for is what ARRIVES (the conversion's output), while what LEAVES the wallet is the conversion deposit. The spending limit governs the DEPOSIT leg, so (a) the asset or chain the customer names can never put a payment outside the limit — coverage is judged on the per-payment cap and the remaining budget alone — and (b) the deposit's asset and network move out of the limit's `rule` into a `funding_leg_internal` block in the `active_mandates` result, which the agent copies into the conversion account and never says out loud. Pair this with `labels.limit_unit` so the agent has a unit to quote the limit in.
          example: conversion_account_only
    RegisteredAgenticClientPolicy:
      type: object
      description: |
        A client's registered `client_policy` (ALPHA) with its registration timestamps.

        `policy` is the NORMALIZED form — what the server will actually apply, not an echo of what was sent. Values that mean "the default" are normalized away (`payee_model: nested` becomes absent, because an explicit nested and an absent policy have to be the same value rather than two values that merely behave alike today).
      required:
        - policy
      properties:
        policy:
          $ref: '#/components/schemas/AgenticClientPolicy'
        created_at:
          type: integer
          format: int64
          description: Unix time this client first registered a policy.
        updated_at:
          type: integer
          format: int64
          description: Unix time the registration was last replaced.
    AgenticChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        attachments:
          type: array
          description: |
            Input artifacts attached to this turn for the agent to investigate — e.g. an invoice PDF to draft a payment from. Optional. Document attachments (PDF or image) are accepted up to 8 MiB per document and 16 MiB per request, measured on the decoded payload.
          items:
            $ref: '#/components/schemas/AgenticAttachment'
    AgenticAttachment:
      type: object
      description: |
        An input artifact attached to a conversation turn. Tagged union: exactly one payload field matching `type` is set. Extensible — further kinds (e.g. an email stream) are added as new `type` enum values + payload fields, additively, without breaking this shape.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - document
          description: The attachment kind — `document` (a PDF or image) today; further sources are added additively.
        document:
          $ref: '#/components/schemas/AgenticDocumentAttachment'
    AgenticDocumentAttachment:
      type: object
      required:
        - media_type
        - data
      properties:
        media_type:
          type: string
          enum:
            - application/pdf
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
          description: MIME type of the attached document.
        data:
          type: string
          format: byte
          description: The document bytes, base64-encoded.
        filename:
          type: string
          description: Optional original filename, for display and audit.
    AgenticProposalsProgress:
      type: object
      description: |
        Live snapshot of an in-flight proposal-drafting turn. Coarse and customer-safe: a phase enum, one human sentence, and the model round. Tool counts only — never payee names, amounts, or addresses.
      required:
        - active
      properties:
        active:
          type: boolean
          description: |
            True while a drafting turn is publishing progress for this agent. False when idle or just finished — show a generic spinner instead.
        phase:
          type: string
          description: 'Coarse machine phase: reading | working | drafting | revising | finalizing.'
          enum:
            - reading
            - working
            - drafting
            - revising
            - finalizing
        detail:
          type: string
          description: Human line to show under the spinner.
          example: Looking up 8 payees · checking balances
        iteration:
          type: integer
          description: Model round (1-based) the turn is on.
        updated_at:
          type: integer
          format: int64
          description: Unix seconds when this snapshot was published.
    AgenticBlocker:
      type: object
      description: |
        One machine-actionable reason a drafting turn produced no proposals. Verified server-side before it is returned.
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - mandate_does_not_cover_payee
            - no_mandate
          description: |
            `mandate_does_not_cover_payee` — a spending limit is in force but its rule does not reach the named payee. This is the ACTIONABLE one: the limit can be amended to ADD the payee as a target, which changes nothing else and so can never raise the limit; collect the customer's signature for that amendment and run the turn again. `no_mandate` — no active limit exists at all, so there is nothing to amend and the customer must establish one first. The two are kept distinct so a client never opens an amend flow against a limit that does not exist.
        mandate_id:
          $ref: '#/components/schemas/KSUID'
        payee_name:
          type: string
          description: |
            The payee the customer named, verbatim. A NAME and not an id, because in the case this exists for the payee does not exist yet — which is why nothing covers them.
        detail:
          type: string
          description: Short human-readable note. Advisory only — branch on `code`.
    AgenticProposalsResult:
      type: object
      description: |
        The agent's next step. At least one of `proposals` or `reply` is always present in a successful response — `proposals` at high confidence (optionally with a short `reply` note), or `reply` alone when the agent needs more from the user.
      properties:
        proposals:
          type: array
          description: Validated action-series proposals, ready to accept via POST /instructions. Present only at high confidence.
          items:
            $ref: '#/components/schemas/AgenticProposal'
        reply:
          type: string
          description: The agent's conversational reply — a clarifying question or confirmation. Present without proposals when the agent needs more from the user; may accompany proposals as a short note.
        blockers:
          type: array
          description: |
            ALPHA — machine-actionable reasons the agent could not complete the request, for the CLIENT APPLICATION rather than the customer. `reply` explains it in prose, which software cannot branch on: "extend the limit to cover Priya", "I need her bank details" and "that rail is not supported" all arrive as some text. A blocker names the reason as a stable code so the client can act on it — opening its own limit editor with the payee filled in, say — and only then decide what the customer sees.
            MAY ACCOMPANY PROPOSALS, and routinely does. The common case is a payee who does not exist yet: the turn proposes creating them AND reports that the limit will not reach them, because the client has to do both, in that order — accept the proposal so the payee has an id, then amend the limit to include it. Treat proposals and blockers as independent, never as alternatives.
            Absent when nothing blocked the turn. ALWAYS switch on `code` and ignore codes you do not know, as new ones are added over time. Every blocker returned has been re-checked against the server's own data, so a code never reflects only the model's opinion.
          items:
            $ref: '#/components/schemas/AgenticBlocker'
        conversation_status:
          type: string
          enum:
            - ok
            - warned
            - blocked
            - rejected_input
          description: How the boundary screen treated this turn. `ok` is a normal payments turn; `warned` means the request was off-topic and the customer was warned but may continue; `blocked` means the conversation has been terminated (repeated off-topic turns or a manipulation attempt) — the client should stop serving it and offer a fresh chat. `rejected_input` means this message was refused wholesale (e.g. more payees than one conversation supports) and should NOT be added to the conversation history — the reply explains what to resend; the conversation itself continues unaffected.
    ApproveMandateRequest:
      type: object
      required:
        - approver_public_key
        - signature
      properties:
        approver_public_key:
          type: string
        signature:
          type: string
    CancelMandateRequest:
      type: object
      required:
        - signer_public_key
        - signature
      properties:
        signer_public_key:
          type: string
        signature:
          type: string
    AmendMandateRequest:
      type: object
      required:
        - signer_public_key
        - signature
        - rule
      description: |
        A new version of an active mandate's rule, signed by a recognized signer of the mandate's customer other than the bound one (§8).

        The `rule` below is taken VERBATIM — it is stored, and the signature is verified, exactly as sent. Unlike mandate creation, this endpoint does NOT normalize it: a rule that is not already canonical is refused with 400 naming the offending field, rather than being rewritten into something you cannot reproduce. So `window` must be present and non-empty (send "NONE" for a lifetime window), `targets` must be recipient ids and never payee names, and `asset` must already be uppercase. This is what lets you compute the signed bytes from the body you are about to send.
      properties:
        signer_public_key:
          type: string
          description: The amending signer's public key. Must differ from the mandate's bound signer.
        signature:
          type: string
          description: |
            Signature over the JCS-canonical amend payload — the same shape as the approve/cancel payload with `action` set to "amend", `rule` set to the NEW rule below EXACTLY as you send it, and one extra key, `version`, set to the version being created (the mandate's current `version` + 1). Including the version is what stops a signature for v2 from being replayed to create v3. Because the rule is never normalized on this path, the bytes you sign are the bytes the server verifies.
        rule:
          allOf:
            - $ref: '#/components/schemas/MandateRule'
          description: |
            The complete NEW rule, not a patch, in canonical form — it is stored and signed verbatim, never normalized. `window` is REQUIRED here (use "NONE" for a lifetime window) even though it is optional when creating; `targets` must be recipient ids, not payee names; `asset` must be uppercase. Anything else is refused with 400 naming the field, not silently rewritten. `target_type`, `window`, `asset` and `network_id` must additionally match the current version exactly; only the amount fields and `targets` may differ.
    MandateVersion:
      type: object
      description: |
        One immutable, independently signed version of a mandate's rule. Append-only — a version's rule is never rewritten.
      properties:
        version:
          type: integer
          description: 1-based. Version 1 is the rule the mandate was created and approved with.
        rule:
          $ref: '#/components/schemas/MandateRule'
        approved_by_signer_id:
          type: string
          description: |
            The §8 signer that signed this version into force — for v1 the approver, for later versions the amender. Absent while a v1 is still pending approval.
        approved_at:
          type: integer
          format: int64
          description: Unix time this version was signed into force; absent until then.
        created_at:
          type: integer
          format: int64
    MandateBudgetLine:
      type: object
      required:
        - target
        - bucket
        - committed_count
        - committed_amount
        - open_count
        - open_amount
      description: |
        One budget line: a window bucket, what has been spent in it, what is earmarked against it, and what is left.

        Amounts are decimal strings in the mandate rule's `asset`, matching the `rule` fields they are metered against. Counts and amounts are reported independently because the rule can cap either, both, or neither.
      properties:
        target:
          type: string
          description: |
            Which payee this line is about — a recipient id under `target_type: recipient`, an address under `address`. Empty for `target_type: any` (there is one bucket for everything) and always empty on `aggregate` lines, which are the roll-up across every payee.
        bucket:
          type: string
          description: |
            The window period this line covers, identified as a date: `"2026-07"` for MONTHLY, `"2026-07-13..2026-07-19"` (the full inclusive range) for WEEKLY, `"2026-07-13"` for DAILY, and `"lifetime"` for window `NONE`, whose single bucket never resets.

            Lines are chronological within a payee (`aggregate`, having no payee, is chronological outright), so a payee's CURRENT bucket comes first — later buckets exist only where payments are already scheduled into future windows, and no bucket earlier than the current one is ever reported.
        committed_count:
          type: integer
          description: Payments that have already fired and spent from this bucket.
        committed_amount:
          type: string
          description: Sum of those spends, as a decimal string.
        open_count:
          type: integer
          description: |
            Scheduled payments that have NOT fired yet but will consume this bucket at their due date.
        open_amount:
          type: string
          description: Sum of those earmarks, as a decimal string.
        remaining_count:
          type: integer
          description: |
            Payments still permitted in this bucket after committed and open ones, floored at 0. ABSENT when the rule sets no count cap for this line's scope — absence means "not capped", never "none left".
        remaining_amount:
          type: string
          description: |
            Amount still permitted in this bucket after committed spend and open earmarks, floored at 0 and returned as a decimal string. ABSENT when the rule sets no amount cap for this line's scope — absence means "not capped", never "nothing left".

            **`"?"` means the figure could not be summed and MUST be treated as no headroom.** A stored amount or cap in this bucket did not parse as a decimal; the mandate gate fails closed on the same data, so a payment sent against this bucket will be denied. Do not coerce `"?"` to 0 and do not fall back to the rule's cap — both read as headroom that is not there.
    MandateBudget:
      type: object
      required:
        - mandate_id
        - version
        - as_of
        - window
        - per_target
        - aggregate
      description: |
        A mandate's remaining spend budget at a point in time. Advisory: nothing here reserves budget, and the mandate gate remains the authority at fire time.
      properties:
        mandate_id:
          type: string
        version:
          type: integer
          description: |
            The version whose caps these figures are metered against. Amending a mandate changes the caps but NOT the spend — usage accrues to the mandate, so a raised limit leaves the window's consumption intact and a lowered one can leave zero remaining rather than a negative balance.
        as_of:
          type: integer
          format: int64
          description: |
            Unix time the windows were derived and the sums taken. Budget is a function of time — a MONTHLY bucket empties at the rollover — so the figures below are only interpretable against this instant.
        window:
          type: string
          description: |
            The rule's `window` verbatim (`NONE`, `DAILY`, `WEEKLY`, `MONTHLY`) — the period each `bucket` spans and the cadence at which budget resets. `NONE` is a lifetime cap: one bucket, labelled `lifetime`, that never resets.
        per_target:
          type: array
          description: |
            Per-payee lines, metered against `max_amount_per_target_in_window` and `max_count_per_target_in_window`. Every configured payee appears for the current window even if it has never been paid, so an empty budget is reported as zeros rather than as a missing line.
          items:
            $ref: '#/components/schemas/MandateBudgetLine'
        aggregate:
          type: array
          description: |
            One line per window bucket summing EVERY payee, metered against the agent-wide `max_amount_in_window` and `max_count_in_window`. This is the ceiling on the agent as a whole; honour it alongside `per_target`, never instead of it.
          items:
            $ref: '#/components/schemas/MandateBudgetLine'
    CreateMandateRequest:
      type: object
      required:
        - rule
      description: |
        Exactly one binding form is required - payment_agent_id alone, or signer_id together with customer_id. Any other combination is rejected with 400.
      properties:
        payment_agent_id:
          type: string
          description: |
            Binding form A (hosted convenience) - the mandate binds this agent's signer and anchors to the agent's customer. Mutually exclusive with signer_id/customer_id.
        signer_id:
          type: string
          description: |
            Binding form B - the mandate binds this signer directly (any of the client's signers, not only an agent's). Requires customer_id.
        customer_id:
          type: string
          description: |
            Binding form B - the customer the mandate is anchored to; must belong to the calling client. Defines the recipient-target scope and the §8 approver set (approval requires a recognized signer of THIS customer other than the bound one). Requires signer_id.
        rule:
          $ref: '#/components/schemas/MandateRule'
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
    MandateResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - rejected
            - revoked
            - done
        approved_by_signer_id:
          type: string
        rejected_by_signer_id:
          type: string
          description: The signer that cancelled the mandate while it was still pending (§8); absent otherwise.
        revoked_by_signer_id:
          type: string
          description: The signer that cancelled the mandate after activation (§8); absent otherwise.
    ScheduledPaymentResponse:
      type: object
      properties:
        id:
          type: string
        signer_id:
          type: string
          description: The signer (hosted agent) this payment fires under.
        wallet_id:
          type: string
          description: The funding wallet this payment spends from (the customer's choice at acceptance).
        mandate_id:
          type: string
          description: AUDIT — the mandate that covered this payment at fire time. Absent until the payment executes (coverage is decided at fire time, not bound at rest).
        mandate_version:
          type: integer
          description: |
            AUDIT — WHICH version of that mandate authorized this payment. A mandate's rule can be amended (new versions are appended), so `mandate_id` alone no longer identifies the caps the payment was judged against; this does, and it stays true after later amendments. Look the rule up at GET /mandates/{mandate_id}/versions. Always accompanies `mandate_id` — when the covering mandate could not be determined, both are absent rather than one being guessed.
        wallet_transaction_id:
          type: string
          description: AUDIT — the money-path transaction created when this payment fired. Absent until the payment executes.
        amount:
          type: string
          description: What LEAVES the funding wallet, denominated in `asset` on `network_id`. For a DIRECT payment that is also what the payee receives. For a CONVERTED payment (the payee settles on a different asset or chain) it is the DEPOSIT into the conversion account, grossed up so the payee nets the requested figure — so it is LARGER than the payout and in a DIFFERENT asset. Never render it against `output_asset`.
        asset:
          type: string
          description: The asset `amount` is denominated in — the asset that LEAVES the wallet. For a converted payment this is the deposit asset, not the one the payee receives (see `output_asset`).
        failure_reason:
          type: string
          description: Why the payment failed (e.g. the mandate gate's denied dimensions); absent unless status is failed.
        recipient_id:
          type: string
          description: The recipient this payment pays, when it was created from a destination. Absent for a direct-address payment (which carries no recipient).
        destination_id:
          type: string
          description: The REAL destination this payment settles to — a bank (for an offramp) or a crypto destination. For an auto-account (convert-and-forward) payment, `address` is the crypto DEPOSIT actually paid while this names the bank/crypto target, so a client can show which account the scheduled payment is for. Absent for a direct-address payment.
        destination_type:
          type: string
          enum:
            - bank
            - crypto
          description: The kind of the REAL destination (see destination_id). `bank` marks an offramp (the payment converts crypto to fiat and forwards via a bank rail); `crypto` a direct or cross-family crypto payout. Absent for a direct-address payment with no destination.
        destination_label:
          type: string
          description: A human label for the real destination — e.g. "Chase ••••5432" for a bank, or a shortened address for crypto — so a client can show which account the payment settles to without a second lookup. Absent when unresolved.
        destination_rail:
          type: string
          description: For a `bank` destination, the payout rail (e.g. ach, fedwire, swift). Absent for crypto.
        output_asset:
          type: string
          description: 'The asset the recipient ULTIMATELY receives. For an offramp this is the fiat currency (e.g. USD) the deposit converts to; for a direct crypto payment it equals `asset`. DO NOT PAIR THIS WITH `amount`: for a converted payment `amount` is the DEPOSIT — what leaves the wallet, in the deposit''s own asset — and it is grossed up so the payee nets the requested figure, so a real payment reads amount 0.211112 and pays out 0.19. The rate is 1:1; the fee is not. This response carries no output amount, so a converted payment''s payout figure is not available here.'
        output_network:
          type: string
          description: For a crypto destination, the network the recipient ULTIMATELY receives on — for a cross-family swap this differs from `network_id` (the DEPOSIT network the wallet pays), e.g. output_network solana-devnet while network_id is base-sepolia. Equals `network_id` for a direct crypto payment; absent for a bank offramp (fiat has no network).
        address:
          type: string
        network_id:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - cancelled
            - executed
            - failed
        executed_at:
          type: integer
          format: int64
        scheduled_at:
          type: integer
          format: int64
    ScheduledPaymentList:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledPaymentResponse'
        meta:
          $ref: '#/components/schemas/Meta'
    SandboxScenario:
      type: object
      required:
        - name
        - description
        - valid_for
        - stateful
        - example_webhook_sequence
      properties:
        name:
          type: string
          description: Scenario identifier passed as `scenario` in simulate/inbound requests.
          example: success_immediate
        description:
          type: string
          description: Human-readable explanation of what this scenario simulates.
        valid_for:
          type: array
          items:
            type: string
          description: Transaction types (`type` field) that support this scenario.
        stateful:
          type: boolean
          description: Whether this scenario creates a paused simulation that requires POST /{id}/advance to complete.
        advance_actions:
          type: array
          items:
            type: string
          description: Valid actions for POST /{id}/advance. Only present when stateful=true.
        example_webhook_sequence:
          type: array
          items:
            type: string
          description: Typical sequence of webhook events fired for this scenario.
    SimulationState:
      type: string
      enum:
        - accepted
      description: State of a sandbox simulation after submission.
    SimulationCallbackRecord:
      type: object
      description: One callback delivery log entry for a simulation.
      properties:
        callback_id:
          type: string
          description: Opaque callback identifier (UUID)
        payload_json:
          type: string
          description: Full webhook payload (JSON-encoded string)
        scheduled_for:
          type: string
          format: date-time
          description: When the callback is scheduled to fire
        state:
          type: string
          enum:
            - pending
            - delivered
            - failed
          description: Delivery state of this callback
        attempts:
          type: integer
          description: Number of delivery attempts made
        max_attempts:
          type: integer
          description: Maximum allowed delivery attempts
        delivered_at:
          type: string
          format: date-time
          description: When the callback was successfully delivered (omitted if not yet delivered)
        last_error:
          type: string
          description: Last error message if delivery failed
    AdvanceSimulationRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          description: |
            The action to take. Valid values depend on the scenario:
            - compliance_hold: "release" | "reject"
            - manual_review: "approve" | "reject"
            - unconfirmed: "confirm" | "expire"
          example: release
        reason_code:
          type: string
          description: Optional reason code for the action (e.g. R10 for ACH return).
          example: R10
    AdvanceSimulationResult:
      type: object
      required:
        - simulation_id
        - previous_state
        - new_state
        - callbacks_scheduled
      properties:
        simulation_id:
          type: string
          description: The simulation that was advanced.
          example: sim_01HXYZ
        previous_state:
          type: string
          description: The state position before advancing (e.g., "compliance_hold").
          example: compliance_hold
        new_state:
          type: string
          description: The state position after advancing (e.g., "release").
          example: release
        callbacks_scheduled:
          type: integer
          description: Number of new callbacks scheduled by this advance action.
          example: 1
    SimulationInspection:
      type: object
      description: Full simulation state including callback history.
      required:
        - simulation_id
        - rail
        - operation
        - scenario
        - state
        - organization_id
        - amount
        - currency
        - created_at
      properties:
        simulation_id:
          type: string
          description: Simulation identifier
        rail:
          type: string
          description: Payment rail (ach, wire, crypto)
        operation:
          type: string
          description: Operation type (inbound_posted, outbound_failed, etc.)
        scenario:
          type: string
          description: Scenario name (success_immediate, success_delayed, compliance_hold, etc.)
        state:
          type: string
          description: Current simulation state (accepted, settled, returned, rejected, failed)
        state_position:
          type: string
          description: Sub-state for multi-step scenarios (e.g. post_hold)
        awaiting_advance:
          type: boolean
          description: Whether the simulation is paused waiting for a POST /advance call
        organization_id:
          type: string
          description: Organization that owns this simulation
        account_id:
          type: string
          description: Platform account ID (for fiat simulations)
        wallet_id:
          type: string
          description: Platform wallet ID (for crypto simulations)
        amount:
          type: string
          description: Amount as decimal string (e.g. "100.50")
        currency:
          type: string
          description: ISO 4217 currency code
        trace_id:
          type: string
          description: Caller-supplied trace ID
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Caller-supplied metadata (informational only)
        created_at:
          type: string
          format: date-time
          description: When the simulation was created
        completed_at:
          type: string
          format: date-time
          description: When the simulation reached a terminal state (omitted if still in progress)
        callbacks:
          type: array
          items:
            $ref: '#/components/schemas/SimulationCallbackRecord'
          description: Callback delivery log ordered by scheduled_for ascending
        advance_actions_available:
          type: array
          items:
            type: string
          description: Valid advance actions when awaiting_advance is true (e.g. ["release", "reject"])
    AssetDeployment:
      type: object
      required:
        - id
        - name
        - network_id
        - contract_address
        - token_standard
        - decimals
      properties:
        id:
          type: string
          description: The symbol of the asset (e.g., USDC, ETH)
          example: USDC
        name:
          type: string
          description: The full name of the asset
          example: USD Coin
        network_id:
          $ref: '#/components/schemas/NetworkId'
        contract_address:
          type: string
          description: The contract address of the asset on the network
          example: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
        token_standard:
          type: string
          description: The token standard (e.g., erc20, spl)
          example: erc20
        decimals:
          type: integer
          description: The number of decimal places for this asset
          example: 6
    SelfServeCreditsBalanceResponse:
      type: object
      required:
        - balance_cents
        - transfer_capacity_cents
      properties:
        balance_cents:
          type: integer
          format: int64
          example: 45000
        transfer_capacity_cents:
          type: integer
          format: int64
          example: 9000000
        health:
          type: string
          enum:
            - healthy
            - low
            - critical
            - empty
          description: |
            Server-owned balance health. Computed live from the same snapshot as
            `percent_remaining`, so the two can never disagree. Clients MUST
            render this rather than deriving bands themselves; treat an
            unrecognised value as `healthy`.
          example: healthy
        balance_baseline_cents:
          type: integer
          format: int64
          description: |
            Denominator for `percent_remaining`: the balance at the client's most
            recent deliberate top-up, ratcheted upward by any incidental credit
            since. `0` means *no baseline* and must never be used as a divisor.
          example: 100000
        percent_remaining:
          type: integer
          description: |
            `balance_cents` as a whole percentage of `balance_baseline_cents`,
            floored. Omitted when `balance_baseline_cents` is 0.
          example: 45
        low_at_transfer_capacity_cents:
          type: integer
          format: int64
          description: |
            Transfer volume at which health becomes `low` — the capacity of the
            largest balance that still classifies `low`. Omitted when
            `balance_baseline_cents` is 0.
          example: 8000000
        min_next_transfer_fee_cents:
          type: integer
          format: int64
          description: |
            Cheapest total fee any configured rail can charge. Below this, rail
            transfers are held.
          example: 51
        transfer_fee_bps:
          type: number
          format: float
          description: The client's transfer fee rate, so callers stop hardcoding 0.25%.
          example: 25
    SelfServeCreditsLedgerEntry:
      type: object
      required:
        - id
        - entry_type
        - category
        - amount_cents
        - balance_after_cents
        - description
        - created_at
      properties:
        id:
          type: string
          example: 34o8dS2h9c7n1V8qLpY2Zx6TwUa
        entry_type:
          type: string
          enum:
            - purchase
            - bonus
            - deduction
            - refund
            - adjustment
          description: |
            `bonus` is a promotional grant written alongside a bulk-tier
            `purchase` row in the same transaction; its `amount_cents` is the
            bonus only and it carries no Stripe session id. `adjustment` has been
            emitted since the adjustment entry type shipped and was missing from
            this enum.
        category:
          type: string
          enum:
            - transaction_fee
            - compliance_fee
            - transaction_refund
            - compliance_refund
            - purchase
            - bonus
            - adjustment
            - unknown
          description: |
            Sub-category that distinguishes transaction fees from compliance
            fees and similar for refunds. `unknown` indicates a legacy row
            written before this column existed.
        amount_cents:
          type: integer
          format: int64
          example: -5000
        balance_after_cents:
          type: integer
          format: int64
          example: 45000
        transaction_id:
          type: string
          nullable: true
        stripe_payment_intent_id:
          type: string
          nullable: true
          description: Stripe PaymentIntent ID (pi_...) for purchase entries — paste into the Stripe dashboard search to look up the underlying payment.
          example: pi_3M5xY42eZvKYlo2C0xRm6WVe
        description:
          type: string
          example: Transfer fee for transaction txn_123
        created_at:
          type: string
          format: date-time
    SelfServeCreditsLedgerResponse:
      type: object
      required:
        - entries
        - has_more
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SelfServeCreditsLedgerEntry'
        has_more:
          type: boolean
          example: false
    SelfServeCreditTier:
      type: object
      required:
        - price_cents
        - transfer_capacity_cents
      properties:
        price_cents:
          type: integer
          format: int64
          description: Amount charged via Stripe Checkout, in USD cents.
          example: 3600000
        credit_cents:
          type: integer
          format: int64
          description: |
            Total credit balance granted for this tier, in USD cents of transfer
            fee. Equal to `price_cents` for standard tiers; larger for bulk
            tiers, where the difference is `bonus_cents`.
          example: 6000000
        bonus_cents:
          type: integer
          format: int64
          description: |
            Promotional credit granted on top of `price_cents`, i.e.
            `credit_cents - price_cents`. `0` for standard tiers.
          example: 2400000
        effective_fee_bps:
          type: number
          format: float
          description: |
            Blended rate this tier delivers, rounded to two decimals:
            `transfer_fee_bps * price_cents / credit_cents`. Credits are still
            consumed at the client's `transfer_fee_bps`; the discount is
            delivered entirely as `bonus_cents` at purchase time.
          example: 15
        transfer_capacity_cents:
          type: integer
          format: int64
          description: |
            Transfer volume `credit_cents` buys at the client's `transfer_fee_bps`,
            floored. Banking and compliance fees are charged on top and reduce it.
          example: 2400000000
    SelfServeCreditTiersResponse:
      type: object
      required:
        - tiers
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/SelfServeCreditTier'
    SelfServeCreditsPurchaseRequest:
