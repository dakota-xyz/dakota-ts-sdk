        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        destination_crypto_address:
          type: string
          description: Destination blockchain address
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        deposit_transaction_hash:
          type: string
          description: Transaction hash for intermediate transaction, such as the first half of an offramp or two-part swap
        transaction_hash:
          type: string
          description: Transaction hash for main transaction that reaches the recipient, if applicable
    PaginatedAutoTransactionResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AutoAccountTransaction'
    AttachedPolicy:
      type: object
      description: Slim reference to a policy attached to a wallet (id + name only).
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Policy id.
          example: pol_2N4YkKpKu7M3mKpGYmF8kcJ8oZT
        name:
          type: string
          description: Policy name.
          example: High Value Transaction Policy
    AttachedWallet:
      type: object
      description: Slim reference to a wallet attached to a policy or signer group (id + name + family).
      required:
        - id
        - name
        - family
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        name:
          type: string
          description: Wallet name.
          example: Treasury Wallet
        family:
          $ref: '#/components/schemas/Family'
    OneOffTransactionType:
      type: string
      description: Transaction type for one-off transaction creation.
      enum:
        - one_off
      example: one_off
    OneOffTransactionRequest:
      type: object
      description: |
        Request to create a one-off transfer. The transfer type is determined by
        the destination type referenced by `destination_id`:
        - **Offramp** when the destination is a fiat bank account (fiat_us or
          fiat_iban). `destination_payment_rail` is honored; `destination_network_id`
          is ignored.
        - **Swap** when the destination is a crypto address.
          `destination_network_id` is required and selects the destination
          chain.

        The platform generates a single-use deposit address and finalizes the
        transfer once the source-asset deposit arrives.
      required:
        - customer_id
        - source_network_id
        - source_asset
        - destination_id
        - destination_asset
      properties:
        transaction_type:
          $ref: '#/components/schemas/OneOffTransactionType'
        amount:
          type: string
          description: |
            Optional expected destination amount as a decimal string. When
            omitted, the resulting transaction's destination amount is
            populated from the actual deposit once funds arrive. When
            provided, must be at least 0.01 and is enforced by sandbox
            amount caps where applicable.
          example: '1.23'
          pattern: ^[0-9]+(\.[0-9]+)?$
          minLength: 1
        customer_id:
          $ref: '#/components/schemas/KSUID'
        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        source_asset:
          type: string
          description: Source crypto asset symbol
          example: USDC
        destination_id:
          $ref: '#/components/schemas/KSUID'
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        destination_asset:
          type: string
          description: Destination asset symbol. For offramps this is a fiat currency (e.g. `USD`, `EUR`). For swaps this is the destination stablecoin (e.g. `USDC`, `RD`).
          example: USD
        destination_payment_rail:
          $ref: '#/components/schemas/PaymentCapability'
          description: Optional preferred payment rail for bank transfers (offramp). Ignored when the destination is a crypto address. If not specified, the system will automatically select the most appropriate rail based on the destination's supported methods.
        payment_reference:
          type: string
          description: 'Optional payment reference message for bank transfers. Length limits: ACH (1-18 chars), Wire (1-140 chars), SEPA (6-140 chars), SWIFT (1-140 chars, max 4 lines of 35 chars each)'
          minLength: 1
          maxLength: 140
          example: Invoice payment for services
        developer_fee_bps:
          type: integer
          format: int32
          description: Developer fee in basis points (1 bp = 0.01%). Overrides the default client fee for this transaction.
          example: 50
          minimum: 0
          maximum: 10000
    OneOffTransaction:
      type: object
      description: A one-off transaction response. Used for single-use offramp (crypto-to-fiat) and swap (crypto-to-crypto) transfers; the destination type determines which.
      required:
        - id
        - resource_type
        - customer_id
        - crypto_address
        - status
        - source_network_id
        - source_asset
        - destination_id
        - destination_asset
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        resource_type:
          allOf:
            - $ref: '#/components/schemas/TransactionResourceType'
          description: Discriminator field. Always "one_off" for one-off transactions.
          example: one_off
        customer_id:
          $ref: '#/components/schemas/KSUID'
        crypto_address:
          type: string
          description: Temporary address where funds should be sent
          example: '0x1234567890abcdef1234567890abcdef12345678'
        send_amount:
          type: string
          description: Amount that should be sent (may be higher than requested amount due to fees)
          example: '1.24'
        status:
          $ref: '#/components/schemas/OneOffTransactionStatus'
        amount:
          type: string
          description: Original requested amount
          example: '1.23'
        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        source_asset:
          type: string
          description: Source crypto asset symbol
          example: USDC
        destination_id:
          $ref: '#/components/schemas/KSUID'
        destination_asset:
          $ref: '#/components/schemas/Asset'
        failure_reason:
          type: string
          description: Reason for failure if status is failed
        receipt:
          $ref: '#/components/schemas/TransactionReceipt'
          nullable: true
          type: object
        crypto_details:
          $ref: '#/components/schemas/TransactionCryptoDetails'
          nullable: true
          type: object
        sender_details:
          $ref: '#/components/schemas/SenderDetails'
        created_at:
          type: integer
          description: Unix timestamp when the transaction was created
          example: 1234567890
        updated_at:
          type: integer
          description: Unix timestamp when the transaction was last updated
          example: 1234567890
        completed_at:
          type: integer
          description: Unix timestamp when the transaction was completed
          example: 1234567890
        destination_payment_rail:
          $ref: '#/components/schemas/PaymentCapability'
          description: The payment rail that was selected for this transaction
          nullable: true
          type: string
        payment_reference:
          type: string
          description: Payment reference message for bank transfers (e.g. wire message, SWIFT or SEPA reference)
          nullable: true
        destination_bank_name:
          type: string
          description: Name of the destination bank
          example: Chase Bank
        destination_account_holder_name:
          type: string
          description: Name of the account holder at the destination bank
          example: Acme Corporation
        destination_account_number_last_four:
          type: string
          description: Last four digits of the destination account number
          example: '6789'
        destination_routing_number:
          type: string
          description: ABA routing number for US bank accounts
          example: '021000021'
        destination_iban:
          type: string
          description: IBAN for international bank accounts
          example: GB82WEST12345698765432
        destination_bic:
          type: string
          description: BIC/SWIFT code for international transfers
          example: BARCGB22XXX
        return_code:
          type: string
          description: NACHA/Fedwire return code (e.g., R01) when the transaction was returned by the receiving bank.
          example: R01
        return_reason:
          type: string
          description: Human-readable return reason provided by the receiving bank.
          example: Insufficient Funds
        return_initiated_at:
          type: integer
          description: Unix timestamp when the return was initiated.
          example: 1234567890
        return_deadline:
          type: integer
          description: Unix timestamp deadline for return processing.
          example: 1234567890
        net_recovered_amount:
          type: string
          nullable: true
          description: Decimal amount actually recovered when a returned transaction settled short, denominated in the transaction's own currency (the same basis as its face amount), so face amount minus this value is exactly what the bank withheld. Present only when a return came back short — absent when the full amount was recovered, or when the rail reports no net figure at all (ACH never does). Absent means the face amount is authoritative; it never means zero.
          example: '24955'
        reversal_reason:
          type: string
          description: Lead Bank ACH reversal reason when the originator reverses the transaction (e.g., duplicate, receiver_incorrect).
          example: duplicate
        reversal_initiated_at:
          type: integer
          description: Unix timestamp when the reversal was initiated.
          example: 1234567890
        customer_name:
          type: string
          description: Display name of the customer associated with this transaction.
          example: Acme Corp
    OneOffTransactionStatus:
      type: string
      description: Status of a one-off transaction
      enum:
        - pending
        - processing
        - completed
        - failed
        - cancelled
        - reversed
        - pending_return
        - returned
        - pending_reversal
      example: pending
    PaginatedOneOffTransactionResponse:
      type: object
      description: Wrapper for a paginated list of one-off transactions.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OneOffTransaction'
        meta:
          $ref: '#/components/schemas/TransactionListMeta'
    PaginatedWalletTransactionResponse:
      type: object
      description: Wrapper for a paginated list of wallet transactions.
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        meta:
          $ref: '#/components/schemas/TransactionListMeta'
    Wallet:
      type: object
      description: Non-custodial wallet managed by Dakota Platform with a single address usable across networks within the same family.
      required:
        - id
        - client_id
        - family
        - address
        - name
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        client_id:
          $ref: '#/components/schemas/KSUID'
        customer_id:
          $ref: '#/components/schemas/KSUID'
        customer_name:
          type: string
          description: Customer name joined server-side. Populated on GET responses; omitted from create responses.
          nullable: true
        family:
          $ref: '#/components/schemas/Family'
        address:
          type: string
          description: The wallet address, same across all networks within the same family
          example: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
        name:
          type: string
          description: The wallet name
          example: My Wallet
        created_at:
          type: integer
          description: Created-at unix timestamp. Populated on GET responses.
    WalletCreateRequest:
      type: object
      description: Request to create a new non-custodial wallet
      required:
        - signer_groups
        - policies
        - family
        - name
      properties:
        customer_id:
          $ref: '#/components/schemas/KSUID'
        signer_groups:
          type: array
          items:
            type: string
          description: Array of signer group ids to attach to the wallet.
        policies:
          type: array
          items:
            type: string
          description: Array of policy ids to attach to the wallet.
        family:
          $ref: '#/components/schemas/Family'
        name:
          type: string
          description: Name of the wallet
    WalletBalances:
      type: object
      description: Balances for a wallet address across all networks
      required:
        - wallet_id
        - address
        - balances
        - total_amount_usd
      properties:
        wallet_id:
          $ref: '#/components/schemas/KSUID'
        address:
          type: string
          description: The wallet address
          example: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/AssetBalance'
          description: List of asset balances
        total_amount_usd:
          type: string
          description: Total USD value of all balances, as a decimal string with 2 decimal places (cents). Rounded DOWN (truncated toward zero), never rounded up, so the value never exceeds the holder's spendable balance.
          example: '1234.56'
    AssetBalance:
      type: object
      description: Balance for a specific asset on a specific network
      required:
        - asset
        - amount_usd
      properties:
        asset:
          $ref: '#/components/schemas/AssetDeployment'
        amount_usd:
          type: string
          description: USD value of this asset balance, as a decimal string with 2 decimal places (cents). Rounded DOWN (truncated toward zero), never rounded up, so the value never exceeds the holder's spendable balance.
          example: '123.45'
    WalletTransaction:
      type: object
      description: Transaction details representing a transfer of funds from a crypto wallet.
      required:
        - id
        - resource_type
        - wallet_id
        - status
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        resource_type:
          allOf:
            - $ref: '#/components/schemas/TransactionResourceType'
          description: Discriminator field. Always "wallet" for wallet transactions.
          example: wallet
        wallet_id:
          $ref: '#/components/schemas/KSUID'
        network_id:
          $ref: '#/components/schemas/NetworkId'
        from:
          type: string
          description: The source address
        to:
          type: string
          description: The destination address
        transaction_hash:
          type: string
          description: The transaction hash
          example: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
        transaction_type:
          $ref: '#/components/schemas/WalletTransactionType'
        amount:
          type: string
          description: The transaction amount
          example: '100.56'
        asset:
          $ref: '#/components/schemas/Asset'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        created_at:
          type: integer
          format: int64
          description: Unix time the transaction was created.
          example: 1781181600
        confirmed_at:
          type: integer
          format: int64
          description: Unix time the transaction was confirmed on chain; absent until confirmed.
          example: 1781181660
    WalletTransactionType:
      type: string
      description: Type of transaction
      enum:
        - transfer
        - evm_contract_call
    SignerGroup:
      type: object
      description: Group of signers that dictates who can sign transactions for a wallet
      required:
        - id
        - client_id
        - name
        - members
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        client_id:
          $ref: '#/components/schemas/KSUID'
        name:
          type: string
          description: The wallet name
          example: My Wallet
        members:
          type: array
          description: Members that make up the signer group
          items:
            $ref: '#/components/schemas/Signer'
        removed_members:
          type: array
          description: |
            Signers previously in this group that have since been removed.
            Populated only when the request sets `include_removed=true`; each
            entry carries its `removed_at` timestamp. Omitted otherwise.
          items:
            $ref: '#/components/schemas/Signer'
    Signer:
      type: object
      description: A signer is a public key that can sign intents and it is part of a signer group
      required:
        - id
        - name
        - public_key
        - key_type
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        client_id:
          $ref: '#/components/schemas/KSUID'
        name:
          type: string
          description: The signer name
          example: Marc
        public_key:
          type: string
          description: |
            The signer public key. For KEY_TYPE_ES256 this must be a
            base64-encoded X.509 SubjectPublicKeyInfo (PKIX) for an ECDSA
            P-256 key. Both PEM-wrapped (with BEGIN/END PUBLIC KEY headers)
            and raw DER encodings are accepted.

            For KEY_TYPE_WEBAUTHN this must be a base64-encoded COSE public
            key. Only ES256 (EC2 / P-256, COSE alg -7) and RS256 (RSA,
            2048-bit minimum, COSE alg -257) keys are supported; other
            algorithms and curves are rejected. See the WebAuthn & Passkey
            Signing guide for how each signatures[] entry is then built.
        key_type:
          type: string
          description: Type of the key
          enum:
            - ES256
            - WEBAUTHN
        removed_at:
          type: integer
          format: int64
          description: |
            Epoch seconds at which this signer was removed from the containing
            signer group. Present only for entries in a group's `removed_members`
            (i.e. when `include_removed=true`); absent for active members.
    SignerCreateRequest:
      type: object
      description: Request to create a new signer
      required:
        - name
        - public_key
        - key_type
      properties:
        name:
          type: string
          description: The signer name
          example: Marc
        public_key:
          type: string
          description: |
            The signer public key. For KEY_TYPE_ES256 this must be a
            base64-encoded X.509 SubjectPublicKeyInfo (PKIX) for an ECDSA
            P-256 key. Both PEM-wrapped (with BEGIN/END PUBLIC KEY headers)
            and raw DER encodings are accepted.

            For KEY_TYPE_WEBAUTHN this must be a base64-encoded COSE public
            key. Only ES256 (EC2 / P-256, COSE alg -7) and RS256 (RSA,
            2048-bit minimum, COSE alg -257) keys are supported; other
            algorithms and curves are rejected. See the WebAuthn & Passkey
            Signing guide for how each signatures[] entry is then built.
        key_type:
          type: string
          description: Type of the key
          enum:
            - ES256
            - WEBAUTHN
    SignerGroupCreateRequest:
      type: object
      description: Request to create a new signer group
      required:
        - name
        - member_keys
      properties:
        name:
          type: string
          description: Name of the signer group
        member_keys:
          type: array
          description: |
            Public keys of the members that make up the signer group. At most
            64 keys: each key is parsed and checked against the platform's
            managed signing identities before the group is created, so an
            unbounded list would let one request drive unbounded work.
          minItems: 1
          items:
            type: string
            description: The signer public key
    Policy:
      type: object
      required:
        - id
        - version
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the policy
          example: pol_2N4YkKpKu7M3mKpGYmF8kcJ8oZT
        client_id:
          $ref: '#/components/schemas/KSUID'
        signer_group_id:
          type: string
          description: ID of the signer group that governs mutations of this policy. Members of this group must endorse any add_policy_rule, update_policy_rule, remove_policy_rule, or delete_policy intent.
          example: grp_2N4YkKpKu7M3mKpGYmF8kcJ8oZT
          nullable: true
        version:
          type: integer
          format: int32
          description: Version number of the policy (incremented on rule changes)
          example: 1
        name:
          type: string
          description: Human-readable name for the policy
          example: High Value Transaction Policy
        description:
          type: string
          description: Optional description of the policy's purpose
          example: Requires approval for transactions above $10,000
          nullable: true
        rules:
          type: array
          description: Rules that make up this policy
          items:
            $ref: '#/components/schemas/PolicyRule'
        created_at:
          type: integer
          description: Unix timestamp when the policy was created
          example: 1640995200
        updated_at:
          type: integer
          description: Unix timestamp when the policy was last updated
          example: 1640995200
    PolicyRule:
      type: object
      required:
        - id
        - policy_id
        - rule_type
        - action
        - definition
        - created_at
      properties:
        id:
          type: string
          description: Unique identifier for the rule (stable within the policy)
          example: rule_2N4YkKpKu7M3mKpGYmF8kcJ8oZT
        policy_id:
          type: string
          description: Policy ID this rule belongs to
          example: pol_2N4YkKpKu7M3mKpGYmF8kcJ8oZT
        rule_type:
          type: string
          description: Type of rule
          enum:
            - approval_threshold
            - amount_threshold
            - address_list
          example: amount_threshold
        action:
          type: string
          description: Action to take when rule matches
          enum:
            - allow
            - deny
          example: deny
        definition:
          type: object
          description: |
            Rule-specific configuration. The keys present depend on `rule_type`.
            - `amount_threshold`: `min_amount` (integer), `threshold` (integer),
              and `asset` (object) carrying `id`, the asset symbol, stored
              upper case; `name` appears only when the rule was created with
              one. `min_amount` is in the asset's smallest unit, and
              `threshold` is the number of authorized endorsements required.
            - `approval_threshold`: `threshold` (integer) and, when one was set,
              `description` (string).
            - `address_list`: `addresses` (array of strings).
          example:
            min_amount: 10000000000
            threshold: 2
            asset:
              id: USDC
        created_at:
          type: integer
          description: Unix timestamp when the rule was created
          example: 1640995200
    CreatePolicyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable name for the policy
          example: High Value Transaction Policy
        description:
          type: string
          description: Optional description of the policy's purpose
          example: Requires approval for transactions above $10,000
          nullable: true
        signer_group_id:
          type: string
          description: ID of the signer group to associate with this policy
          example: grp_2N4YkKpKu7M3mKpGYmF8kcJ8oZT
          nullable: true
        rules:
          type: array
          description: Initial rules for this policy
          items:
            $ref: '#/components/schemas/CreatePolicyRuleRequest'
    CreatePolicyRuleRequest:
      type: object
      required:
        - rule_type
        - action
        - definition
      properties:
        rule_type:
          type: string
          description: Type of rule
          enum:
            - approval_threshold
            - amount_threshold
            - address_list
          example: amount_threshold
        action:
          type: string
          description: Action to take when rule matches
          enum:
            - allow
            - deny
          example: deny
        definition:
          type: object
          description: |
            Rule-specific configuration. When a policy is created or a rule is
            added, the accepted keys depend on `rule_type`. A key that is not
            listed below is rejected with `400`, and the response names it.
            - `amount_threshold`: `min_amount` (integer, 0 or greater,
              required), `threshold` (integer, 1 or greater, required), and
              `asset` (object, required) with `id` - the asset symbol, one of
              `USDC`, `USDT`, or `RD`, stored upper case; optionally
              `name`, a display label that plays no part in matching. Any other
              key inside `asset` is rejected. There is no way to omit the
              asset: a missing asset, or an `asset.id` that is empty or `any`,
              is rejected with `400`. The rule governs transactions in that
              asset on every network, unless the stored asset names one.
              `min_amount` is an amount of that asset in its smallest unit -
              USDC has 6 decimals, so 10000000000 is 10,000 USDC - and
              `threshold` is the number of authorized endorsements required
              once a transaction reaches `min_amount`.
            - `approval_threshold`: `threshold` (integer, 1 or greater,
              required), `description` (string, optional).
            - `address_list`: `addresses` (array of one or more strings,
              required).
            Every integer must be whole. The server rejects a fractional value
            instead of truncating it.
            Updating an existing rule is validated more strictly - see
            `updated_definition`.
          example:
            min_amount: 10000000000
            threshold: 2
            asset:
              id: USDC
    EndorsedRequest:
      type: object
      required:
        - signatures
        - intent
      properties:
        signatures:
          type: array
          description: List of signatures over the intent
          items:
            type: string
            description: |
              Cryptographic signature over the intent, base64-encoded. For an
              ES256 signer this is the ASN.1 DER ECDSA signature over the
              SHA-256 of the canonical intent. For a WEBAUTHN signer this is
              the base64 of the WebAuthn assertion JSON (id, rawId, type, and
              response.authenticatorData / clientDataJSON / signature). See
              the WebAuthn & Passkey Signing guide.
            example: LS0tLS1CRUdJ...0tLS0tCg==
        intent:
          oneOf:
            - $ref: '#/components/schemas/SendTransactionIntent'
            - $ref: '#/components/schemas/AttachGroupToWalletIntent'
            - $ref: '#/components/schemas/DetachGroupFromWalletIntent'
            - $ref: '#/components/schemas/AttachPolicyToWalletIntent'
            - $ref: '#/components/schemas/DetachPolicyFromWalletIntent'
            - $ref: '#/components/schemas/AddPolicyRuleIntent'
            - $ref: '#/components/schemas/RemovePolicyRuleIntent'
            - $ref: '#/components/schemas/UpdatePolicyRuleIntent'
            - $ref: '#/components/schemas/DeletePolicyIntent'
            - $ref: '#/components/schemas/EnableCardSettlementIntent'
          description: The intent being endorsed
    SendTransactionIntent:
      type: object
      required:
        - wallet_id
        - caip2
        - operation
        - idempotency_key
      properties:
        wallet_id:
          type: string
          description: Unique identifier for the wallet
        caip2:
          type: string
          description: CAIP-2 chain identifier for the target blockchain network
        operation:
          $ref: '#/components/schemas/TransactionOperation'
        idempotency_key:
          type: string
          description: A unique key to ensure idempotency of the request
        context_digest:
          type: string
          description: |
            Optional opaque SHA-256d digest (base64-encoded) of an upstream
            operator-meaningful context envelope produced by the originating
            service (e.g. financial-account).

            Neither platform nor policy-engine interprets the semantic
            content. Policy-engine includes the field in canonical hashing
            so the WebAuthn signature commits to it; beyond that the digest
            is never read, validated, or logged. The pre-image is persisted
            upstream and exists for forensic / non-repudiation purposes
            (see ENG-1962).

            Intents predating this field validate as today (empty / omitted).
    TransactionOperation:
      type: object
      required:
        - kind
        - from
        - to
        - asset_id
      properties:
        kind:
          type: string
          description: 'Transaction type: transfer or contract call'
        from:
          type: string
          description: The wallet address initiating the transaction
        to:
          type: string
          description: The recipient address of the transaction
        amount:
          type: string
          description: |
            Amount to be transferred as a non-negative decimal string. Required for
            transfer operations; optional for contract calls (defaults to zero).
            Leading zeros, signs, commas, and non-finite values are rejected.
            For transfer operations the handler additionally requires the value to be greater than zero.
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          minLength: 1
        asset_id:
          type: string
          description: Crypto asset symbol for the transfer or contract call.
          example: USDC
        method:
          type: string
          description: The method name to be invoked on the contract
        args:
          type: array
          description: Arguments for the contract method call
          items:
            type: string
        data:
          type: string
          description: The calldata payload for the contract call
