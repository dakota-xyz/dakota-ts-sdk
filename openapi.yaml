    Transaction:
      type: object
      description: A unified transaction object representing money movements in the Dakota platform. Used for auto-account transactions.
      required:
        - id
        - resource_type
        - type
        - status
        - description
        - inputAmount
        - subtotalAmount
        - convertedAmount
        - outputAmount
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        resource_type:
          allOf:
            - $ref: '#/components/schemas/TransactionResourceType'
          description: Discriminator field. Always "auto_account" for auto-account transactions.
          example: auto_account
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
          description: Human-readable description of the transaction.
          example: USD to ETH conversion
        inputAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: The amount of money input into the transaction.
        subtotalAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: TODO @Marc what does this mean specifically?
        convertedAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: TODO @Marc what does this mean specifically?
        outputAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: The amount of money output from the transaction.
        settlement:
          $ref: '#/components/schemas/TransactionSettlement'
        components:
          type: array
          description: List of component transactions for composite transactions.
          items:
            $ref: '#/components/schemas/NestedTransaction'
          nullable: true
        createdAt:
          type: integer
          description: Unix timestamp when the transaction was created.
          example: 1234567890
        updatedAt:
          type: integer
          description: Unix timestamp when the transaction was last updated.
          example: 1234567890
        completedAt:
          type: integer
          description: Unix timestamp when the transaction was completed. Null if not completed.
          nullable: true
          example: 1234567890
        sender_details:
          $ref: '#/components/schemas/SenderDetails'
    TransactionResource:
      oneOf:
        - $ref: '#/components/schemas/OneOffTransaction'
        - $ref: '#/components/schemas/WalletTransaction'
        - $ref: '#/components/schemas/Transaction'
      discriminator:
        propertyName: resource_type
        mapping:
          one_off: '#/components/schemas/OneOffTransaction'
          wallet: '#/components/schemas/WalletTransaction'
          auto_account: '#/components/schemas/Transaction'
    PaginatedCustomerTransactionResponse:
      type: object
      description: Wrapper for a paginated list of auto-account transactions.
      required:
