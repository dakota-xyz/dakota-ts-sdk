      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
            example:
              account_type: onramp
              crypto_destination_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
              fiat_destination_id: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
