  /sandbox/simulate/inbound:
    post:
      tags:
        - Sandbox
      summary: Simulate an inbound payment event
      description: |
        Triggers a simulated payment event through the mock Lead Bank provider.
        Accepted immediately; callbacks are delivered asynchronously.
        Idempotent: repeated calls with the same simulation_id and identical parameters
        return the original response. Conflicting parameters return 409.
      operationId: simulateInbound
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SandboxScenarioHeader'
        - $ref: '#/components/parameters/SandboxErrorStepHeader'
        - $ref: '#/components/parameters/SandboxErrorStatusHeader'
        - $ref: '#/components/parameters/SandboxErrorMessageHeader'
        - $ref: '#/components/parameters/SandboxInstantCompletionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - simulation_id
                - type
                - amount
                - currency
              properties:
                simulation_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Unique ID for this simulation (used for idempotency)
                  example: sim_01H...
                type:
                  type: string
                  description: |
                    Payment rail and direction. Use the `fedwire_*` values for
                    Fedwire flows; the `wire_*` values are accepted as legacy
                    aliases for backwards compatibility and may be removed in
                    a future major version.
                  enum:
                    - ach_inbound
                    - fedwire_inbound
                    - wire_inbound
                    - fednow_inbound
                    - crypto_inbound
                    - ach_outbound_returned
                    - ach_outbound_failed
                    - fedwire_outbound_returned
                    - wire_outbound_returned
                    - fedwire_outbound_failed
                    - wire_outbound_failed
                    - ach_outbound_settled
                    - ach_outbound_rejected
                    - fedwire_outbound_settled
                    - wire_outbound_settled
                    - fedwire_outbound_rejected
                    - wire_outbound_rejected
                    - ach_reversal
                    - fedwire_reversal
                    - wire_reversal
                  example: ach_inbound
                account_id:
                  type: string
                  description: |
                    Platform account ID of the target onramp/offramp auto account.
                    **Required for `ach_inbound`, `fedwire_inbound`, and `fednow_inbound`.**
                    Ignored for other `type` values.
                  example: acc_123
                wallet_address:
                  type: string
                  description: |
                    The on-chain wallet address returned by `POST /wallets`
                    (see the `address` field in the response). **Required for
                    `crypto_inbound`.** Ignored for other types.
                  example: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
                wallet_id:
                  type: string
                  description: |
                    Legacy alias for `wallet_address`. Prefer `wallet_address` —
                    this field is accepted for backwards compatibility and may
                    be removed in a future major version.
                  deprecated: true
                  example: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
                one_off_transaction_id:
                  type: string
                  description: |
                    The one-off transaction ID returned by
                    `POST /transactions/one-off` (see the `id` field in the
                    response). **Required for outbound types**
                    (`ach_outbound_*`, `fedwire_outbound_*`, `*_reversal`).
                    Ignored for inbound types.
                  example: 2NfHrqBHb3cTfLVkFSGmHZqdDQ7
                movement_id:
                  type: string
                  description: |
                    Legacy alias for `one_off_transaction_id`. Prefer
                    `one_off_transaction_id` — this field is accepted for
                    backwards compatibility and may be removed in a future
                    major version.
                  deprecated: true
                  example: 2NfHrqBHb3cTfLVkFSGmHZqdDQ7
                amount:
                  type: string
                  description: Amount as a decimal string
                  example: '100.00'
                currency:
                  type: string
                  description: Currency code
                  example: USD
                scenario:
                  type: string
                  description: |
                    Simulation scenario. Defaults to success_immediate.
                    - success_immediate: callbacks fire immediately
                    - success_delayed: callbacks fire after delay_seconds (default 30s)
                    For crypto_inbound: success_immediate | wrong_chain | unsupported_token |
                      address_mismatch | partial_crypto | unconfirmed
                  example: success_immediate
                partial_amount:
                  type: string
                  description: |
                    Amount actually received (for crypto_inbound with scenario=partial_crypto only).
                    Must be a valid decimal less than amount.
                  example: '50.00'
                delay_seconds:
                  type: integer
                  description: Delay in seconds for success_delayed scenario (1-86400)
                  minimum: 1
                  maximum: 86400
                  example: 30
                trace_id:
                  type: string
                  description: Optional trace ID for correlation
            example:
              simulation_id: sim_qa_run_001
              type: ach_inbound
              account_id: acc_123
              amount: '100.00'
              currency: USD
              scenario: success_immediate
      responses:
        '200':
          description: Simulation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation_id:
                    type: string
                  state:
                    $ref: '#/components/schemas/SimulationState'
                  trace_id:
                    type: string
              example:
                simulation_id: sim_qa_run_001
                state: accepted
                trace_id: trace_abc123
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: Invalid request
                instance: https://api.platform.dakota.xyz/sandbox/simulate/inbound
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '403':
          description: Not available in production
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#forbidden
                title: Not available in production
                status: 403
                detail: Not available in production
                instance: https://api.platform.dakota.xyz/sandbox/simulate/inbound
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '404':
          description: Account not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Account not found
                status: 404
                detail: Account not found
                instance: https://api.platform.dakota.xyz/sandbox/simulate/inbound
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '409':
          description: Simulation ID conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#conflict
                title: Simulation ID conflict
                status: 409
                detail: Simulation ID conflict
                instance: https://api.platform.dakota.xyz/sandbox/simulate/inbound
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '502':
          description: Provider gRPC call failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#provider-error
                title: Provider gRPC call failed
                status: 502
                detail: Provider gRPC call failed
                instance: https://api.platform.dakota.xyz/sandbox/simulate/inbound
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
      externalDocs:
        description: Read full guide in docs
        url: https://docs.dakota.xyz/api-reference/sandbox/simulate-an-inbound-payment-event
  /sandbox/simulate/onboarding:
    post:
      tags:
        - Sandbox
      summary: Simulate an onboarding state transition
      description: |
        Drives KYB, KYC, or applicant account status through a sandbox transition
        without waiting for real compliance review. Available in sandbox mode only.

        **Type → effect mapping:**

        | type | KYB status set | Application status set | webhooks emitted |
        |---|---|---|---|
        | `kyb_approve` | approved (via provisioning) | approved | 2× `customer.kyb_status.created` (one per provider, `kyb_status: approved`) + `recipient.created` |
        | `kyb_reject` | — | declined | (none — application status only) |
        | `kyb_info_request` | — | request_for_information | (none — application status only) |
        | `kyc_approve` | — | approved | (none — application status only) |
        | `kyc_reject` | — | declined | (none — application status only) |
        | `kyc_info_request` | — | request_for_information | (none — application status only) |
        | `applicant_activate` | approved (via provisioning) | approved | 2× `customer.kyb_status.created` (one per provider, `kyb_status: approved`) + `recipient.created` |
        | `applicant_suspend` | — | declined | (none — application status only) |

        **Approving customers (individual or business):** Use `kyb_approve` to fully approve
        any customer type. This triggers the complete onboarding flow including endorsement
        and recipient creation. The `kyc_*` types only update the individual applicant's
        KYC application status without triggering the full onboarding flow.

        **Note:** `applicant_activate` does NOT auto-create payment accounts, wallets, or
        account numbers. Create those separately via the account creation API after activation.
      operationId: simulateOnboarding
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/SandboxScenarioHeader'
        - $ref: '#/components/parameters/SandboxErrorStepHeader'
        - $ref: '#/components/parameters/SandboxErrorStatusHeader'
        - $ref: '#/components/parameters/SandboxErrorMessageHeader'
        - $ref: '#/components/parameters/SandboxInstantCompletionHeader'
        - $ref: '#/components/parameters/SandboxSkipAutoApprovalHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - applicant_id
                - simulation_id
              properties:
                type:
                  type: string
                  enum:
                    - kyb_approve
                    - kyb_reject
                    - kyb_info_request
                    - kyc_approve
                    - kyc_reject
                    - kyc_info_request
                    - applicant_activate
                    - applicant_suspend
                  description: The onboarding transition to simulate
                applicant_id:
                  type: string
                  description: The onboarding application ID (from POST /applications)
                  example: 01H...
                organization_id:
                  type: string
                  description: Organization ID (for context; optional, used for logging)
                  example: org_01H...
                simulation_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Unique ID for this simulation (for idempotency and tracing)
                  example: sim_03H...
                reason_code:
                  type: string
                  description: Optional reason code for reject/info_request transitions
                  example: MISSING_EIN
                info_request_fields:
                  type: array
                  items:
                    type: string
                  description: Fields to request (for *_info_request types only)
                  example:
                    - ssn
                    - address
            example:
              type: kyb_approve
              applicant_id: 01HABCDEFG1234567890XYZ
              simulation_id: sim_kyb_approve_001
      responses:
        '200':
          description: Onboarding transition applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation_id:
                    type: string
                  applicant_id:
                    type: string
                  previous_state:
                    type: string
                    description: KYB status before the transition
                  new_state:
                    type: string
                    description: KYB status after the transition
              example:
                simulation_id: sim_kyb_approve_001
                applicant_id: 01HABCDEFG1234567890XYZ
                previous_state: pending
                new_state: approved
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: Invalid request
                instance: https://api.platform.dakota.xyz/sandbox/simulate/onboarding
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '403':
          description: Not available in production
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#forbidden
                title: Not available in production
                status: 403
                detail: Not available in production
                instance: https://api.platform.dakota.xyz/sandbox/simulate/onboarding
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '404':
          description: Applicant not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Applicant not found
                status: 404
                detail: Applicant not found
                instance: https://api.platform.dakota.xyz/sandbox/simulate/onboarding
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        '500':
          description: Failed to apply transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#internal-error
                title: Failed to apply transition
                status: 500
                detail: Failed to apply transition
                instance: https://api.platform.dakota.xyz/sandbox/simulate/onboarding
                request_id: req_01hzy6y7v8w9x0y1z2a3b4c5d6
