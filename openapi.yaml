    ApplicationDocumentUploadRequest:
      type: object
      description: Request to upload an application-level document
      required:
        - document_type
        - file_type
        - file_content
        - country
      properties:
        document_type:
          $ref: '#/components/schemas/ApplicationDocumentType'
        file_type:
          $ref: '#/components/schemas/FileType'
        file_content:
          type: string
          format: byte
          description: Base64-encoded file content. Maximum size after decoding is 20MB.
          example: JVBERi0xLjQKJeLjz9MKMw==
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code for the document
          minLength: 2
          maxLength: 2
          example: US
        id_number:
          type: string
          description: Optional ID/registration number. Required for formation documents.
          minLength: 3
          maxLength: 50
        filename:
          type: string
          maxLength: 100
          description: Optional original filename. Will be sanitized for safe storage and display.
          example: source_of_wealth.pdf
        description:
          type: string
          maxLength: 500
          description: Optional description of the document
          example: Q3 2024 bank statement
    ApplicationDocumentUploadUrlRequest:
      type: object
      description: Request to create a presigned upload session for an application-level document
      required:
        - document_type
        - file_type
      properties:
        document_type:
          $ref: '#/components/schemas/ApplicationDocumentType'
        file_type:
          $ref: '#/components/schemas/FileType'
        country:
          type: string
          description: |
            ISO 3166-1 alpha-2 country code for the document. Optional: some
            supporting documents (e.g. the generic `other` type) have no issuing
            country.
          minLength: 2
          maxLength: 2
          example: US
        id_number:
          type: string
          description: Optional ID/registration number. Required for formation documents.
          minLength: 3
          maxLength: 50
        filename:
          type: string
          maxLength: 100
          description: Optional original filename. Will be sanitized for safe storage and display.
          example: source_of_wealth.pdf
    IndividualDocumentUploadRequest:
      type: object
      description: Request to upload a document for an individual (identity or EDD document). For identity documents (passport, drivers_license_front, drivers_license_back, residence_permit_front, residence_permit_back), id_number is required.
      required:
        - type
        - file_type
        - file_content
        - country
      properties:
        type:
          $ref: '#/components/schemas/IndividualDocumentType'
        file_type:
          $ref: '#/components/schemas/FileType'
        file_content:
          type: string
          format: byte
          description: Base64-encoded file content. Maximum size after decoding is 10MB.
          example: JVBERi0xLjQKJeLjz9MKMw==
        id_number:
          type: string
          description: REQUIRED for identity documents (passport, driver's license, residence permit). The ID number on the document (e.g., passport number, driver's license number). Not required for EDD documents like bank statements.
          example: AB1234567
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the issuing country. Required for identity documents, not required for EDD documents.
          minLength: 2
          maxLength: 2
          example: US
        filename:
          type: string
          maxLength: 100
          description: Optional original filename. Will be sanitized for safe storage and display.
          example: passport_front.jpg
        valid_until:
          type: string
          format: date
          description: Optional expiration date of the identity document in YYYY-MM-DD format
          example: '2027-04-20'
    DocumentUploadResponse:
      type: object
      description: Response after successfully uploading a document
      required:
        - document_id
      properties:
        document_id:
          $ref: '#/components/schemas/KSUID'
    IndividualDocumentUploadUrlRequest:
      type: object
      description: Request to generate a presigned URL for uploading an individual document (identity or EDD). For identity documents (passport, drivers_license_front, drivers_license_back, residence_permit_front, residence_permit_back), id_number is required.
      required:
        - document_type
        - file_type
        - country
      properties:
        document_type:
          $ref: '#/components/schemas/IndividualDocumentType'
        id_number:
          type: string
          description: REQUIRED for identity documents (passport, driver's license, residence permit). The ID number on the document (e.g., passport number, driver's license number). Not required for EDD documents like bank statements.
          example: AB1234567
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the issuing country. Required for identity documents, not required for EDD documents.
          minLength: 2
          maxLength: 2
          example: US
        file_type:
          $ref: '#/components/schemas/FileType'
        filename:
          type: string
          maxLength: 100
          description: Optional original filename. Will be sanitized for safe storage and display.
          example: passport_front.jpg
    DocumentUploadUrlResponse:
      type: object
      description: Response containing a presigned URL for document upload
      required:
        - upload_url
        - upload_id
        - object_path
        - expires_at
      properties:
        upload_url:
          type: string
          format: uri
          description: Presigned URL to upload the document to. Use PUT method with the file content.
          example: https://storage.googleapis.com/bucket/path?...
        upload_id:
          type: string
          description: Unique identifier for this upload. Use this when calling the verify endpoint.
          example: 2hCjxJzUAW6JVRkZqaF9E0KpM3a
        object_path:
          type: string
          description: The GCS object path where the document will be stored. Pass this to the verify endpoint.
          example: applications/business/2hCjxJzUAW6JVRkZqaF9E0KpM3a/business-documents/2hDeFgHiJkLmNoPqRsTuVwXyZ
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the presigned URL expires
          example: '2025-01-15T18:30:00Z'
    IndividualDocumentType:
      type: string
      description: Type of document that can be uploaded for individuals (identity documents + EDD documents)
      enum:
        - passport
        - drivers_license_front
        - drivers_license_back
        - residence_permit_front
        - residence_permit_back
        - proof_of_address
        - bank_statement
        - utility_bill
        - source_of_wealth
        - payslip
        - employment_contract
        - income_verification_letter
        - savings_statement
        - crypto_statement
        - investment_statement
      example: passport
    UploadedDocumentMetadata:
      type: object
      description: Metadata about a document
      required:
        - id
        - category
        - document_type
        - file_type
        - status
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
          description: Unique document identifier
        category:
          type: string
          enum:
            - business
            - identity
            - edd
          description: Category of document
        document_type:
          type: string
          description: Specific type of document (e.g., certificate_of_incorporation, passport)
          example: certificate_of_incorporation
        file_type:
          type: string
          description: File type (pdf, jpeg, png)
          example: pdf
        status:
          type: string
          enum:
            - pending_verification
            - uploaded
          description: Upload status of the document
          example: uploaded
        original_filename:
          type: string
          description: Original filename if provided
          example: certificate.pdf
        individual_id:
          type: string
          description: Individual ID (only for identity documents)
          example: 2hCjxJzUAW6JVRkZqaF9E0KpM3a
        individual_first_name:
          type: string
          description: Individual's first name (only for identity documents)
          example: John
        individual_last_name:
          type: string
          description: Individual's last name (only for identity documents)
          example: Doe
        created_at:
          type: string
          format: date-time
          description: When the document was uploaded
          example: '2025-01-15T10:30:00Z'
    UploadedDocument:
      type: object
      description: Simplified document information for application entities
      required:
        - document_id
        - document_type
        - status
        - uploaded_at
      properties:
        document_id:
          type: string
          format: ksuid
          description: Unique document identifier
          example: 2hCjxJzUAW6JVRkZqaF9E0KpM3a
        document_type:
          type: string
          description: Type of document
          enum:
            - articles_of_incorporation
            - certificate_of_good_standing
            - corporate_registry_extract
            - shareholder_registry
            - source_of_funds
            - bank_reference_letter
            - operating_agreement
            - certificate_of_incorporation
            - passport
            - drivers_license_front
            - drivers_license_back
            - residence_permit_front
            - residence_permit_back
            - source_of_wealth
            - bank_statement
            - regulatory_license
            - aml_audit_report
          example: passport
        status:
          type: string
          description: Upload/verification status
          enum:
            - uploaded
            - pending_verification
            - verified
            - rejected
          example: uploaded
        uploaded_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the EDD record was created
          example: '2025-01-15T10:30:00Z'
    MissingDocument:
      type: object
      description: Information about a missing document the applicant has not yet uploaded. Includes both required documents (whose absence blocks readiness) and optional ones (e.g. Proof of Address for individuals when the PoA-optional flow is enabled — surfaced so the UI can render an upload affordance without gating submission).
      required:
        - purpose
        - accepted_types
        - description
      properties:
        purpose:
          type: string
          description: The purpose this document serves in the onboarding requirements
          enum:
            - business_formation
            - business_bylaws
            - business_proof_of_address
            - business_source_of_funds
            - business_nature_of_business
            - business_shareholder_registry
            - individual_identity
            - individual_proof_of_address
            - individual_source_of_wealth
            - edd_regulatory_license
            - edd_financial_docs
            - edd_aml_audit
          example: business_formation
        accepted_types:
          type: array
          description: Document type identifiers that can satisfy this requirement. Single-option requirements have one element, multi-option requirements have multiple.
          items:
            type: string
            enum:
              - articles_of_incorporation
              - certificate_of_good_standing
              - corporate_registry_extract
              - shareholder_registry
              - source_of_funds
              - bank_reference_letter
              - operating_agreement
              - certificate_of_incorporation
              - proof_of_address
              - utility_bill
              - pitch_deck
              - marketing_material
              - business_plan
              - memorandum
              - articles_of_association
              - crypto_statement
              - investment_statement
              - subscription_agreement
              - safe_agreement
              - convertible_note
              - loan_agreement
              - promissory_note
              - passport
              - drivers_license_front
              - drivers_license_back
              - residence_permit_front
              - residence_permit_back
              - source_of_wealth
              - bank_statement
              - regulatory_license
              - aml_audit_report
              - payslip
              - employment_contract
              - shareholders_agreement
              - income_verification_letter
              - savings_statement
          example:
            - articles_of_incorporation
        description:
          type: string
          description: Human-readable description of the document requirement
          example: Articles of Incorporation or equivalent formation document
        required:
          type: boolean
          description: Whether this document must be uploaded for the application to be ready for review. When false, the document is optional — typically because an alternative gating mechanism applies (e.g. the post-onboarding $3,000 / 7-day rolling-window threshold for Proof of Address on individual applications under the PoA-optional flow).
          example: true
    DocumentInfo:
      type: object
      description: Document status information for an applicant entity
      required:
        - uploaded_documents
        - missing_documents
      properties:
        uploaded_documents:
          type: array
          description: List of documents that have been uploaded for this entity
          items:
            $ref: '#/components/schemas/UploadedDocument'
        missing_documents:
          type: array
          description: List of required documents that haven't been uploaded yet
          items:
            $ref: '#/components/schemas/MissingDocument'
    ApplicationEntity:
      type: object
      description: An entity (business or individual) associated with an application, including document status
      required:
        - applicant_type
        - applicant_id
        - document_info
        - ready
      properties:
        applicant_type:
          type: string
          description: Type of applicant
          enum:
            - business
            - individual
          example: individual
        applicant_id:
          type: string
          format: ksuid
          description: ID of the business or individual
          example: 2hCjxJzUAW6JVRkZqaF9E0KpM3a
        legal_name:
          type: string
          description: Legal name (present when applicant_type = business)
          example: Acme Corporation
        first_name:
          type: string
          description: First name (present when applicant_type = individual)
          example: John
        last_name:
          type: string
          description: Last name (present when applicant_type = individual)
          example: Doe
        ready:
          type: boolean
          description: Whether this applicant has met all document requirements
          example: true
        document_info:
          $ref: '#/components/schemas/DocumentInfo'
    EDDInfo:
      type: object
      description: Enhanced Due Diligence information for business applications
      required:
        - required
        - ready
        - document_info
      properties:
        required:
          type: boolean
          description: Whether EDD is required for this application
          example: true
        edd_id:
          type: string
          description: EDD record ID (null if EDD information not yet provided)
          nullable: true
          example: 2KPQgUCj09jSdGSdYMqaS3Z3C8r
        ready:
          type: boolean
          description: Whether EDD is complete (both form fields and documents)
          example: false
        document_info:
          $ref: '#/components/schemas/DocumentInfo'
    RiskRating:
      type: object
      description: Risk rating assessment for an application
      required:
        - score
        - num_factors
        - percentage
        - level
        - factors
        - edd_required
        - prohibited
        - version
        - calculated_at
        - data_version
        - config
      properties:
        score:
          type: integer
          description: Sum of all factor values
          example: 7
        num_factors:
          type: integer
          description: Number of factors evaluated
          example: 4
        percentage:
          type: number
          format: double
          description: Risk percentage (0-100)
          example: 62.5
        level:
          type: string
          description: Risk level classification
          enum:
            - low
            - medium
            - high
          example: high
        factors:
          type: array
          description: Detailed breakdown of risk factors
          items:
            type: object
            required:
              - name
              - value
              - level
              - input
              - description
              - reason
              - prohibited
            properties:
              name:
                type: string
                description: Factor name (e.g., 'country_risk', 'industry_risk')
                example: country_risk
              value:
                type: integer
                description: Risk factor value (1=low, 2=medium, 3=high)
                enum:
                  - 1
                  - 2
                  - 3
                example: 3
              level:
                type: string
                description: Risk level for this factor
                enum:
                  - low
                  - medium
                  - high
                example: high
              input:
                type: string
                description: Actual input value (country code, NAICS, etc.)
                example: US
              description:
                type: string
                description: Human-readable description of the factor
                example: Country risk based on incorporation country
              reason:
                type: string
                description: Explanation for this risk level
                example: United States is a low-risk jurisdiction
              prohibited:
                type: boolean
                description: Whether this factor value is prohibited
                example: false
        edd_required:
          type: boolean
          description: Whether Enhanced Due Diligence is required (true if level is high)
          example: true
        prohibited:
          type: boolean
          description: Whether this entity is prohibited from onboarding (true if any factor is prohibited)
          example: false
        prohibited_reason:
          type: string
          description: Reason for prohibition if prohibited is true
          example: Sanctioned country
        version:
          type: string
          description: Risk rating calculation version
          example: v1
        data_version:
          type: string
          description: Risk data version (which CSV files were used)
          example: '2026-01-07'
        config:
          $ref: '#/components/schemas/RiskConfig'
        calculated_at:
          type: string
          format: date-time
          description: When the risk rating was calculated
          example: '2024-01-15T10:30:00Z'
    RiskConfig:
      type: object
      description: Configuration parameters used during risk calculation
      required:
        - threshold_low
        - threshold_high
      properties:
        threshold_low:
          type: number
          format: double
          description: Low to medium risk threshold percentage
          example: 25
        threshold_high:
          type: number
          format: double
          description: Medium to high risk threshold percentage
          example: 50
    BusinessEntity:
      type: object
      description: Business entity data (entity information only, no validation)
      required:
        - id
        - legal_name
        - country_of_incorporation
        - date_of_incorporation
        - legal_structure
        - registration_number
        - registered_address
        - industry_code
        - business_description
        - purpose_of_account
        - average_monthly_revenue
        - expected_monthly_deposit
        - expected_monthly_transaction_volume
        - source_of_funds
      properties:
        id:
          type: string
          format: ksuid
          description: Business applicant identifier (this is the applicant_id, NOT the internal business entity ID)
          example: 2hCjxJzUAW6JVRkZqaF9E0KpM3a
        legal_name:
          type: string
          description: Legal name of the business entity
          example: Acme Corporation
        country_of_incorporation:
          type: string
          description: ISO 3166-1 alpha-2 country code where the business is incorporated
          minLength: 2
          maxLength: 2
          example: US
        date_of_incorporation:
          type: string
          format: date
          description: Date when the business was incorporated
          example: '2020-01-15'
        legal_structure:
          type: string
          description: Legal entity type of the business
          enum:
            - corporation
            - llc
            - general_partnership
            - llp
            - non_profit_foundation
            - trust
            - government_entity
            - sole_proprietorship
          example: llc
        registration_number:
          type: string
          description: Business registration number
          example: '123456789'
        tax_id_number:
          type: string
          description: Tax identification number (optional, required for US entities)
          example: 12-3456789
        dba:
          type: string
          description: Doing Business As name (optional)
          example: Acme Inc
        registered_address:
          $ref: '#/components/schemas/Address'
          description: Registered business address
        operating_address:
          $ref: '#/components/schemas/Address'
          description: Operating business address (optional, if different from registered)
        industry_code:
          type: string
          description: Industry classification code (NAICS or crypto code)
          example: '541511'
        business_description:
          type: string
          description: Detailed description of business activities
          example: Software development and technology consulting services
        purpose_of_account:
          type: array
          description: Intended purposes for the account
          items:
            type: string
          example:
            - first_party_payments
            - business_expenses
        average_monthly_revenue:
          type: string
          description: Expected average monthly revenue range
          example: 1_to_10m
        expected_monthly_deposit:
          type: string
          description: Expected monthly deposit range
          example: 100k_to_500k
        expected_monthly_transaction_volume:
          type: string
          description: Expected monthly transaction volume range
          example: 0_to_10
        source_of_funds:
          type: array
          description: Sources of funds for the business
          items:
            type: string
          example:
            - proprietary_funds
            - customer_funds
        has_bearer_shares:
          type: boolean
          description: Whether the company issues bearer shares
          example: false
        transact_on_behalf_of_third_parties:
          type: boolean
          description: Whether the business will transact (trading or transmitting funds) on behalf of third parties. Triggers EDD requirement if true.
          example: false
        owned_by_foundation:
          type: boolean
          description: Whether the business is owned by a foundation
          example: false
        website:
          type: string
          format: uri
          description: Business website URL (optional)
          example: https://www.acme.com
        business_email:
          type: string
          format: email
          description: Primary business contact email address (optional)
          example: contact@acmecorp.com
        decision:
          type: string
          enum:
            - approved
            - declined
            - auto_declined
            - withdrawn
          nullable: true
          description: Decision on this business entity (if made)
          example: approved
        decision_reason:
          type: string
          nullable: true
          description: Reason for the decision
          example: All verification checks passed
        decision_by:
          type: string
          nullable: true
          description: Email of admin who made the decision
          example: admin@dakota.xyz
        decision_at:
          type: integer
          format: int64
          nullable: true
          description: Unix timestamp when decision was made
          example: 1705315800
        sumsub_verification:
          $ref: '#/components/schemas/SumsubReviewData'
          description: Sumsub verification data for this business entity
    IndividualEntity:
