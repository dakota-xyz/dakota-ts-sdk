    Application:
      type: object
      description: Application response with separated entity data and validation state
      required:
        - application_id
        - application_type
        - application_status
        - application_created_at
        - application_updated_at
      properties:
        application_id:
          type: string
          format: ksuid
          description: Unique application identifier
          example: 2hCjxJzUAW6JVRkZqaF9E0KpM3a
        application_type:
          type: string
          description: Type of application
          enum:
            - business
            - individual
          example: business
        application_status:
          $ref: '#/components/schemas/ApplicationStatus'
          description: Current status of the application
        application_created_at:
          type: string
          format: date-time
          description: When the application was created
          example: '2024-01-15T10:30:00Z'
        application_updated_at:
          type: string
          format: date-time
          description: When the application was last updated
          example: '2024-01-16T14:45:00Z'
        application_submitted_at:
          type: string
          format: date-time
          nullable: true
          description: When the application was submitted (null if not yet submitted)
          example: '2024-01-17T16:00:00Z'
        rfi_requested_items:
          $ref: '#/components/schemas/RFIRequestedItems'
        rfi_resubmitted:
          type: boolean
          description: Whether the applicant has already submitted in response to the latest scoped RFI (drives the resubmit page's "already submitted" state).
        application_decision:
          type: string
          enum:
            - approved
            - declined
            - withdrawn
          nullable: true
          description: 'Decision outcome for the application (only present after decision is made). Note: auto_declined is mapped to declined in the API response.'
          example: approved
        decision_method:
          type: string
          enum:
            - manual
            - auto
            - override
          nullable: true
          description: 'How the decision was reached: ''manual'' for operator-driven decisions, ''auto'' for automated approvals, ''override'' reserved for future escalation. Null if no decision has been made.'
          example: manual
        decision_rule_version:
          type: string
          nullable: true
          description: Version identifier of the rule set that produced an automated decision. Null for manual decisions or when no decision has been made.
          example: v1.2
        entities:
          $ref: '#/components/schemas/ApplicationEntities'
          description: The people/businesses being onboarded
        edd:
          $ref: '#/components/schemas/EDDResponse'
          description: Enhanced Due Diligence data (if provided)
        attestations:
          $ref: '#/components/schemas/AttestationData'
          description: Attestations submitted for this application
        validation:
          $ref: '#/components/schemas/ApplicationValidation'
          description: Validation state computed at retrieval time
        risk_rating:
          $ref: '#/components/schemas/RiskRating'
          description: Risk rating. Present for users with compliance review-data access (compliance, compliance_admin, superadmin).
        poa_status:
          type: string
          enum:
            - missing
            - submitted_pending_review
            - approved
            - rejected
          description: |
            Tracks the review state of the Proof of Address for individual applications.
            Only present for compliance reviewers; absent for business applications,
            for non-primary-individual rows, and on the token-authenticated hosted
            onboarding flow.

            - `missing` — No Proof of Address has been submitted. The individual is subject
              to the $3,000 USD-equivalent rolling 7-day transaction limit.
            - `submitted_pending_review` — A PoA-equivalent document (proof_of_address,
              bank_statement, or utility_bill) has been uploaded and is awaiting compliance
              review. The individual remains subject to the transaction limit until the review
              concludes.
            - `approved` — The Proof of Address has been reviewed and approved. The individual
              is exempt from the $3,000 / 7-day rolling transaction threshold.
            - `rejected` — The submitted Proof of Address was rejected. The individual
              remains subject to the transaction limit and may re-upload a new document.
          example: missing
        is_frozen:
          type: boolean
          description: |
            Whether the customer's KYB is currently frozen (transactions held pending
            proof-of-address review). The authoritative source for the reviewer freeze
            badge. Present (true/false) only for individual applications; absent for
            business applications.
          example: true
        frozen_at:
          type: string
          format: date-time
          description: |
            When the customer entered the current frozen state, from the KYB
            status-change log. Drives the days-frozen counter accurately (unlike
            application_updated_at, which unrelated edits bump). Absent when the customer
            is not currently frozen, when the freeze predates the status-change log, or
            for callers without compliance review access.
          example: '2024-01-16T14:45:00Z'
        poa_on_file:
          type: boolean
          description: |
            Whether the customer has an approved Proof of Address on file (and is
            therefore exempt from the transaction-volume limit). Present only for
            individual applications; absent for business applications.
          example: false
        assignee:
          $ref: '#/components/schemas/ComplianceReviewer'
          description: The compliance reviewer this application is assigned to (its owner). Absent when unassigned.
        assigned_at:
          type: integer
          format: int64
          nullable: true
          description: Epoch seconds when the application was assigned to its current owner. Absent/null when unassigned.
          example: 1717423200
        outstanding_partner_attestations:
          type: array
          description: |
            Outstanding partner disclosure attestations the customer must accept
            to unlock a partner-gated capability (e.g. international wires), surfaced
            so the hosted onboarding flow can present them in the same attestations
            UI used for first-party attestations. Partner-agnostic: each item is keyed
            by an opaque terms key + version, never a partner identifier. Only present
            (and only computed) for an already-decided (approved) application that has
            outstanding partner onboarding — this is the re-engagement surface for an
            existing customer who lands on the hosted flow via their application_url.
            Empty/absent when nothing is outstanding or the partner declaration is
            unavailable. Accept each by POSTing to /applications/{id}/attestations with
            disclosure_id = key and disclosure_version = version.
          items:
            $ref: '#/components/schemas/PartnerAttestationRequirement'
    PartnerAttestationRequirement:
      type: object
      description: |
        A single outstanding partner disclosure the customer must accept online,
        keyed by an opaque terms key + version — never a partner identifier. Rendered
        in the hosted attestations UI; accepted via POST /applications/{id}/attestations
        with disclosure_id = key and disclosure_version = version.
      required:
        - disclosure_id
        - disclosure_version
        - title
      properties:
        disclosure_id:
          type: string
          description: The partner disclosure terms key to accept (the opaque join key the provider declared, e.g. partner_disclosures). Never a partner name.
          example: partner_disclosures
        disclosure_version:
          type: string
          description: The version of the disclosure being accepted. Pass back verbatim as disclosure_version.
          example: 2026-06
        title:
          type: string
          description: Human-readable label for the disclosure to show the customer.
          example: Partner Disclosures
        url:
          type: string
          description: |
            Optional. Where the disclosure content / acceptance lives — the token-gated
            hosted onboarding URL for this application (a real redirect target). Absent
            when no usable link is resolvable.
          example: https://apply.dakota.xyz/applications/2hCjxJzUAW6JVRkZqaF9E0KpM3a/attestations
