  /auto-transactions:
    get:
      tags:
        - Auto Transactions
      summary: List transactions that were created automatically by auto accounts
      description: Returns a paginated list of transactions generated by auto-account rules with support for account, destination, status, provider, and network filters.
      operationId: listAutoTransactions
      parameters:
        - $ref: '#/components/parameters/StartingAfterParam'
        - $ref: '#/components/parameters/EndingBeforeParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: auto_account_id
          in: query
          description: Filter transactions by auto account ID
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: destination_id
          in: query
          description: Filter transactions by destination ID
          required: false
          schema:
            $ref: '#/components/schemas/KSUID'
        - name: status
          in: query
          description: Filter transactions by status
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: type
          in: query
          description: Filter transactions by type
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: provider_id
          in: query
          description: Filter transactions by provider ID
          required: false
          schema:
            type: string
        - name: source_crypto_address
          in: query
          description: Filter transactions by source address
          required: false
          schema:
            type: string
        - name: destination_crypto_address
          in: query
          description: Filter transactions by destination address
          required: false
          schema:
            type: string
        - name: source_network_id
          in: query
          description: Filter transactions by source network
          required: false
          schema:
            type: string
        - name: destination_network_id
          in: query
          description: Filter transactions by destination network
          required: false
          schema:
            type: string
        - name: transaction_hash
          in: query
          description: Filter transactions by blockchain transaction hash
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          description: Filter transactions created on or after this date (Epoch timestamp in seconds)
          required: false
          schema:
            type: integer
        - name: end_date
          in: query
          description: Filter transactions created on or before this date (Epoch timestamp in seconds)
          required: false
          schema:
            type: integer
        - name: input_asset
          in: query
          description: Filter transactions by input asset symbol
          required: false
          schema:
            type: string
        - name: destination_asset
          in: query
          description: Filter transactions by destination asset symbol
          required: false
          schema:
            type: string
        - name: statuses
          in: query
          description: Filter transactions by one or more statuses. Comma-separated list (e.g. `pending,processing`).
          required: false
          schema:
            type: string
        - name: types
          in: query
          description: Filter transactions by one or more types. Comma-separated list (e.g. `onramp,offramp`).
          required: false
          schema:
            type: string
        - name: outgoing_amount_min
          in: query
          description: Filter transactions where outgoing_amount is greater than or equal to this value.
          required: false
          schema:
            type: string
        - name: outgoing_amount_max
          in: query
          description: Filter transactions where outgoing_amount is less than or equal to this value.
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: Field to sort transactions by. Currently only `created_at` is supported. Defaults to `created_at`.
          required: false
          schema:
            type: string
            enum:
              - created_at
        - name: sort_dir
          in: query
          description: Sort direction. Defaults to `desc`.
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: A paginated list of auto account transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAutoTransactionResponse'
              example:
                data:
