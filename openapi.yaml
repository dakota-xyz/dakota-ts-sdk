        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
        inputAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: The amount of money input into the transaction.
        subtotalAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: TODO @Marc what does this mean specifically?
        convertedAmount:
          $ref: '#/components/schemas/TransactionAmount'
          description: TODO @Marc what does this mean specifically?
        outputAmount:
