    ClientUserRole:
      type: string
      description: 'Role that can be assigned to a client user. Available roles: `admin` (full access except issuances) and `viewer` (read-only access).'
      enum:
        - admin
        - viewer
      example: admin
    ClientPricingConfig:
      type: object
      required:
        - monthlyMinimumCents
        - transferFeeBps
        - achFeeCents
        - wireFeeCents
        - sepaFeeCents
        - swiftFeeCents
        - kycFeeCents
        - kybFeeCents
        - effectiveFrom
        - createdAt
        - updatedAt
        - transferFeeOverrides
      properties:
        monthlyMinimumCents:
          type: integer
          minimum: 0
          description: Monthly minimum fee in cents
          example: 10000
        transferFeeBps:
          type: number
          minimum: 0
          maximum: 10000
          description: Transfer fee in basis points (0-10000, representing 0% to 100%)
          example: 25
        achFeeCents:
          type: integer
          minimum: 0
          description: Per-ACH transaction fee in cents
          example: 100
        wireFeeCents:
          type: integer
          minimum: 0
          description: Per-wire transaction fee in cents
          example: 2500
        sepaFeeCents:
          type: integer
          minimum: 0
          description: Per-SEPA transaction fee in cents
          example: 150
        swiftFeeCents:
          type: integer
          minimum: 0
          description: Per-Swift-transfer banking fee in USD cents.
          example: 4000
        fednowFeeCents:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Per-FedNow transaction fee in USD cents. Null when unset, in which
            case the client's ACH fee applies.
          example: 100
        kycFeeCents:
          type: integer
          minimum: 0
          description: Per-individual-application-submission compliance fee in USD cents.
          example: 500
        kybFeeCents:
          type: integer
          minimum: 0
          description: Per-business-application-submission compliance fee in USD cents.
          example: 2500
        effectiveFrom:
          type: string
          format: date-time
          description: When this pricing takes effect
          example: '2024-01-01T00:00:00Z'
        createdAt:
          type: string
          format: date-time
          description: When this pricing configuration was created
          example: '2024-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: When this pricing configuration was last updated
          example: '2024-01-01T00:00:00Z'
        transferFeeOverrides:
          type: array
          description: |
            Per-asset-pair transfer fee exceptions. Always present; empty
            when the client has none, in which case transferFeeBps applies
            to every pair.
          items:
            $ref: '#/components/schemas/TransferFeeOverride'
    TransferFeeOverride:
      type: object
      description: |
        Overrides transferFeeBps for exactly one (sourceAsset,
        destinationAsset) pair. Assets are network-agnostic symbols: USDC on
        any chain is the same key.
      required:
        - sourceAsset
        - destinationAsset
        - feeBps
      properties:
        sourceAsset:
          type: string
          description: Asset symbol the transfer moves from, network-agnostic.
          example: USDT
        destinationAsset:
          type: string
          description: Asset symbol the transfer moves to, network-agnostic.
          example: RD
        feeBps:
          type: number
          format: float
          minimum: 0
          maximum: 10000
          description: Transfer fee in basis points for this pair. Whole numbers only.
          example: 5
    CreateClientUserRequest:
      type: object
      description: Request body for creating a new client user
      required:
        - first_name
        - last_name
        - email
        - role
      properties:
        first_name:
          type: string
          description: Given name of the user
          example: John
          minLength: 1
        last_name:
          type: string
          description: Surname of the user
          example: Doe
          minLength: 1
        email:
          type: string
          format: email
          description: Email address of the user
          example: john@example.com
        role:
          $ref: '#/components/schemas/ClientUserRole'
    UpdateClientUserRequest:
      type: object
      description: Request body for updating a client user
      properties:
        first_name:
          type: string
          description: Given name of the user
          example: John
          minLength: 1
        last_name:
          type: string
          description: Surname of the user
          example: Doe
          minLength: 1
        role:
          $ref: '#/components/schemas/ClientUserRole'
    PaginatedListResponse:
      type: object
      description: Wrapper for paginated list responses
      required:
        - data
        - meta
      properties:
        data:
          type: array
          description: List of objects returned by the API
          items:
            type: object
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      description: Meta information about the response
      required:
        - total_count
        - has_more_after
        - has_more_before
      properties:
        total_count:
          type: integer
          description: Total number of items available
          example: 100
        has_more_after:
          type: boolean
          description: Indicates whether there are more items that follow this set.
          example: true
        has_more_before:
          type: boolean
          description: Indicates whether there are more items that precede this set.
          example: false
    RFIRequestedItems:
      type: object
      description: Reviewer-selected resubmission scope for an RFI.
      properties:
        business_description:
          type: boolean
          description: Whether the applicant may edit the business description on the resubmit page.
        documents:
          type: array
          items:
            type: object
            required:
              - category
              - ref
            properties:
              category:
                type: string
                enum:
                  - business
                  - individual
                  - edd
              individual_id:
                type: string
                description: Entity id for individual docs; empty for business/edd.
              ref:
                type: string
                description: document_id|document_type for an on-file doc, or purpose for a missing doc.
        questions:
          type: array
          description: |
            Free-text compliance questions the reviewer is asking. Rendered on
            the resubmit page as required answer fields, tracked separately from
            the standard application questions.
          items:
            type: object
            required:
              - prompt
            properties:
              key:
                type: string
                description: Stable identifier for this question; generated if omitted. Used to store the applicant's answer.
              prompt:
                type: string
                description: The free-text question the reviewer is asking the applicant.
              require_document:
                type: boolean
                description: Whether the applicant must also attach a document when answering this question.
    TransactionListMeta:
      description: Meta information about a transaction list response. Extends the shared pagination meta with the transaction resource family the request resolved to, so an empty page is self-explaining.
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required:
            - transaction_type
          properties:
            transaction_type:
              allOf:
                - $ref: '#/components/schemas/TransactionResourceType'
              description: The transaction resource family this response lists. Either the `transaction_type` that was requested, or the family inferred from the other query parameters. `total_count` counts only this family.
    PersonaImportJobSummary:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          description: running, paused, cancelled, or completed
        total:
          type: integer
        created_at:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
    PersonaImportRowResult:
      type: object
      properties:
        index:
          type: integer
        token:
          type: string
          description: Redacted share token (suffix only)
        state:
          type: string
          description: queued, inquiry_created, redeem_requested, redeemed, finalizing (in flight); succeeded, failed, expired, stuck, cancelled (terminal)
        customer_id:
          type: string
        application_id:
          type: string
        error_code:
          type: string
          description: Stable machine-readable failure code
        error:
          type: string
          description: Human-readable, actionable failure reason
        token_expires_at:
          type: integer
          format: int64
    LegalDocument:
      type: object
      title: Legal Document
      description: |-
        One published revision of a legal document.

        A revision is IMMUTABLE: `version` identifies an exact text, and that
        text never changes once published. Correcting a document produces a new
        revision rather than editing an existing one, so an acceptance recorded
        against a version always refers to the same words.
      required:
        - key
        - version
        - revision
        - content_type
      properties:
        key:
          type: string
          description: Stable identifier for the document across all its revisions.
          example: dakota_tos
        version:
          type: string
          description: |-
            The published revision identifier, taken from the document itself.
            Treat it as opaque — do not parse or compare it for ordering.
          example: '2026-07-23'
        revision:
          type: integer
          description: |-
            Monotonic ordinal within `key`. Unlike `version`, this is ordered:
            a higher number is a later revision.
          example: 4
        title:
          type: string
          example: Dakota Terms of Service
        content:
          type: string
          description: |-
            The document text, in `content_type` format. Render this to your
            customer before capturing acceptance.

            Present when a single document is fetched by key. OMITTED from the
            `GET /legal/documents` index, which carries identity and revision
            only — fetch the document you intend to display.
          example: This Platform Services Agreement (the "Agreement")…
        content_type:
          type: string
          description: Media type of `content`.
          default: text/markdown
          example: text/markdown
        content_url:
          type: string
          description: Where the document is published for humans to read.
          example: https://dakota.xyz/terms
        effective_date:
          type: string
          description: |-
            The date printed inside the document — what the customer reads as
            "Last Updated". Show this alongside the text.

            Absent for imported historical revisions whose stated date could not
            be established.
          example: '2026-07-23'
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      description: |
        Error response following RFC 9457 Problem Details.
        Public API error responses use this format.
      example:
        type: https://docs.dakota.xyz/api-reference/errors#not-found
        title: Customer Not Found
        status: 404
        detail: Customer cst_2abc123 was not found in your organization.
        instance: https://api.platform.dakota.xyz/customers/cst_2abc123
        request_id: req_7f3a8b2c
      properties:
        type:
          type: string
          format: uri
          description: |
            URI reference identifying the problem type.
            Resolves to human-readable documentation.
          example: https://docs.dakota.xyz/api-reference/errors#not-found
        title:
          type: string
          description: Short, human-readable summary of the problem type. Stable across occurrences.
          example: Customer Not Found
        status:
          type: integer
          description: HTTP status code for this occurrence.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: Customer cst_2abc123 was not found in your organization.
        instance:
          type: string
          format: uri
          description: The request path that triggered this error.
          example: https://api.platform.dakota.xyz/customers/cst_2abc123
        request_id:
          type: string
          description: Unique request identifier. Include when contacting support.
          example: req_7f3a8b2c
        errors:
          type: array
          description: Field-level validation errors (present for validation failures).
          items:
            $ref: '#/components/schemas/ValidationError'
        resolution_url:
          type: string
          format: uri
          description: |
            A link the customer can follow to CLEAR this error, present only on
            problems with a concrete self-service remedy.

            Today this is returned by
            `#terms-not-accepted`, where it points at the hosted flow in which
            the outstanding agreement can be signed. The link is token-gated and
            usable as-is — send the customer to it directly rather than parsing
            it out of `detail`.
          example: https://onboarding.dakota.xyz/applications/2abc123?token=tok_7f3a8b2c
        user_message:
          type: string
          description: |
            A plain-language rendition of `detail` written for the end
            customer, present when one exists for this error. `detail` names
            request fields and actions so a machine caller (such as a payment
            agent drafting proposals) can self-correct; `user_message` says the
            same thing without API vocabulary. Clients that relay errors into a
            human surface (chat, email, UI) should show `user_message` when
            present and fall back to `detail`.
          example: ACH payments pay out USD, so a USDC payout isn't possible on this rail. Change the payout currency to USD and try again.
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Field path using dot notation for nested fields.
          example: bank_account.routing_number
        message:
          type: string
          description: Human-readable description of the field error.
          example: Routing number must be exactly 9 digits
        code:
          type: string
          description: Machine-readable error code for this field.
          example: invalid_format
    EventType:
      type: string
      description: Canonical outbound event type identifier.
      enum:
        - user.created
        - user.updated
        - user.deleted
        - api_key.created
        - api_key.deleted
        - customer.created
        - customer.updated
        - customer.kyb_link.created
        - customer.kyb_link.updated
        - customer.kyb_status.created
        - customer.kyb_status.updated
        - customer.kyb_application.submitted
        - customer.capability_status.updated
        - auto_account.created
        - auto_account.updated
        - auto_account.deleted
        - transaction.auto.created
        - transaction.auto.updated
        - transaction.one_off.created
        - transaction.one_off.updated
        - recipient.created
        - recipient.updated
        - recipient.deleted
        - destination.created
        - destination.deleted
        - target.created
        - target.updated
        - target.deleted
        - exception.created
        - exception.cleared
        - bvnk.onboarding.created
        - bvnk.onboarding.updated
        - wallet.created
        - wallet.updated
        - wallet.signer_group.created
        - wallet.signer_group.updated
        - wallet.policy.created
        - wallet.policy.updated
        - wallet.transaction.created
        - wallet.transaction.updated
        - wallet.deposit
        - fee_payout_destination.updated
        - fee_payout_destination.deleted
        - scheduled_payment.failed
      example: transaction.auto.updated
    EventRequest:
      type: object
      description: Request metadata for the original operation that emitted the event, when available.
      properties:
        id:
          type: string
          nullable: true
          description: Request identifier of the originating API call.
          example: req_01hzy6y7v8w9x0y1z2a3b4c5d6
        idempotency_key:
          type: string
          nullable: true
          description: Idempotency key used on the originating request, if provided.
          example: 8ad0a5e9-2e1c-49c4-a2ba-0f6fdd49a3a6
    EventData:
      type: object
      required:
        - object
      properties:
        object:
          type: object
          description: Event resource snapshot after provider-field sanitization. The shape varies by event type; see the `GET /events` example responses for representative payloads.
          additionalProperties: true
        previous_attributes:
          type: object
          description: Sparse set of attributes before an update, when available.
          additionalProperties: true
    Event:
      type: object
      description: Canonical event envelope used for outbound webhooks and event stream retrieval.
      required:
        - id
        - type
        - created
        - api_version
        - data
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        type:
          $ref: '#/components/schemas/EventType'
        created:
          type: integer
          description: Unix timestamp in seconds when the event was emitted.
          example: 1735689600
        api_version:
          type: string
          description: Version of the event envelope schema.
          example: 1.0.0
        request:
          $ref: '#/components/schemas/EventRequest'
        data:
          $ref: '#/components/schemas/EventData'
        metadata:
          type: object
          description: Optional event metadata with implementation-specific, non-provider fields.
          additionalProperties: true
    PaginatedEventResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Event'
    NetworkId:
      type: string
      description: Identifier for a blockchain network
      example: ethereum-mainnet
      enum:
        - ethereum-mainnet
        - ethereum-sepolia
        - ethereum-goerli
        - ethereum-holesky
        - solana-mainnet
        - solana-devnet
        - solana-testnet
        - base-mainnet
        - base-sepolia
        - arbitrum-mainnet
        - arbitrum-sepolia
        - optimism-mainnet
        - optimism-sepolia
        - polygon-mainnet
        - polygon-amoy
      minLength: 1
      maxLength: 30
    CreateApiKeyForClientRequest:
      type: object
      required:
        - client_id
      properties:
        client_id:
          allOf:
            - $ref: '#/components/schemas/KSUID'
          description: Client ID to create the API key for
    ApiKeyResponse:
      type: object
      required:
        - id
        - key
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        key:
          type: string
          description: The API key value (only shown once at creation)
          example: dk_live_4KLkSmzQbL6Xs8xnUjssdGHX7PfhHpAb
    ApiKeyListItem:
      type: object
      required:
        - id
        - user_id
        - key_suffix
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        user_id:
          $ref: '#/components/schemas/KSUID'
        key_suffix:
          type: string
          description: Last six characters of the API key
          example: HpAb4a
        created_at:
          type: integer
          description: Timestamp of when the API key was created
          example: 1234567890
    KSUID:
      type: string
      title: KSUID
      description: KSUID is a 27-character globally unique ID that combines a timestamp with a random component. Used for all entity identifiers in the Dakota platform.
      pattern: ^[0-9A-Za-z]{27}$
      minLength: 27
      maxLength: 27
      example: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
    CRI:
      type: object
      title: Crypto Resource Identifier
      description: 'A unique identifier for a specific account on a specific blockchain. When rendered as a string, it has the syntax: <network-id>://<canonical-address> (e.g., ethereum-mainnet://0x165cd37b4c644c2921454429e7f9358d18a45e14)'
      required:
        - network_id
        - crypto_address
      properties:
        network_id:
          $ref: '#/components/schemas/NetworkId'
        crypto_address:
          type: string
          description: The blockchain address (case-sensitive on some blockchains)
          example: '0x165cd37b4c644c2921454429e7f9358d18a45e14'
    Asset:
      type: string
      title: Asset
      description: ISO 4217 symbol representing a fiat asset.
      pattern: ^[A-Z]{3}$
      minLength: 3
      maxLength: 3
      example: USD
    Address:
      type: object
      title: Address
      description: Standardized physical address format used throughout the Dakota platform for user and entity addresses.
      required:
        - street1
        - city
        - country
      properties:
        street1:
          type: string
          description: Primary street address line
          example: 123 Main St
        street2:
          type: string
          description: Secondary address information such as apartment, suite, or unit number
          example: Apt 4B
        street3:
          type: string
          description: Additional address information like building name or floor
          example: Building C
        city:
          type: string
          description: City or locality name
          example: San Francisco
        region:
          type: string
          description: Full name of state, province, or region
          example: California
        postal_code:
          type: string
          description: Postal or ZIP code
          example: '94105'
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code (two-letter country code)
          example: US
          minLength: 2
          maxLength: 2
    FiatUSDestinationAddress:
      type: object
      title: Destination Address
      description: Address format for fiat destinations with Lead Bank wire transfer character limits (max 35 characters per address line).
      allOf:
        - $ref: '#/components/schemas/Address'
        - type: object
          properties:
            street1:
              type: string
              maxLength: 35
            street2:
              type: string
              maxLength: 35
            street3:
              type: string
              maxLength: 35
    Country:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
          minLength: 2
          maxLength: 2
          example: CA
        name:
          type: string
          example: Canada
    CustomerCreateRequest:
      type: object
      description: Request to create a customer and subsequently initiate a Know Your Business (KYB) verification process.
      properties:
        name:
          type: string
          description: Name of the customer - either a person's name or company name. Must contain at least one non-whitespace character.
          example: Acme Corporation
          minLength: 3
          maxLength: 100
          pattern: .*\S.*
        customer_type:
          type: string
          description: Type of entity being created - either an individual person or a company/organization.
          enum:
            - individual
            - business
          example: business
        external_id:
          type: string
          description: Unique identifier for the customer in the client's system. This ID is used to track the customer in the client's database.
          example: external_customer_123
        sub_client_id:
          $ref: '#/components/schemas/KSUID'
          description: ID of an existing sub-client to associate this new customer with. The referenced customer must belong to the same client and must itself be a sub-client. Cannot be combined with is_sub_client.
        is_sub_client:
          type: boolean
          description: When true, create this customer as a sub-client. A customer can only be designated a sub-client at creation time; a regular customer cannot be promoted to a sub-client afterwards. Cannot be combined with sub_client_id.
          default: false
      required:
        - name
        - customer_type
    CustomerCreateResponse:
      type: object
      description: Response returned when a customer creation process is successfully initiated.
      required:
        - id
        - kyb_links
        - application_id
        - application_url
        - application_expires_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        kyb_links:
          type: array
          description: KYB Links for different providers used in the KYB process.
          items:
            $ref: '#/components/schemas/KybLink'
        application_id:
          $ref: '#/components/schemas/KSUID'
          description: Unique identifier for the automatically created application record
        application_url:
          type: string
          format: uri
          description: Public URL for completing the application via web form (includes embedded token)
          example: https://apply.dakota.com/applications/2WGC9cKv9P4K8eGzqY6qJ3Xz7Qm?token=kJ8xN3zQ9mL2pR5vY7wC1aF4dG6hK0sT8uW3nB5eM9
        application_expires_at:
          type: integer
          format: int64
          description: Unix timestamp (nanoseconds) when the application token expires (90 days from creation)
          example: 1734567890000000000
    CustomerReEngagementResponse:
      type: object
      description: |
        Response returned when re-engaging an approved customer: a fresh
        application link (with a freshly minted onboarding token) for the
        customer's existing approved application.
      required:
        - application_id
        - application_url
        - application_expires_at
      example:
        application_id: 2WGC9cKv9P4K8eGzqY6qJ3Xz7Qm
        application_url: https://apply.dakota.com/applications/2WGC9cKv9P4K8eGzqY6qJ3Xz7Qm?token=kJ8xN3zQ9mL2pR5vY7wC1aF4dG6hK0sT8uW3nB5eM9
        application_expires_at: 1734567890000000000
      properties:
        application_id:
          $ref: '#/components/schemas/KSUID'
          description: Unique identifier of the customer's existing approved application
        application_url:
          type: string
          format: uri
          description: Public URL for re-engaging the customer via the web form (includes the freshly minted embedded token)
          example: https://apply.dakota.com/applications/2WGC9cKv9P4K8eGzqY6qJ3Xz7Qm?token=kJ8xN3zQ9mL2pR5vY7wC1aF4dG6hK0sT8uW3nB5eM9
        application_expires_at:
          type: integer
          format: int64
          description: Unix timestamp (nanoseconds) when the freshly minted token expires
          example: 1734567890000000000
    CustomerCapabilities:
      type: object
      description: A customer's capabilities and the outstanding requirements to unlock each. Partner-agnostic.
      required:
        - capabilities
      example:
        capabilities:
          - capability: international_wire
            status: action_required
            requirements:
              - type: terms_acceptance
                key: partner_disclosures
                version: 2026-06
                title: Accept the partner disclosures
                severity: required
                url: /applications/2WGC9cKv9P4K8eGzqY6qJ3Xz7Qm/attestations
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    Capability:
      type: object
      description: A rail/capability and what the customer must do to unlock it. Never exposes partner identities.
      required:
        - capability
        - status
        - requirements
      properties:
        capability:
          type: string
          description: The rail identifier, e.g. "international_wire". Never a partner name.
          example: international_wire
        status:
          type: string
          description: |
            available = usable now · enabling = "we're reviewing your data" ·
            action_required = satisfy required requirements · unavailable = not in rollout / not offered.
          enum:
            - available
            - enabling
            - action_required
            - unavailable
        requirements:
          type: array
          description: Only the OUTSTANDING (unsatisfied) requirements. Empty when nothing is outstanding.
          items:
            $ref: '#/components/schemas/CapabilityRequirement'
    CapabilityRequirement:
      type: object
      description: A single outstanding requirement, keyed by an opaque join key (terms id or document type) — never a partner.
      required:
        - type
        - key
        - title
        - severity
      properties:
        type:
          type: string
          enum:
            - terms_acceptance
            - document
        key:
          type: string
          description: Opaque join key — a terms id (for terms_acceptance) or a document type (for document). Never a partner identifier.
          example: partner_disclosures
        version:
          type: string
          description: Terms version (for terms_acceptance); omitted for documents.
          example: 2026-06
        title:
          type: string
          description: Human-readable label.
          example: Partner Disclosures
        url:
          type: string
          description: Where to accept / upload.
        severity:
          type: string
          description: required blocks unlock; requested pre-empts a partner RFI (non-blocking).
          enum:
            - required
            - requested
    CustomerStatus:
      type: string
      description: |
        The single client-facing customer status. One value collapses the
        frozen state, the application decision, and the application lifecycle,
        so the dashboard shows, filters, and counts by one status. See the
        `status` field on `Customer` for the derivation precedence.
      enum:
        - frozen
        - declined
        - withdrawn
        - approved
        - info_requested
        - submitted
        - pending
      example: info_requested
    CustomerStatusCounts:
      type: object
      description: |
        Count of customers per unified `CustomerStatus`, for the dashboard's
        status header. Every field is optional; a status absent from the object
        has a count of zero.
      properties:
        frozen:
          type: integer
          example: 2
        declined:
          type: integer
          example: 4
        withdrawn:
          type: integer
          example: 1
        approved:
          type: integer
          example: 128
        info_requested:
          type: integer
          example: 7
        submitted:
          type: integer
          example: 12
        pending:
          type: integer
          example: 9
    Customer:
      type: object
      description: Response containing the current status of a KYB verification process including provider-specific statuses.
      required:
        - id
        - name
        - customer_type
        - kyb_status
        - kyc_status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        name:
          type: string
          description: Name of the customer
          example: Acme Corp
        email:
          type: string
          description: Email address of the customer
          example: contact@acmecorp.com
        external_id:
          type: string
          description: Unique identifier for the customer in the client's system, as supplied when the customer was created. Omitted when no external ID was set.
          example: external_customer_123
        customer_type:
          type: string
          description: Type of entity - either an individual person or a company/organization
          enum:
            - individual
            - business
          example: business
        kyb_status:
          $ref: '#/components/schemas/KybStatus'
        kyc_status:
          allOf:
            - $ref: '#/components/schemas/KybLinkStatus'
          description: |
            Provider-agnostic effective KYC/B status for this customer,
            derived server-side for display convenience. Returns the same
            answer for both Sumsub-verified and Persona-verified customers
            without the client having to know which provider did the work.

            **Derivation order (most authoritative first):**
            1. The customer's onboarding application `decision`, if set
               (`approved` → `approved`; `declined`/`auto_declined` →
               `rejected`; `withdrawn` → `expired`).
            2. The most-recently-updated non-deleted persona `kyb_link`'s
               status (legacy customers from before the orchestration
               layer — Persona's `created` maps to `not_started`,
               `completed` to `approved`, `needs_review` to `in_review`).
            3. `pending` if the customer has an open onboarding
               application but no decision yet (Sumsub in-flight).
            4. `not_started` otherwise.

            **Advisory, not authoritative.** This field is provided for
            badge rendering and operator UIs. The derivation rules may
            evolve as new verification providers are added. For
            compliance-critical decisions, consult `decision`,
            `kyb_links`, and `provider_statuses` directly.
        kyb_links:
          type: array
          description: KYB Links for different providers used in the KYB process.
          items:
            $ref: '#/components/schemas/KybLink'
        provider_statuses:
          type: array
          description: Detailed status information from different verification providers used in the KYB process.
          items:
            $ref: '#/components/schemas/ProviderKybStatus'
        rd_allowed:
          type: boolean
          description: |
            Whether this customer is currently permitted to hold RD, derived
            server-side from the same US-state geofence that guards RD account
            creation. `true` when RD is allowed; `false` only when one of the
            customer's governing US states is on the restricted list while the
            geofence is active. Customers with no resolvable US governing state
            — non-US customers, or those whose jurisdiction is unconfirmed — are
            allowed. When the geofence is disabled (empty blocklist) this is
            `true` for everyone.

            This is the canonical read path for the RD-eligibility verdict:
            consumers read a boolean and never see or copy the underlying
            blocklist.
          example: true
        application_id:
          $ref: '#/components/schemas/KSUID'
          description: ID of the KYB application associated with this customer
        application_status:
          allOf:
            - $ref: '#/components/schemas/ApplicationStatus'
          description: |
            Current lifecycle state of the customer's onboarding application
            (e.g. `pending`, `submitted`, `under_review`, `approved`,
            `declined`). Omitted when the customer has no application.

            Use this field to drive workflow UI — it tracks where the
            customer is in the onboarding flow. For the orthogonal questions
            "is this customer cleared to transact?" and "what's the
            provider-agnostic KYC verdict?", see `kyb_status` and
            `kyc_status` respectively.
        decision:
          type: string
          description: Application decision status
          enum:
            - approved
            - declined
            - auto_declined
            - withdrawn
          example: approved
        decision_reason:
          type: string
          description: |
            Why the application was decided. Populated for withdrawn/declined
            applications — for example, the fixed reason recorded when an
            applicant withdraws from an RFI resubmission email. Omitted when there
            is no decision or no reason was recorded.
          example: User withdrew the application from the request-for-information (RFI) email
        status:
          allOf:
            - $ref: '#/components/schemas/CustomerStatus'
          description: |
            The single client-facing status for this customer, derived
            server-side. It collapses three signals into one badge so a client
            never has to reconcile `kyb_status`, `kyc_status`, and
            `application_status` by hand.

            **Precedence (first match wins):**
            1. `frozen` — the customer has an open freeze; surfaced over a stale
               approval so an actionable freeze is never masked.
            2. the most-recent application's decision — `approved`, `declined`
               (declined or auto_declined), or `withdrawn`.
            3. the most-recent application's lifecycle — `info_requested` when a
               request for information is open (the customer owes a response);
               the internal in-review states collapse to `submitted`; `pending`
               otherwise.
            4. `pending` when the customer has no application yet.

            Once a customer is `approved` / `declined` / `withdrawn`, that is the
            final answer and `kyb_status` / `kyc_status` do not change it. Use
            those fields only for the underlying breakdown.
        application_url:
          type: string
          description: |
            URL for accessing the onboarding application. Always present when the
            customer has an onboarding application, including during an open RFI
            loop. In an RFI loop the additive `resubmit_url` is returned as well,
            and the dashboard links to that resubmission page rather than this
            plain application view.
          example: https://onboarding.example.com/applications/abc123?token=xyz789
        resubmit_url:
          type: string
          description: |
            The resubmission link for a customer in an open RFI loop — the exact
            `/applications/{id}/resubmit?token=…` URL the applicant receives in
            the RFI email, built from the customer's existing onboarding token
            (no new token is minted on read). Present only when `status` is
            `info_requested`, and returned alongside `application_url` rather than
            in place of it.
          example: https://onboarding.example.com/applications/abc123/resubmit?token=xyz789
        created_at:
          type: integer
          description: Timestamp of when the link was created
          example: 1234567890
        updated_at:
          type: integer
          description: Timestamp of when the link was last updated.
          example: 1234567890
        deleted_at:
          type: integer
          description: Timestamp of when the link was deleted
          example: 1234567890
        sub_client_id:
          $ref: '#/components/schemas/KSUID'
          description: ID of the sub-client this customer is associated with, if any.
        sub_client_name:
          type: string
          description: Name of the sub-client this customer is associated with, if any.
          example: Partner Corp
        is_sub_client:
          type: boolean
          description: Whether this customer is a sub-client. This is set when the customer is created and cannot be changed afterwards.
          default: false
    KybStatus:
      type: string
      description: Overall status of the KYB verification process (e.g., pending, active, restricted).
      example: pending
      enum:
        - active
        - pending
        - partner_review
        - rejected
        - frozen
        - auto_declined
    UpdateCustomerSubClientRequest:
      type: object
      description: Request to update the sub-client association for a customer. Set sub_client_id to associate with a sub-client, or null to disassociate.
      properties:
        sub_client_id:
          type: string
          pattern: ^[0-9A-Za-z]{27}$
          minLength: 27
          maxLength: 27
          description: ID of the sub-client to associate with, or null to disassociate.
          nullable: true
          example: 1NFHrqBHb3cTfLVkFSGmHZqdDPi
    SubClientSummary:
      type: object
      description: Summary of a sub-client including the count of customers associated with it.
      required:
        - sub_client_id
        - sub_client_name
        - customer_count
      properties:
        sub_client_id:
          $ref: '#/components/schemas/KSUID'
        sub_client_name:
          type: string
          description: Name of the customer acting as a sub-client.
          example: Partner Corp
        customer_count:
          type: integer
          description: Number of customers associated with this sub-client.
          example: 15
    ProviderKybStatus:
      type: object
      required:
        - provider_id
        - status
      properties:
        provider_id:
          type: string
          description: ID of the verification provider or service used for a specific check.
          example: trm_labs
        status:
          type: string
          description: Current verification status with this specific provider.
          example: approved
          enum:
            - not_started
            - in_review
            - approved
            - rejected
            - requires_info
            - auto_declined
            - frozen
        endorsements:
          type: array
          items:
            type: string
          description: Array of endorsements associated with this provider status.
    KybLink:
      type: object
      description: Link to the KYB verification portal or dashboard for a specific provider.
      required:
        - provider_id
        - link_type
        - url
        - status
        - created_at
        - updated_at
      properties:
        provider_id:
          type: string
          description: ID of the verification provider or service used for a specific check.
          example: trm_labs
        link_type:
          $ref: '#/components/schemas/KybLinkType'
        url:
          type: string
          description: URL link to the KYB verification portal or dashboard where the entity can complete the verification process.
          example: https://verify.provider.com/kyb/a1b2c3d4e5f6
        status:
          $ref: '#/components/schemas/KybLinkStatus'
        created_at:
          type: integer
          description: Timestamp of when the link was created
          example: 1234567890
        updated_at:
          type: integer
          description: Timestamp of when the link was last updated.
          example: 1234567890
        expires_at:
          type: integer
          description: Timestamp of when the link will expire.
          example: 1234567890
        deleted_at:
          type: integer
          description: Timestamp of when the link was deleted
          example: 1234567890
    KybLinkType:
      type: string
      title: KYB Link Type
      description: |
        Type of link provided by a verification provider for KYB verification.

        **Deprecated values:**
        - `tos` — the Bridge TOS flow has been deprecated. The dashboard no
          longer surfaces TOS state, but legacy customer records may still
          carry `link_type: 'tos'` entries on the wire. New integrations
          should ignore these entries; the value is retained in the enum
          to keep responses for legacy data schema-valid.
      enum:
        - persona
        - tos
      example: persona
    KybLinkStatus:
      type: string
      title: KYB Link Status
      description: Current status of the KYB verification link.
      enum:
        - not_started
        - pending
        - expired
        - approved
        - rejected
        - in_review
      example: pending
    ApplicationStatus:
      type: string
      title: Application Status
      description: |
        Current status of an application in the onboarding flow.

        Status flow:
        - `pending` - Initial state, not yet submitted
        - `submitted` - Submitted for verification
        - `under_review` - Being reviewed by compliance team
        - `request_for_information` - Admin requesting additional info/documents from applicant
        - `admin_revision` - Admin making corrections to application data
        - `approved` - Application approved
        - `declined` - Application declined
        - `completed` - Legacy status (deprecated, use approved/declined instead)
        - `compliance_review` - Application is awaiting compliance review of a Proof of Address
          document. Set when an individual applicant uploads a PoA-equivalent document
          (proof_of_address, bank_statement, or utility_bill) after their application has
          already been approved or completed. The customer remains active but is subject to
          the $3,000 USD-equivalent rolling 7-day transaction limit until the review concludes.
      enum:
        - pending
        - submitted
        - under_review
        - request_for_information
        - admin_revision
        - approved
        - declined
        - completed
        - compliance_review
      example: submitted
    Family:
      type: string
      title: Family
      description: Blockchain family for the crypto account.
      enum:
        - evm
        - solana
      example: evm
    PaymentCapability:
      type: string
      title: Payment Capability
      description: Type of payment rail capability supported. For onramp accounts, `us_bank_account` indicates the account accepts ACH, Wire (Fedwire), and FedNow deposits interchangeably. `fednow` is the FedNow instant US-domestic USD rail for payouts and deposits — $500k per-transaction cap on payouts; a payout destination whose bank cannot receive FedNow is rejected at account creation with problem type `https://docs.dakota.xyz/api-reference/errors#fednow-destination-unreachable` — route that destination over `ach` instead.
      enum:
        - ach
        - fedwire
        - swift
        - sepa
        - us_bank_account
        - fednow
      example: ach
    TransactionStatus:
      type: string
      title: Transaction Status
      description: Current status of a transaction.
      enum:
        - timed_out
        - not_started
        - in_progress
        - awaiting_confirmation
        - pending
        - processing
        - completed
        - invalid
        - failed
        - canceled
        - reversed
        - rejected
        - broadcasted
        - pending_return
        - returned
        - pending_reversal
    TransactionType:
      type: string
      title: Transaction Type
      description: Type of transaction.
      enum:
        - onramp
        - offramp
        - swap
      example: onramp
    TransactionResourceType:
      type: string
      title: Transaction Resource Type
      description: Top-level transaction resource family.
      enum:
        - one_off
        - wallet
        - auto_account
      example: one_off
    Capabilities:
      type: array
      title: Capabilities
      description: |-
        List of payment capabilities supported by a rail. Multiple values may
        be supplied; the list is not limited to one entry. Which values are
        valid depends on the resource: on-ramp accounts accept any rail and
        expand `us_bank_account` to `ach` and `fedwire`; IBAN destinations
        accept `swift` and `sepa` only.
      items:
        $ref: '#/components/schemas/PaymentCapability'
      minItems: 1
      example:
        - ach
        - fedwire
    AccountType:
      type: string
      title: Account Type
      description: Unified account family for account resources.
      enum:
        - onramp
        - offramp
        - swap
      example: onramp
    AccountCreateRequest:
      type: object
      title: Account Create Request
      description: |-
        Unified account create request for onramp/offramp/swap.

        One schema serves all three account types, so its properties are the
        UNION of the three shapes: `account_type` decides which of them are
        read. `account_type` is therefore the only field this schema can mark
        required — everything else is required *per type*, and that contract is
        this table:

        | Field | `onramp` | `offramp` | `swap` |
        | --- | --- | --- | --- |
        | `capabilities` | **required** | ignored | ignored |
        | `rail` | optional | **required** | ignored |
        | `crypto_destination_id` | **required** | ignored | **required** |
        | `fiat_destination_id` | ignored | **required** | ignored |
        | `destination_network_id` | **required** | ignored | **required** |
        | `source_network_id` | ignored | **required** | **required** |
        | `source_asset` | **required** | **required** | **required** |
        | `destination_asset` | **required** | **required** | **required** |
        | `payment_reference` | rejected | optional | rejected |
        | `return_address` | ignored | optional | ignored |
        | `return_crypto_address` | ignored | ignored | optional |

        "Ignored" means the field is accepted and has no effect — sending it
        does not create the routing it names, so do not rely on it. The one
        exception is `payment_reference`, which is REJECTED rather than ignored
        on the types that cannot deliver it (see that field).

        `rail` on an `onramp` is optional because the account's inbound rails
        come from `capabilities`. `swift` and `sepa` must appear in
        `capabilities` and narrow the account to that rail. `ach`, `fedwire`
        and `fednow` must also appear in `capabilities`, but all resolve to
        `us_bank_account` — the same result as omitting `rail` when the
        capabilities include a US rail. `us_bank_account` itself is accepted
        as `rail` regardless of the capabilities list.

        A required field that you omit returns `400` (`invalid-request` or
        `invalid-identifier`, depending on the field), with a `detail` that
        identifies the problem.
      required:
        - account_type
      properties:
        account_type:
          $ref: '#/components/schemas/AccountType'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        rail:
          $ref: '#/components/schemas/PaymentCapability'
        crypto_destination_id:
          $ref: '#/components/schemas/KSUID'
        fiat_destination_id:
          $ref: '#/components/schemas/KSUID'
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        source_network_id:
          type: string
          description: Source network ID or wildcard network for crypto input.
          example: ethereum-mainnet
        source_asset:
          type: string
          description: Asset to send into the account.
          example: USDC
          minLength: 1
        destination_asset:
          type: string
          description: Asset to receive at the destination.
          example: USDC
          minLength: 1
        return_address:
          $ref: '#/components/schemas/CRI'
        return_crypto_address:
          $ref: '#/components/schemas/CRI'
        developer_fee_bps:
          type: integer
          format: int32
          description: Developer fee in basis points (1 bp = 0.01%).
          example: 50
          minimum: 0
          maximum: 10000
        max_transactions:
          type: integer
          format: int32
          description: |-
            Hard cap on how many transactions this account may ever create. A
            transaction is one convert-and-forward of funds received at the
            account through to its destination, so `1` makes the account a
            one-off and `N` lets one account serve N payments.

            Omit for the default, which is unchanged: the account is uncapped
            and keeps sweeping every deposit indefinitely (a durable, standing
            account).

            **Reaching the cap refuses further deposits; it does not turn the
            deposit details off.** Once the cap is used up:

            - Deposits sent to the account are **refused**. They are *not*
              returned to the sender — the funds still arrive and are then held
              pending manual intervention. Nothing is converted, nothing is
              forwarded, and no transaction appears on the account for them. Stop
              sending to the deposit details once the cap is reached.
            - The account is closed and stops serving new payments.
            - This is **not recoverable through this API**. `max_transactions` is
              immutable — it cannot be raised, and a closed account cannot be
              reopened — so a capped-out account is finished. Create a new
              account (with new deposit details) to keep receiving.

            **A slot is consumed by any transaction in flight or delivered, not
            only a successful one.** A slot is released only when a transaction
            ends with the value *not* staying with the recipient: canceled,
            rejected, reversed, or refunded. A failed or returned transaction
            keeps its slot, because its funds are still held and it can still be
            retried, until it is refunded. Size the cap against the number of
            deposits you expect, not the number of successes you need. Releasing
            a slot does not reopen a closed account.

            The cap is checked as each deposit arrives, so deposits that race
            each other can briefly overshoot `N`; the account closes on the next
            one.
          example: 1
          minimum: 1
        payment_reference:
          type: string
          description: |-
            Reference carried on the outbound fiat transfers this account
            makes. It is passed through to the bank as the payment's
            reference — the wire message to the creditor, or the ACH addenda —
            so it is what the payee sees against the credit. Some payees and
            rails require one to reconcile an incoming payment at all.

            This is ACCOUNT-LEVEL, unlike the `payment_reference` on a one-off
            transaction, which is per payment: EVERY sweep out of this account
            carries the SAME reference. If each payment needs its own
            reference, use a one-off transaction, or one account per reference.

            Only an outbound FIAT leg carries it, so this applies to `offramp`
            accounts. Setting it on an `onramp` or `swap` account is REJECTED
            with a 400: those sweep to a crypto address, where no reference is
            delivered, so accepting it would store a value the payee can never
            see. SWIFT is validated but NOT delivered: a SWIFT transfer carries
            no payment reference at all, and a one-off is no different — both
            reach the same send path, which has nowhere to put one. Do not plan
            on a reference reaching a SWIFT payee by any route today. ACH and
            wire (`fedwire`, `us_bank_account`) do deliver it.

            Validated against the account's `rail` with the same per-rail rules
            as a one-off's `payment_reference` — ACH at most 18 characters and
            letters/numbers/spaces only, wire (`fedwire`, `us_bank_account`) at
            most 140 characters, SEPA 6-140, SWIFT 5-140. A `swift` account
            validates the value but, per above, never delivers it.

            Omit for the default, which is unchanged: no reference is attached.
            An empty string means the same thing and is accepted — a client that
            always sends the field should not have to omit it to say "none", and
            an empty value must never be the thing that rejects an otherwise
            valid crypto account.
          maxLength: 140
          example: Invoice 12345
    AccountUpdateRequest:
      type: object
      title: Account Update Request
      description: |-
        Unified account update request for onramp/offramp/swap.

        Only destination routing fields are updatable: `crypto_destination_id`,
        `destination_network_id`, and `destination_asset` for onramp accounts,
        and `fiat_destination_id` for offramp accounts. `capabilities` and
        `rail` are immutable after account creation and cannot be updated
        through this request; create a new account to change them.
        `developer_fee_bps` is also updatable and applies to future
        transactions only; existing transactions are unaffected.
      required:
        - account_type
      properties:
        account_type:
          $ref: '#/components/schemas/AccountType'
        crypto_destination_id:
          $ref: '#/components/schemas/KSUID'
        fiat_destination_id:
          $ref: '#/components/schemas/KSUID'
        destination_network_id:
          $ref: '#/components/schemas/NetworkId'
        destination_asset:
          type: string
          description: Asset to receive at the destination.
          example: USDC
        developer_fee_bps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: |-
            Developer fee (client revenue share) in basis points. When set,
            updates the fee applied to FUTURE transactions on this account;
            existing transactions are unaffected. Routing fields remain immutable.
          example: 50
    AccountResponse:
      type: object
      title: Account Response
      description: Unified account response for onramp/offramp/swap.
      required:
        - id
        - account_type
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        account_type:
          $ref: '#/components/schemas/AccountType'
        bank_account:
          $ref: '#/components/schemas/BankAccount'
        destination:
          $ref: '#/components/schemas/DestinationResponseUnion'
        source_crypto_address:
          type: string
          description: Source crypto address for offramp/swap accounts.
          example: '0x1234'
        source_family:
          $ref: '#/components/schemas/Family'
        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        source_asset:
          type: string
          description: Asset sent into the account.
          example: USDC
        destination_asset:
          type: string
          description: Asset received at the destination.
          example: USDC
        rail:
          $ref: '#/components/schemas/PaymentCapability'
        destination_rail:
          $ref: '#/components/schemas/PaymentCapability'
    PaginatedAccountResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AccountResponse'
    BankAccount:
      type: object
      title: Bank Account
      description: Unified schema for bank accounts.
      required:
        - id
        - capabilities
        - account_holder_name
        - bank_name
        - bank_address
      properties:
        id:
          $ref: '#/components/schemas/KSUID'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        aba_routing_number:
          type: string
          description: ABA routing number for US accounts for general purposes incl. ACH.
          example: '123456789'
        aba_wire_routing_number:
          type: string
          description: ABA routing number for wire transfers (if different).
          example: '123456789'
        account_number:
          type: string
          description: Account number for the US bank account.
          example: '123456789'
        account_type:
          type: string
          description: Type of bank account (for US accounts).
          enum:
            - checking
            - savings
          example: checking
        bic:
          type: string
          description: BIC/SWIFT code for the international bank account.
          example: DEUTDEFFXXX
        iban:
          type: string
          description: IBAN for the international bank account.
          example: DE89370400440532013000
        account_holder_name:
          type: string
          description: Name of the account holder.
          example: John Doe
        account_holder_address:
          $ref: '#/components/schemas/Address'
          description: Address of the account holder.
        account_holder_phone:
          type: string
          description: Phone number of the account holder.
          example: '1234567890'
        bank_name:
          type: string
          description: Name of the bank.
          example: Bank of America
        bank_address:
          $ref: '#/components/schemas/Address'
          description: Address of the bank.
        bank_phone:
          type: string
          description: Phone number of the bank.
          example: '+12345678900'
        payment_reference:
          type: string
          nullable: true
          description: Deposit attribution reference. When present, include it in the reference/memo field of any payment sent to this account, so the arriving funds can be matched to it. It is required whenever the deposit instructions above point at an account shared with other customers, where the account number alone does not identify the depositor. Null when the provider does not require one — the funds are then attributed by the account details alone. This is inbound and provider-issued, unlike the account-level `payment_reference` on an account create request, which is a memo carried on the payments this account sends OUT.
          example: PRIFWEW6DDH
    DestinationRequestUnion:
      title: Destination Request Union
      description: Union type for different destination requests with destination_type discriminator
      oneOf:
