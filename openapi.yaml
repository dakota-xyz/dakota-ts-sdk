                    type: object
                    description: Row counts keyed by row state
                    additionalProperties:
                      type: integer
                  started_at:
                    type: integer
                    format: int64
                  finished_at:
                    type: integer
                    format: int64
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonaImportRowResult'
                  has_more_results:
                    type: boolean
