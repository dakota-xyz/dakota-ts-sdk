        url: https://docs.dakota.xyz/api-reference/sandbox/simulate-onboarding
  /sandbox/simulations/{simulation_id}:
    get:
      tags:
        - Sandbox
      summary: Get simulation status
      description: |
        Returns the current state and callback delivery history for a sandbox simulation.
        Use this to debug async flows — see whether callbacks have been scheduled, delivered,
        or failed. Available in sandbox mode only.
      operationId: getSimulation
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema:
            type: string
          description: The simulation_id returned by POST /sandbox/simulate/inbound
      responses:
        '200':
          description: Simulation found
          content:
            application/json:
              schema:
