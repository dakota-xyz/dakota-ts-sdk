# SDK-owned overlay: beta-tagged (x-beta) agentic surface.
# Regenerated by scripts/extract-agentic.mjs.
# Merged into openapi.yaml by scripts/merge-openapi.mjs on `npm run generate`.
paths:
  /payment-agents:
    x-beta: true
    post:
      tags:
        - Agentic Payments
      summary: Create a hosted payment agent (BETA)
      description: |
        > **Beta** — early access.

        Creates a payment agent with a real signer row for its derived key (an agent is an ordinary signer). Wallet access is granted separately through the endorsed signer-group / policy attach flow.
      operationId: createPaymentAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentAgentRequest'
            example:
              customer_id: 2vWxCustomer0000000000000000
              name: My Bill Pay
              hosted: true
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAgentResponse'
              example:
                id: 2vWxAgent0000000000000000000
                name: My Bill Pay
                customer_id: 2vWxCustomer0000000000000000
                hosted: true
                signer_id: 2vWxSigner000000000000000000
                signer_public_key: BHkExampleKeyQm
                wallet_ids: []
                state: active
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: name is required
        '403':
          description: The customer is frozen and cannot move money
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#account-under-review
                title: Account Under Review
                status: 403
                detail: This account is under review and cannot move funds until the review is resolved.
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /instructions:
    x-beta: true
    post:
      tags:
        - Agentic Payments
      summary: Accept instructions — actuate proposals (BETA)
      description: |
        > **Beta** — early access.

        Each accepted proposal becomes one persisted instruction whose action series is actuated deterministically. Every proposal must instruct a payment. Returns only the instruction ids.
      operationId: createInstructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstructionsRequest'
            example:
              payment_agent_id: 2vWxAgent0000000000000000000
              proposals:
                - actions:
                    - type: create_recipient
                      create_recipient:
                        name: Alice
                    - type: create_crypto_destination
                      create_crypto_destination:
                        address: '0xa11ce00000000000000000000000000000000001'
                        network_id: base-sepolia
                    - type: create_mandate
                      create_mandate:
                        rule:
                          target_type: recipient
                          targets:
                            - Alice
                          network_id: base-sepolia
                          asset: USDC
                          max_per_tx: '10000'
                          window: MONTHLY
                          max_count_per_target_in_window: 1
                    - type: create_scheduled_payments
                      create_scheduled_payments:
                        amount: '10000'
                        asset: USDC
                        dates:
                          - 1781481600
      responses:
        '201':
          description: Created instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenticInstructionsResult'
              example:
                instruction_ids:
                  - 2vWxInstruction0000000000000
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: a proposal must instruct a payment
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /scheduled-payments:
    x-beta: true
    post:
      tags:
        - Agentic Payments
      summary: Schedule a payment directly (BETA)
      description: |
        > **Beta** — early access.

        Creates one or more scheduled payments for a signer WITHOUT the proposal flow — schedule directly under an existing active mandate (coverage is matched at fire time, so no new signature is needed here). The payments bind the given signer and funding wallet. The signer must be permitted to spend on that wallet, the wallet must belong to the calling client, and the destination must be a crypto destination of the wallet's customer. The schedule is explicit `dates` (one payment per timestamp) OR `count` × `interval_seconds` from `start_at` (0 ⇒ now); dates are unix SECONDS and are rejected if in the past or implausibly far ahead. Whether a mandate covers each payment is decided at fire time by the money-path gate — a scheduled payment with no covering active mandate fails at fire, it is not rejected here.
      operationId: createScheduledPayment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledPaymentRequest'
            example:
              signer_id: 2vWxSigner000000000000000000
              wallet_id: 2vWxWallet000000000000000000
              destination_id: 2vWxDestination00000000000000
              amount: '10000'
              asset: USDC
              dates:
                - 1781481600
      responses:
        '201':
          description: The scheduled payments that were created (one row per date)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledPaymentResponse'
              example:
                - id: 2vWxScheduled000000000000000
                  signer_id: 2vWxSigner000000000000000000
                  wallet_id: 2vWxWallet000000000000000000
                  amount: '10000'
                  asset: USDC
                  address: '0xa11ce00000000000000000000000000000000001'
                  network_id: base-sepolia
                  status: scheduled
                  scheduled_at: 1781481600
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: signer is not permitted to spend on wallet
        '403':
          description: The customer is frozen and cannot move money
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#account-under-review
                title: Account Under Review
                status: 403
                detail: This account is under review and cannot move funds until the review is resolved.
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: wallet not found
    get:
      tags:
        - Agentic Payments
      summary: List the calling client's scheduled payments (BETA)
      description: |
        > **Beta** — early access.

        Returns the calling client's scheduled payments (the ScheduledPayment primitive — all statuses, not just future ones), newest due first. Each shows its funding wallet (the customer's choice at acceptance); once executed, a row also carries the covering mandate and money-path transaction as audit. Narrow the collection with the optional customer_id, signer_id, wallet_id, mandate_id, and status filters; omit them all for the full client collection. The mandate_id filter naturally matches executed rows only (a row carries no mandate until it fires).

        Payments are returned in `data`, with `meta` carrying the total match count (across all pages, honouring the same filters) and whether more rows exist before or after this one. Unpaginated, `meta.total_count` equals the length of `data` and both flags are false.
      operationId: listScheduledPayments
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
          description: Only payments for this customer (the signer's owning agent's customer).
        - name: signer_id
          in: query
          required: false
          schema:
            type: string
          description: Only payments bound to this signer.
        - name: wallet_id
          in: query
          required: false
          schema:
            type: string
          description: Only payments funded from this wallet.
        - name: mandate_id
          in: query
          required: false
          schema:
            type: string
          description: |
            Only payments that executed under this mandate (mandate_id is stamped at fire time, so this matches executed rows only).
        - name: mandate_version
          in: query
          required: false
          schema:
            type: integer
          description: |
            Only payments that executed under this VERSION of the mandate — "which payments were judged against v2's caps". Use together with mandate_id; like it, this matches executed rows only.
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated statuses to include, e.g. "scheduled,executed". Allowed values: scheduled, cancelled, executed, failed. Omit for all.
        - name: limit
          in: query
          required: false
          description: |
            Page size. OMIT FOR EVERY MATCHING PAYMENT, which is what this endpoint has always returned and remains the default — a client that does not ask to paginate must not be silently truncated. When you do page, `meta.total_count` and `meta.has_more_after` tell you where you are in the collection, so a full page is never mistaken for the end.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page
          in: query
          required: false
          description: |
            1-based page number, used only alongside `limit`; on its own it has nothing to page through and is ignored. A page past the end is an empty list, not an error.

            Rows are ordered by due date DESCENDING and then by id descending — newest due first, so page 1 carries the most recent and upcoming activity rather than the oldest settled history. The id tiebreak makes that order total, so a payment cannot be skipped or repeated across pages by sharing a due date with another.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Scheduled payments, newest due first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPaymentList'
              example:
                data:
                  - id: 2vWxScheduled000000000000000
                    wallet_id: 2vWxWallet000000000000000000
                    amount: '10000'
                    asset: USDC
                    address: '0xa11ce00000000000000000000000000000000001'
                    network_id: base-sepolia
                    status: scheduled
                    scheduled_at: 1781481600
                meta:
                  total_count: 1
                  has_more_after: false
                  has_more_before: false
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-identifier
                title: Invalid Identifier
                status: 400
                detail: invalid signer_id
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /mandates:
    x-beta: true
    post:
      tags:
        - Mandates
      summary: Create a mandate directly (BETA)
      description: |
        > **Beta** — early access.

        Drafts a PENDING mandate from a direct user interaction - no instruction back-link. Exactly one binding form names the signer the mandate binds: payment_agent_id (the hosted convenience - binds that agent's signer and anchors the mandate to the agent's customer), or signer_id together with customer_id (any of the client's signers, BYO keys included; the customer anchors the recipient-target scope and the §8 approver set). The rule is the one the customer will approve (POST /mandates/{mandate_id}/approve, a recognized signer other than the bound one, §8). Recipient targets may be recipient ids or payee names - names resolve to the mandate's customer's existing recipients before anything is stored. Schedule payments under it by mandate_id; they arm the moment it activates.
      operationId: createMandate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMandateRequest'
            example:
              payment_agent_id: 2vWxAgent0000000000000000000
              rule:
                target_type: recipient
                targets:
                  - Alice
                network_id: base-sepolia
                asset: USDC
                max_per_tx: '100'
                window: MONTHLY
                max_count_per_target_in_window: 1
              valid_until: 1798761599
      responses:
        '201':
          description: The pending mandate, targets resolved to ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              example:
                id: 2vWxMandate00000000000000000
                status: pending
                bound_signer_id: 2vWxSigner000000000000000000
                rule:
                  target_type: recipient
                  targets:
                    - 2vWxRecipient000000000000000
                  network_id: base-sepolia
                  asset: USDC
                  max_per_tx: '100'
                  window: MONTHLY
                  max_count_per_target_in_window: 1
                valid_until: 1798761599
        '400':
          description: Unresolvable target or invalid rule.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: 'target "Bob": recipient not found for this customer'
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
    get:
      tags:
        - Mandates
      summary: List the calling client's mandates (BETA)
      description: |
        > **Beta** — early access.

        Returns the calling client's mandates, newest first, with the EFFECTIVE status - a pending or active mandate past its valid_until reads "expired" (derived on read; the stored status and audit columns are unchanged). Narrow the collection with the optional customer_id, signer_id, and status filters; omit them all for the full client collection.
      operationId: listMandates
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
          description: Only mandates whose bound signer belongs to this customer's agent.
        - name: signer_id
          in: query
          required: false
          schema:
            type: string
          description: Only mandates bound to this signer.
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated effective statuses to include, e.g. "active,expired". Allowed values: pending, active, expired, rejected, revoked, done. Omit for all.
      responses:
        '200':
          description: Mandates, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mandate'
              example:
                - id: 2vWxMandate00000000000000000
                  status: active
                  bound_signer_id: 2vWxSigner000000000000000000
                  target_names:
                    - Alice
                  rule:
                    target_type: recipient
                    targets:
                      - 2vWxRecipient000000000000000
                    network_id: base-sepolia
                    asset: USDC
                    max_per_tx: '10000'
                    window: MONTHLY
                    max_count_per_target_in_window: 1
                  valid_until: 1812931200
                  approved_by_signer_id: 2vWxApprover0000000000000000
                  approved_at: 1781280000
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: unknown status "frozen" (want pending|active|expired|rejected|revoked|done)
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /payment-agents/{payment_agent_id}:
    x-beta: true
    get:
      tags:
        - Agentic Payments
      summary: Get a hosted payment agent (BETA)
      description: |
        > **Beta** — early access.

        Returns the agent together with the wallets it can currently spend from. The wallet_ids are DERIVED at query time from the agent signer's live signer-group membership (recognition over the policy-engine truth mirror), so they reflect the agent's access right now — not just at creation time. Use this to read an agent back and reconcile which wallets it is authorized on. The derived state folds the same recognition in (a non-revoked agent recognized on no wallet is pending).
      operationId: getPaymentAgent
      parameters:
        - name: payment_agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAgentResponse'
              example:
                id: 2vWxAgent0000000000000000000
                name: My Bill Pay
                customer_id: 2vWxCustomer0000000000000000
                hosted: true
                signer_id: 2vWxSigner000000000000000000
                signer_public_key: BHkExampleKeyQm
                wallet_ids:
                  - 2vWxWalletEvm000000000000000
                  - 2vWxWalletSol000000000000000
                state: active
        '404':
          description: Agentic payments not enabled, or the agent was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
  /payment-agents/{payment_agent_id}/x402/holds:
    x-beta: true
    get:
      tags:
        - Agentic Payments
      summary: List an agent's x402 authorization holds (BETA)
      description: |
        > **Beta** — early access.

        Every issued x402 signature has a hold: `outstanding` while it is settleable, `settled` once the transfer is seen on-chain, `released` if its window closed unused. Outstanding and settled holds both count against the mandate's budget; a released one returns it.

        This is the only record of x402 spend - an x402 authorization moves money without a Dakota-initiated transaction, so it writes no transaction row.
      operationId: listX402Holds
      parameters:
        - name: payment_agent_id
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Filter to one hold state.
          schema:
            type: string
            enum:
              - outstanding
              - settled
              - released
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/StartingAfterParam'
        - $ref: '#/components/parameters/EndingBeforeParam'
      responses:
        '200':
          description: One page of the agent's holds, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/X402HoldResponse'
              example:
                data:
                  - id: 2vWxX402Hold000000000000001
                    nonce: '0x3f1c8a5b2d7e4906c1a3f85b2e6d04971c8a5b3f2d7e4906c1a3f85b2e6d0497'
                    mandate_id: 2vWxX402Mandate000000000001
                    agent_id: 2vWxAgent000000000000000000
                    wallet_id: 2vWxWallet00000000000000000
                    pay_to: '0x94aE0f8B9F3c2A1d5E6b7C8D9e0F1a2B3c4D5E6F'
                    value: '100000'
                    asset: USDC
                    network: base-sepolia
                    state: settled
                    created_at: '2026-09-08T00:00:05Z'
                    valid_before: '2026-09-08T00:02:05Z'
                    tx_hash: '0x05dd3a9587f41b2c6e8d0a4f7b3c95e2d18a6f40b7c29e5d3a81f64b0c7e2d95'
                    settled_at: '2026-09-08T00:00:07Z'
                meta:
                  total_count: 1
                  has_more_after: false
                  has_more_before: false
        '400':
          description: |
            The agent id, the state filter or a pagination parameter is malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: |
            Missing or invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |
            The caller lacks the permission this route requires
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: |
            Agentic payments are not enabled for the client, x402 is not enabled for the agent (enable it with POST /payment-agents/{payment_agent_id}/x402), or the agent was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: |
            Too many requests; back off and retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: |
            Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /payment-agents/{payment_agent_id}/proposals/progress:
    x-beta: true
    get:
      tags:
        - Agentic Payments
      summary: Live progress of an in-flight drafting turn (BETA)
      description: |
        > **Beta** — early access.

        A multi-payee drafting turn legitimately runs minutes (it is several sequential model calls). While your POST /payment-agents/{payment_agent_id}/proposals is in flight, poll this endpoint (every few seconds) to show the customer what the agent is doing right now — "Looking up 8 payees · checking balances", "Drafting the proposals", "Revising the draft". Advisory display only: `active: false` means no turn is currently publishing progress for this agent (idle, just finished, or served by another instance) — fall back to a generic spinner. Never gate any behavior on this endpoint.
      operationId: getPaymentAgentProposalsProgress
      parameters:
        - name: payment_agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The latest progress snapshot, or active=false when idle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenticProposalsProgress'
              example:
                active: true
                phase: working
                detail: Looking up 8 payees · checking balances
                iteration: 1
                updated_at: 1784725000
        '400':
          description: Invalid agent id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Agent not found (or agentic payments not enabled)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /mandates/{mandate_id}/versions:
    x-beta: true
    get:
      tags:
        - Mandates
      summary: List a mandate's versions (BETA)
      description: |
        > **Beta** — early access.

        The mandate's append-only version history, oldest first — every rule that was ever in force under it and the §8 signer that put each one there. Versions are immutable: a rule listed here never changes.

        This is what makes an executed scheduled payment's audit stamp legible. The payment records `mandate_id` and `mandate_version`; what that version's caps actually were is only knowable from here.
      operationId: listMandateVersions
      parameters:
        - name: mandate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The version history, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MandateVersion'
              example:
                - version: 1
                  rule:
                    target_type: recipient
                    targets:
                      - 2vWxRecipient000000000000000
                    asset: USDC
                    window: MONTHLY
                    max_amount_in_window: '10000'
                  approved_by_signer_id: 2vWxApprover0000000000000000
                  approved_at: 1750000000
                  created_at: 1749990000
                - version: 2
                  rule:
                    target_type: recipient
                    targets:
                      - 2vWxRecipient000000000000000
                      - 2vWxRecipient111111111111111
                    asset: USDC
                    window: MONTHLY
                    max_amount_in_window: '20000'
                  approved_by_signer_id: 2vWxApprover0000000000000000
                  approved_at: 1752000000
                  created_at: 1752000000
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: invalid mandate id
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
