# SDK-owned overlay: alpha-tagged (x-alpha) agentic surface.
# Regenerated by scripts/extract-agentic.mjs.
# Merged into openapi.yaml by scripts/merge-openapi.mjs on `npm run generate`.
paths:
  /payment-agents:
    x-alpha: true
    post:
      tags:
        - Agentic Payments
      summary: Create a hosted payment agent (ALPHA)
      description: |
        Creates a payment agent with a real signer row for its derived key (an agent is an ordinary signer). Wallet access is granted separately through the endorsed signer-group / policy attach flow.
      operationId: createPaymentAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentAgentRequest'
            example:
              customer_id: 2vWxCustomer0000000000000000
              name: My Bill Pay
              hosted: true
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAgentResponse'
              example:
                id: 2vWxAgent0000000000000000000
                name: My Bill Pay
                customer_id: 2vWxCustomer0000000000000000
                hosted: true
                signer_id: 2vWxSigner000000000000000000
                signer_public_key: BHkExampleKeyQm
                wallet_ids: []
                state: active
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: name is required
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /payment-agents/{payment_agent_id}:
    x-alpha: true
    get:
      tags:
        - Agentic Payments
      summary: Get a hosted payment agent (ALPHA)
      description: |
        Returns the agent together with the wallets it can currently spend from. The wallet_ids are DERIVED at query time from the agent signer's live signer-group membership (recognition over the policy-engine truth mirror), so they reflect the agent's access right now — not just at creation time. Use this to read an agent back and reconcile which wallets it is authorized on. The derived state folds the same recognition in (a non-revoked agent recognized on no wallet is pending).
      operationId: getPaymentAgent
      parameters:
        - name: payment_agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAgentResponse'
              example:
                id: 2vWxAgent0000000000000000000
                name: My Bill Pay
                customer_id: 2vWxCustomer0000000000000000
                hosted: true
                signer_id: 2vWxSigner000000000000000000
                signer_public_key: BHkExampleKeyQm
                wallet_ids:
                  - 2vWxWalletEvm000000000000000
                  - 2vWxWalletSol000000000000000
                state: active
        '404':
          description: Agentic payments not enabled, or the agent was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
  /payment-agents/{payment_agent_id}/revoke:
    x-alpha: true
    post:
      tags:
        - Agentic Payments
      summary: Revoke a hosted agent (ALPHA)
      description: |
        Revokes an agent: it can no longer be used, and its signing key is destroyed in the isolated signer service (best-effort — the revoked state is authoritative). Idempotent.
      operationId: revokePaymentAgent
      parameters:
        - name: payment_agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAgentResponse'
              example:
                id: 2vWxAgent0000000000000000000
                name: My Bill Pay
                customer_id: 2vWxCustomer0000000000000000
                hosted: true
                signer_id: 2vWxSigner000000000000000000
                signer_public_key: BHkExampleKeyQm
                wallet_ids: []
                state: revoked
        '404':
          description: Agentic payments not enabled, or the agent was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
  /payment-agents/{payment_agent_id}/proposals:
    x-alpha: true
    post:
      tags:
        - Agentic Payments
      summary: Draft payment proposals from a conversation (ALPHA)
      description: |
        Pure cognition, no side effects: turn a customer's natural-language request into reviewable PROPOSALS — the same action-series shape POST /instructions accepts. Stateless: send the conversation so far in `messages` (and/or a `prompt` appended as the latest user turn) on each call, and the response carries either a clarifying/confirming reply, or — only at high confidence — validated proposals (sometimes both). The agent may consult the customer's existing payees and this agent's payment history; it never guesses amounts, assets, networks, or addresses, and proposals still only take effect via the instructions + mandate-signature flow. Requires the freeform LLM layer to be configured server-side.
      operationId: createPaymentAgentProposals
      parameters:
        - name: payment_agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalsRequest'
            example:
              prompt: Pay Alice 10 USDC on base-sepolia 0xa11ce00000000000000000000000000000000001 every month on the 15th until Dec 26
      responses:
        '200':
          description: The agent's next step — a reply, proposals, or both
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenticProposalsResult'
              example:
                reply: Drafting a monthly payment to Alice — review and sign below.
                proposals:
                  - summary: Pay Alice 10 USDC on base-sepolia, on the 15th of every month until Dec 2026 (7 payments)
                    actions:
                      - type: create_recipient
                        create_recipient:
                          name: Alice
                      - type: create_crypto_destination
                        create_crypto_destination:
                          address: '0xa11ce00000000000000000000000000000000001'
                          network_id: base-sepolia
                      - type: create_mandate
                        create_mandate:
                          rule:
                            target_type: recipient
                            targets:
                              - Alice
                            network_id: base-sepolia
                            asset: USDC
                            max_per_tx: '10'
                            window: MONTHLY
                            max_count_per_target_in_window: 1
                          valid_until: 1798675200
                      - type: create_scheduled_payments
                        create_scheduled_payments:
                          destination_id: ''
                          amount: '10'
                          asset: USDC
                          dates:
                            - 1782864000
                            - 1785542400
        '400':
          description: Invalid request, or the freeform conversation layer is not configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid request
                status: 400
                detail: freeform proposals are not enabled (no LLM configured)
        '404':
          description: Agentic payments not enabled, or the agent was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
        '429':
          description: |
            The per-customer proposal-drafting rate limit was exceeded (an hourly burst window and a daily window). Back off and retry later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#rate-limited
                title: Rate Limited
                status: 429
                detail: proposal rate limit reached for this customer (hour window) — retry later
  /instructions:
    x-alpha: true
    post:
      tags:
        - Agentic Payments
      summary: Accept instructions — actuate proposals (ALPHA)
      description: |
        Each accepted proposal becomes one persisted instruction whose action series is actuated deterministically. Every proposal must instruct a payment. Returns only the instruction ids.
      operationId: createInstructions
      requestBody:
        required: true
