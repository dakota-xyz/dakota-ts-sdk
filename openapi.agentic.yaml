                  mandate_strategy: external_only
                  payout_route: bank_only
                  labels:
                    limit: spending limit
                    limit_unit: USD
                    payee: recipient
                created_at: 1761600000
                updated_at: 1761686400
        '400':
          description: |
            The policy is not one this server can enforce — an unknown key, an unsupported value, or a label for an unimplemented concept.
