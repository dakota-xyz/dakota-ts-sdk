  /scheduled-payments:
    x-alpha: true
    get:
      tags:
        - Agentic Payments
      summary: List the calling client's scheduled payments (ALPHA)
      description: |
        Returns the calling client's scheduled payments (the ScheduledPayment primitive — all statuses, not just future ones), oldest due first. Each shows its funding wallet (the customer's choice at acceptance); once executed, a row also carries the covering mandate and money-path transaction as audit. Narrow the collection with the optional customer_id, signer_id, wallet_id, mandate_id, and status filters; omit them all for the full client collection. The mandate_id filter naturally matches executed rows only (a row carries no mandate until it fires).
      operationId: listScheduledPayments
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
          description: Only payments for this customer (the signer's owning agent's customer).
        - name: signer_id
          in: query
          required: false
          schema:
            type: string
          description: Only payments bound to this signer.
        - name: wallet_id
          in: query
          required: false
          schema:
            type: string
          description: Only payments funded from this wallet.
        - name: mandate_id
          in: query
          required: false
          schema:
            type: string
          description: |
            Only payments that executed under this mandate (mandate_id is stamped at fire time, so this matches executed rows only).
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated statuses to include, e.g. "scheduled,executed". Allowed values: scheduled, cancelled, executed, failed. Omit for all.
      responses:
        '200':
          description: Scheduled payments, oldest due first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledPaymentResponse'
              example:
                - id: 2vWxScheduled000000000000000
                  wallet_id: 2vWxWallet000000000000000000
                  amount: '10000'
                  asset: USDC
                  address: '0xa11ce00000000000000000000000000000000001'
                  network_id: base-sepolia
                  status: scheduled
                  scheduled_at: 1781481600
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-identifier
                title: Invalid Identifier
                status: 400
                detail: invalid signer_id
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
    post:
      tags:
        - Agentic Payments
      summary: Schedule a payment directly (ALPHA)
      description: |
        Creates one or more scheduled payments for a signer WITHOUT the proposal flow — schedule directly under an existing active mandate (coverage is matched at fire time, so no new signature is needed here). The payments bind the given signer and funding wallet. The signer must be permitted to spend on that wallet, the wallet must belong to the calling client, and the destination must be a crypto destination of the wallet's customer. The schedule is explicit `dates` (one payment per timestamp) OR `count` × `interval_seconds` from `start_at` (0 ⇒ now); dates are unix SECONDS and are rejected if in the past or implausibly far ahead. Whether a mandate covers each payment is decided at fire time by the money-path gate — a scheduled payment with no covering active mandate fails at fire, it is not rejected here.
      operationId: createScheduledPayment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledPaymentRequest'
            example:
              signer_id: 2vWxSigner000000000000000000
              wallet_id: 2vWxWallet000000000000000000
              destination_id: 2vWxDestination00000000000000
              amount: '10000'
              asset: USDC
              dates:
                - 1781481600
      responses:
        '201':
          description: The scheduled payments that were created (one row per date)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledPaymentResponse'
              example:
                - id: 2vWxScheduled000000000000000
                  signer_id: 2vWxSigner000000000000000000
                  wallet_id: 2vWxWallet000000000000000000
                  amount: '10000'
                  asset: USDC
                  address: '0xa11ce00000000000000000000000000000000001'
                  network_id: base-sepolia
                  status: scheduled
                  scheduled_at: 1781481600
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-identifier
                title: Invalid Identifier
                status: 400
                detail: exactly one of destination_id or address+network_id is required
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /mandates:
    x-alpha: true
    get:
      tags:
        - Mandates
      summary: List the calling client's mandates (ALPHA)
      description: |
        Returns the calling client's mandates, newest first, with the EFFECTIVE status - a pending or active mandate past its valid_until reads "expired" (derived on read; the stored status and audit columns are unchanged). Narrow the collection with the optional customer_id, signer_id, and status filters; omit them all for the full client collection.
      operationId: listMandates
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
          description: Only mandates whose bound signer belongs to this customer's agent.
        - name: signer_id
          in: query
          required: false
          schema:
            type: string
          description: Only mandates bound to this signer.
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated effective statuses to include, e.g. "active,expired". Allowed values: pending, active, expired, rejected, revoked, done. Omit for all.
      responses:
        '200':
          description: Mandates, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mandate'
              example:
                - id: 2vWxMandate00000000000000000
                  status: active
                  bound_signer_id: 2vWxSigner000000000000000000
                  target_names:
                    - Alice
                  rule:
                    target_type: recipient
                    targets:
                      - 2vWxRecipient000000000000000
                    network_id: base-sepolia
                    asset: USDC
                    max_per_tx: '10000'
                    window: MONTHLY
                    max_count_per_target_in_window: 1
                  valid_until: 1812931200
                  approved_by_signer_id: 2vWxApprover0000000000000000
                  approved_at: 1781280000
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: unknown status "frozen" (want pending|active|expired|rejected|revoked|done)
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
    post:
      tags:
        - Mandates
      summary: Create a mandate directly (ALPHA)
      description: |
        Drafts a PENDING mandate from a direct user interaction - no instruction back-link. The mandate binds the agent's signer; the rule is the one the customer will approve (POST /mandates/{mandate_id}/approve, a recognized signer other than the bound one, §8). Recipient targets may be recipient ids or payee names - names resolve to the customer's existing recipients before anything is stored. Schedule payments under it by mandate_id; they arm the moment it activates.
      operationId: createMandate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMandateRequest'
            example:
              payment_agent_id: 2vWxAgent0000000000000000000
              rule:
                target_type: recipient
                targets:
                  - Alice
                network_id: base-sepolia
                asset: USDC
                max_per_tx: '100'
                window: MONTHLY
                max_count_per_target_in_window: 1
              valid_until: 1798761599
      responses:
        '201':
          description: The pending mandate, targets resolved to ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              example:
                id: 2vWxMandate00000000000000000
                status: pending
                bound_signer_id: 2vWxSigner000000000000000000
                rule:
                  target_type: recipient
                  targets:
                    - 2vWxRecipient000000000000000
                  network_id: base-sepolia
                  asset: USDC
                  max_per_tx: '100'
                  window: MONTHLY
                  max_count_per_target_in_window: 1
                valid_until: 1798761599
        '400':
          description: Unresolvable target or invalid rule.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: 'target "Bob": recipient not found for this customer'
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agent not found
  /scheduled-payments/{scheduled_payment_id}/cancel:
    x-alpha: true
    post:
      tags:
        - Agentic Payments
      summary: Cancel one scheduled payment (ALPHA)
      description: |
        Finalizes a single still-scheduled payment as cancelled. No signature is required - schedule rows are bookkeeping, not authorization (they are created by a plain API-key call); the signed grant is the MANDATE, which this does not touch. New payments can be instructed under the same mandate at any time. Executed, failed, and already-cancelled rows are not cancellable; a cancel racing the cron at the exact fire moment loses cleanly (the status guard never overwrites an executed payment).
      operationId: cancelScheduledPayment
      parameters:
        - name: scheduled_payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The cancelled scheduled payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPaymentResponse'
              example:
                id: 2vWxScheduled000000000000000
                wallet_id: 2vWxWallet000000000000000000
                amount: '10000'
                asset: USDC
                address: '0xa11ce00000000000000000000000000000000001'
                network_id: base-sepolia
                status: cancelled
                scheduled_at: 1781481600
        '400':
          description: Unknown payment or not cancellable (executed, failed, or already cancelled).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-request
                title: Invalid Request
                status: 400
                detail: scheduled payment is executed, not cancellable
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /instructions/{instruction_id}:
    x-alpha: true
    get:
      tags:
        - Agentic Payments
      summary: Get an instruction (ALPHA)
      description: |
        Returns the accepted proposal - its action series and the per-action downstream artifacts actuation produced.
      operationId: getInstruction
      parameters:
        - name: instruction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenticInstruction'
              example:
                id: 2vWxInstruction0000000000000
                payment_agent_id: 2vWxAgent0000000000000000000
                status: executed
                actions:
                  - type: create_recipient
                    create_recipient:
                      name: Alice
                downstream:
                  - recipient_id: 2vWxRecipient000000000000000
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-identifier
                title: Invalid Identifier
                status: 400
                detail: invalid instruction id
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
  /mandates/{mandate_id}:
    x-alpha: true
    get:
      tags:
        - Mandates
      summary: Get a mandate (ALPHA)
      description: |
        Returns the mandate - the signer it binds, its rule exactly as the customer approves it, validity, and status.
      operationId: getMandate
      parameters:
        - name: mandate_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mandate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              example:
                id: 2vWxMandate00000000000000000
                status: pending
                bound_signer_id: 2vWxSigner000000000000000000
                instruction_id: 2vWxInstruction0000000000000
                rule:
                  target_type: recipient
                  targets:
                    - 2vWxRecipient000000000000000
                  network_id: base-sepolia
                  asset: USDC
                  max_per_tx: '10000'
                  window: MONTHLY
                  max_count_per_target_in_window: 1
                valid_until: 1798761599
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#invalid-identifier
                title: Invalid Identifier
                status: 400
                detail: invalid mandate id
        '404':
          description: Agentic payments not enabled, or the resource was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://docs.dakota.xyz/api-reference/errors#not-found
                title: Not Found
                status: 404
                detail: agentic payments are not enabled
components:
  schemas:
    PaymentAgentResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        customer_id:
          type: string
        hosted:
          type: boolean
        signer_id:
          type: string
        signer_public_key:
          type: string
          description: base64 P-256 SPKI
        wallet_ids:
          type: array
          items:
            type: string
          description: DERIVED - wallets whose attached signer groups contain the agent's signer. Empty until the customer's endorsed attaches land.
        state:
          type: string
          enum:
            - pending
            - active
            - revoked
          description: pending is DERIVED - a non-revoked agent recognized on no wallet. It cannot accept instructions until a wallet attach is endorsed.
        signer_group_cleanup:
          type: array
          description: |
            Present on revoke: the signer groups the (now-revoked) agent's signer still belongs to. A revoked signer can't sign, but its group membership lingers — remove signer_id from each (DELETE /signer-groups/{signer_group_id}/signers/{signer_id}) to finish de-provisioning. Absent when there is nothing to clean up.
          items:
            $ref: '#/components/schemas/PaymentAgentSignerGroupRef'
    PaymentAgentSignerGroupRef:
      type: object
      description: A signer-group reference (id + display name).
      required:
        - signer_group_id
        - name
      properties:
        signer_group_id:
          type: string
        name:
          type: string
    AgenticAction:
      type: object
      description: Tagged union - exactly one payload field matching `type` is set.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - create_recipient
            - create_crypto_destination
            - create_bank_destination
            - create_mandate
            - create_scheduled_payments
            - create_auto_account
        create_recipient:
          $ref: '#/components/schemas/RecipientRequest'
        create_crypto_destination:
          $ref: '#/components/schemas/CreateCryptoDestinationAction'
        create_bank_destination:
          $ref: '#/components/schemas/CreateBankDestinationAction'
        create_mandate:
          $ref: '#/components/schemas/CreateMandateAction'
        create_scheduled_payments:
          $ref: '#/components/schemas/CreateScheduledPaymentsAction'
        create_auto_account:
          $ref: '#/components/schemas/CreateAutoAccountAction'
    AgenticActionDownstream:
      type: object
      properties:
        recipient_id:
          type: string
        destination_id:
          type: string
        mandate_id:
          type: string
        scheduled_payment_ids:
          type: array
          items:
            type: string
        auto_account_id:
          type: string
          description: The provisioned auto-account (set for a create_auto_account action).
    AgenticAttachment:
      type: object
      description: |
        An input artifact attached to a conversation turn. Tagged union: exactly one payload field matching `type` is set. Extensible — further kinds (e.g. an email stream) are added as new `type` enum values + payload fields, additively, without breaking this shape.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - document
          description: The attachment kind — `document` (a PDF or image) today; further sources are added additively.
        document:
          $ref: '#/components/schemas/AgenticDocumentAttachment'
    AgenticChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        attachments:
          type: array
          description: |
            Input artifacts attached to this turn for the agent to investigate — e.g. an invoice PDF to draft a payment from. Optional. Document processing ships in a follow-up; until then a request that carries attachments is rejected with 400.
          items:
            $ref: '#/components/schemas/AgenticAttachment'
    AgenticDocumentAttachment:
      type: object
      required:
        - media_type
        - data
      properties:
        media_type:
          type: string
          enum:
            - application/pdf
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
          description: MIME type of the attached document.
        data:
          type: string
          format: byte
          description: The document bytes, base64-encoded.
        filename:
          type: string
          description: Optional original filename, for display and audit.
    AgenticInstruction:
      type: object
      properties:
        id:
          type: string
        payment_agent_id:
          type: string
        status:
          type: string
          enum:
            - proposed
            - executed
            - failed
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AgenticAction'
        downstream:
          type: array
          items:
            $ref: '#/components/schemas/AgenticActionDownstream'
    AgenticInstructionsResult:
      type: object
      properties:
        mandates:
          type: array
          description: Every mandate this batch DRAFTED, in full wire shape (identical to GET /alpha/mandates/{id}) — sign the §8 approval immediately, no follow-up fetch or polling. Pending until a signer other than the bound one approves.
          items:
            $ref: '#/components/schemas/Mandate'
        instruction_ids:
          type: array
          items:
            type: string
    AgenticProposal:
      type: object
      description: |
        A self-contained series of actions. Cross-action links are <entity>_id fields - empty binds to the artifact created in this proposal, a real id reuses an existing one. Every proposal must instruct a payment or draft a mandate - a mandate-only proposal is a standing authorization (sign now, schedule under it later by mandate_id with no new signature).
      required:
        - actions
      properties:
        summary:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AgenticAction'
    AgenticProposalsResult:
      type: object
      description: |
        The agent's next step. At least one of `proposals` or `reply` is always present in a successful response — `proposals` at high confidence (optionally with a short `reply` note), or `reply` alone when the agent needs more from the user.
      properties:
        proposals:
          type: array
          description: Validated action-series proposals, ready to accept via POST /instructions. Present only at high confidence.
          items:
            $ref: '#/components/schemas/AgenticProposal'
        reply:
          type: string
          description: The agent's conversational reply — a clarifying question or confirmation. Present without proposals when the agent needs more from the user; may accompany proposals as a short note.
        conversation_status:
          type: string
          description: 'How the boundary screen treated this turn: `ok` is a normal payments turn; `warned` means the request was off-topic and the customer was warned but may continue; `blocked` means the conversation has been terminated (repeated off-topic turns or a manipulation attempt) — the client should stop serving it and offer a fresh chat.'
    ApproveMandateRequest:
      type: object
      required:
        - approver_public_key
        - signature
      properties:
        approver_public_key:
          type: string
        signature:
          type: string
    CancelMandateRequest:
      type: object
      required:
        - signer_public_key
        - signature
      properties:
        signer_public_key:
          type: string
        signature:
          type: string
    CreatePaymentAgentRequest:
      type: object
      required:
        - customer_id
        - name
        - hosted
      properties:
        customer_id:
          type: string
        name:
          type: string
        hosted:
          type: boolean
          description: Must be true. Only hosted agents (signing keys custodied by the isolated agent-signer service) are supported today; bring-your-own-signer agents are not yet available, so the API rejects hosted=false.
    CreateBankDestinationAction:
      type: object
      properties:
        recipient_id:
          type: string
        account_holder_name:
          type: string
        account_number:
          type: string
        routing_number:
          type: string
        account_type:
          type: string
          enum:
            - checking
            - savings
        iban:
          type: string
        bic:
          type: string
        bank_name:
          type: string
    CreateCryptoDestinationAction:
      type: object
      required:
        - address
        - network_id
      properties:
        recipient_id:
          type: string
          description: 'recipient reference: empty = the recipient created in this proposal; a recipient id or name = an existing recipient'
        address:
          type: string
        network_id:
          $ref: '#/components/schemas/NetworkId'
    CreateInstructionsRequest:
      type: object
      required:
        - payment_agent_id
        - proposals
      properties:
        payment_agent_id:
          type: string
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/AgenticProposal'
    CreateMandateAction:
      type: object
      required:
        - rule
      properties:
        rule:
          $ref: '#/components/schemas/MandateRule'
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
    CreateMandateRequest:
      type: object
      required:
        - payment_agent_id
        - rule
      properties:
        payment_agent_id:
          type: string
          description: The mandate binds this agent's signer.
        rule:
          $ref: '#/components/schemas/MandateRule'
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
    CreateProposalsRequest:
      type: object
      description: |
        A freeform proposals conversation. The server is stateless — send the whole history in `messages` on each call. `prompt` is a convenience for a single-shot turn (or the latest user message); it is appended after `messages`. At least one of `prompt` or `messages` must be non-empty. Supplying both is valid only when `messages` does not already end with a user turn; otherwise the request is rejected with 400 (two consecutive user turns are not allowed).
      properties:
        prompt:
          type: string
          description: Single-shot input, appended as the latest user turn.
        messages:
          type: array
          description: The conversation so far, oldest first.
          items:
            $ref: '#/components/schemas/AgenticChatMessage'
    CreateScheduledPaymentsAction:
      type: object
      required:
        - amount
        - asset
      properties:
        destination_id:
          type: string
        wallet_id:
          type: string
          description: The funding wallet for these payments — one the agent recognizes. Optional only when the agent recognizes exactly one wallet (used by default); otherwise required, since a signer can recognize several and the choice cannot be deferred to fire time. Its chain family must match the payment network.
        amount:
          type: string
        asset:
          type: string
        dates:
          type: array
          maxItems: 366
          items:
            type: integer
            format: int64
        count:
          type: integer
          maximum: 366
        interval_seconds:
          type: integer
          format: int64
        start_at:
          type: integer
          format: int64
    CreateAutoAccountAction:
      type: object
      description: |
        Provision a provider-managed convert-and-forward "auto-account" so a payment can cross chain families (crypto→crypto swap) or exit to a bank (crypto→bank offramp). The agent pays the auto-account's crypto DEPOSIT on source_network_id (on the funding wallet's own family) and the provider converts source_asset→output_asset and forwards to destination_id. A scheduled payment then targets the deposit; the mandate still targets the real recipient.
      required:
        - source_asset
        - source_network_id
        - output_asset
      properties:
        destination_id:
          type: string
          description: 'The REAL destination the auto-account forwards to: a crypto destination (⇒ swap) or a bank destination (⇒ offramp). Empty = the destination created in this proposal.'
        source_asset:
          type: string
          description: The asset the agent deposits and the scheduled payment sends (may be the ANY wildcard).
        source_network_id:
          $ref: '#/components/schemas/NetworkId'
        output_asset:
          type: string
          description: The asset the recipient receives (a currency such as USD for a bank offramp).
        rail:
          type: string
          description: Outbound rail — REQUIRED for a bank offramp (e.g. ach, fedwire, swift, sepa); omit for a crypto swap.
        routing_preference:
          type: string
          enum:
            - fastest
            - cheapest
        fee_bps:
          type: integer
          format: int32
          description: Optional developer fee in basis points (0–10000).
    CreateScheduledPaymentRequest:
      type: object
      required:
        - signer_id
        - wallet_id
        - amount
        - asset
      description: |
        Direct (signer-first) schedule create. The signer + funding wallet are the caller's choice; the schedule is explicit `dates`, or `count` × `interval_seconds` from `start_at`. Name the payee EITHER with `destination_id` (an existing crypto destination of the wallet's customer) OR with a direct `address` + `network_id` (a raw crypto address, no recipient — matched on the address at fire time, like a mandate address target) — exactly one of the two.
      properties:
        signer_id:
          type: string
          description: The signer the payments bind to; its hosted agent signs at fire time.
        wallet_id:
          type: string
          description: |
            The funding wallet these payments spend from. Required — the signer must be permitted to spend on it, and its chain family must match the payment network.
        destination_id:
          type: string
          description: An existing crypto destination of the wallet's customer to pay. Omit to pay a direct address (address + network_id).
        address:
          type: string
          description: A direct crypto address to pay — an alternative to destination_id (no recipient). Requires network_id; the wallet's chain family must match.
        network_id:
          type: string
          description: The network for a direct-address payment (required together with address).
        amount:
          type: string
          description: Decimal string, at the destination asset.
        asset:
          type: string
        dates:
          type: array
          maxItems: 366
          items:
            type: integer
            format: int64
          description: Explicit per-payment unix times (one payment each). Win over count × interval_seconds.
        count:
          type: integer
          maximum: 366
          description: Number of payments when using count × interval_seconds (default 1).
        interval_seconds:
          type: integer
          format: int64
          description: Cadence in seconds between payments when using count.
        start_at:
          type: integer
          format: int64
          description: First due time (0 ⇒ now).
    Mandate:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - expired
            - rejected
            - revoked
            - done
          description: |
            expired is DERIVED, never stored - a pending or active mandate whose valid_until has passed. It cannot authorize payments and cannot be approved; it can still be cancelled.
        bound_signer_id:
          type: string
        target_names:
          type: array
          items:
            type: string
          description: |
            DERIVED, display-only - the rule's recipient targets resolved to names, parallel to rule.targets (raw id on a miss). Absent for address/any target kinds. The ids in the rule remain the grant.
        instruction_id:
          type: string
        rule:
          $ref: '#/components/schemas/MandateRule'
        valid_from:
          type: integer
          format: int64
        valid_until:
          type: integer
          format: int64
        approved_by_signer_id:
          type: string
        approved_at:
          type: integer
          format: int64
          description: Unix time of the §8 approval; absent until approved.
        rejected_by_signer_id:
          type: string
          description: The signer that cancelled the mandate while it was still pending (§8); absent otherwise.
        revoked_by_signer_id:
          type: string
          description: The signer that cancelled the mandate after activation (§8); absent otherwise.
    MandateResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - rejected
            - revoked
            - done
        approved_by_signer_id:
          type: string
        rejected_by_signer_id:
          type: string
          description: The signer that cancelled the mandate while it was still pending (§8); absent otherwise.
        revoked_by_signer_id:
          type: string
          description: The signer that cancelled the mandate after activation (§8); absent otherwise.
    MandateRule:
      type: object
      required:
        - target_type
        - asset
      properties:
        target_type:
          type: string
          enum:
            - any
            - recipient
            - address
        targets:
          type: array
          items:
            type: string
          description: One or more targets of the declared kind (recipient ids or addresses; empty for any). Max 32.
        network_id:
          type: string
        asset:
          type: string
        max_per_tx:
          type: string
        window:
          type: string
          enum:
            - NONE
            - WEEKLY
            - MONTHLY
          description: |
            Spend-cap window for the per-target limits (calendar, not rolling). NONE = lifetime; WEEKLY = calendar week from Monday 00:00 UTC; MONTHLY = calendar month from the 1st, 00:00 UTC.
        max_amount_per_target_in_window:
          type: string
          description: Cumulative cap over the window, PER TARGET (never shared across targets).
        max_count_per_target_in_window:
          type: integer
          description: Up to N times PER TARGET in the window (window NONE = lifetime).
    ScheduledPaymentResponse:
      type: object
      properties:
        id:
          type: string
        signer_id:
          type: string
          description: The signer (hosted agent) this payment fires under. Updatable via PATCH while scheduled.
        wallet_id:
          type: string
          description: The funding wallet this payment spends from (the customer's choice at acceptance; updatable via PATCH while scheduled).
        mandate_id:
          type: string
          description: AUDIT — the mandate that covered this payment at fire time. Absent until the payment executes (coverage is decided at fire time, not bound at rest).
        wallet_transaction_id:
          type: string
          description: AUDIT — the money-path transaction created when this payment fired. Absent until the payment executes.
        amount:
          type: string
        asset:
          type: string
        failure_reason:
          type: string
          description: Why the payment failed (e.g. the mandate gate's denied dimensions); absent unless status is failed.
        recipient_id:
          type: string
          description: The recipient this payment pays, when created from a destination. Absent for a direct-address payment. Use this — NOT the address — to resolve the payee (two payees can share a destination address).
        destination_id:
          type: string
          description: The REAL destination this settles to (a bank for an offramp, a crypto destination otherwise). For an auto-account payment the address is the crypto DEPOSIT while this names the bank/crypto target.
        destination_type:
          type: string
          enum:
            - bank
            - crypto
          description: The kind of the REAL destination. `bank` marks an offramp (crypto converts to fiat, forwarded via a bank rail); `crypto` a direct or cross-family crypto payout.
        destination_label:
          type: string
          description: A human label for the real destination — e.g. "Chase ••••5432" for a bank, or a shortened address for crypto — so a client shows which account the payment settles to without a second lookup.
        destination_rail:
          type: string
          description: For a bank destination, the payout rail (e.g. ach, fedwire, swift, sepa). Absent for crypto.
        output_asset:
          type: string
          description: The asset the recipient ULTIMATELY receives — the fiat currency (e.g. USD) for an offramp, else equal to `asset`. Stablecoin conversion is 1:1, so the output amount equals `amount`.
        output_network:
          type: string
          description: For a crypto destination, the network the recipient receives on — differs from `network_id` (the deposit network) for a cross-family swap (e.g. solana-devnet vs base-sepolia); equals `network_id` for a direct crypto payment; absent for a bank offramp.
        address:
          type: string
        network_id:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - cancelled
            - executed
            - failed
        executed_at:
          type: integer
          format: int64
        scheduled_at:
          type: integer
          format: int64
